<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respect Your Body - The Week Junior</title>
<style>
    :root {
        /* --- 主题色: 暖橙色 (Wellbeing) --- */
        --theme-color: #E67E22;
        
        /* --- 词性背景色 --- */
        --bg-noun: #D6EAF8; /* 名词-蓝 */
        --bg-verb: #D5F5E3; /* 动词-绿 */
        --bg-adj: #E8DAEF;  /* 形修-紫 */
        
        /* 布局参数 */
        --p-w: 1080px; 
        --p-h: 1440px; 
        --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        --font-eng: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        background: #555; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding: 40px 0; 
        font-family: var(--font-main); 
        color: #333;
    }

    /* 错误提示框 */
    #error-console {
        display: none;
        width: 80%;
        background: #fee;
        border: 2px solid red;
        padding: 20px;
        color: red;
        margin-bottom: 20px;
        white-space: pre-wrap;
    }

    /* 卡片容器 */
    .card { 
        width: var(--p-w); 
        height: var(--p-h); 
        background: white; 
        margin-bottom: 40px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        display: flex; 
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }

    /* 封面特定样式 */
    .cover-hero {
        height: 900px;
        background: #eee;
        border-bottom: 10px solid var(--theme-color);
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .cover-hero img { width: 100%; height: 100%; object-fit: cover; }
    .hero-tip { color: #888; font-size: 24px; border: 3px dashed #ccc; padding: 20px; border-radius: 10px; }
    
    .cover-header { padding: 40px 60px; text-align: center; }
    .meta-tag { display: inline-block; background: var(--theme-color); color: white; padding: 8px 24px; border-radius: 50px; font-weight: bold; font-size: 18px; margin-bottom: 20px; }
    .main-title { font-family: var(--font-eng); font-size: 64px; font-weight: 700; line-height: 1.1; margin-bottom: 20px; color: #2c3e50; }
    .sub-title { font-size: 24px; color: #7f8c8d; line-height: 1.5; padding: 0 40px; }

    /* 通用页头页脚 */
    .page-header { height: 80px; padding: 0 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f0f0f0; }
    .ph-title { font-family: var(--font-eng); font-weight: bold; font-size: 24px; color: #333; }
    .page-footer { height: 60px; margin-top: auto; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; color: #999; font-size: 14px; }

    /* 内容区域 */
    .content-area { flex: 1; padding: 40px 60px; display: flex; flex-direction: column; gap: 0; }
    
    /* 文章行 */
    .row { display: flex; gap: 40px; padding: 25px 0; border-bottom: 1px solid #f5f5f5; }
    .col-eng { flex: 6; font-family: var(--font-eng); font-size: 22px; line-height: 1.6; color: #2c3e50; text-align: justify; }
    .col-chi { flex: 4; font-size: 18px; line-height: 1.8; color: #666; text-align: justify; }

    /* 侧边栏样式 */
    .supp-box { background: #FFF8F0; padding: 30px; border-radius: 15px; border-left: 8px solid var(--theme-color); margin: 20px 0; }
    .supp-title { color: var(--theme-color); font-size: 24px; margin-bottom: 15px; font-weight: 900; }
    .supp-item { margin-bottom: 20px; }
    .supp-eng { font-family: var(--font-eng); font-size: 20px; margin-bottom: 8px; color: #444; }
    .supp-chi { font-size: 16px; color: #888; }

    /* 单词高亮 */
    .hl { padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .n { background: var(--bg-noun); } .v { background: var(--bg-verb); } .adj { background: var(--bg-adj); }

    /* 词汇表 */
    .section-title { font-size: 24px; font-weight: bold; border-left: 6px solid #555; padding-left: 15px; margin: 30px 0 20px 0; }
    .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .v-card { background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .v-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .v-w { font-family: var(--font-eng); font-size: 24px; font-weight: bold; color: #2c3e50; }
    .v-p { font-style: italic; color: var(--theme-color); font-family: serif; }
    .v-m { font-weight: bold; color: #555; }
    .v-sent { font-family: var(--font-eng); color: #777; font-style: italic; font-size: 16px; margin-top: 5px; }

    /* 长难句 */
    .chunk-box { display: flex; flex-wrap: wrap; gap: 10px; line-height: 1.8; margin-bottom: 20px; }
    .chunk { display: flex; flex-direction: column; align-items: center; }
    .c-txt { font-family: var(--font-eng); font-size: 24px; padding: 2px 5px; border-bottom: 3px solid #ddd; }
    .c-lbl { font-size: 12px; font-weight: bold; color: #888; margin-top: 4px; text-transform: uppercase; }
    
    /* 隐藏上传控件 */
    #upload-input { display: none; }
    
    /* 提示按钮 */
    .save-tip {
        position: fixed; bottom: 30px; right: 30px;
        background: #333; color: #fff; padding: 15px 25px;
        border-radius: 50px; font-weight: bold;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        z-index: 999;
    }
</style>
</head>
<body>

    <div id="error-console"></div>

    <input type="file" id="upload-input" accept="image/*" onchange="loadCover(event)">

    <div id="app"></div>

    <div class="save-tip">请使用系统截图工具保存 (Win: Shift+Win+S / Mac: Cmd+Shift+4)</div>

<script>
// --- 错误捕获 ---
window.onerror = function(msg, url, line) {
    const box = document.getElementById('error-console');
    box.style.display = 'block';
    box.innerHTML += `Error: ${msg}\nLine: ${line}\n`;
    return false;
};

// --- 数据源 (Based on Source 1884-1907) ---
const DATA = {
    issue: "17 January 2026",
    title: "Respect Your Body",
    subtitle: "Having a positive body image means respecting all the amazing things your body can do.<br>拥有积极的身体形象意味着尊重你的身体所能做的所有了不起的事情。",
    theme: "#E67E22", // Warm Orange
    
    articles: [
        {
            eng: "Body <span class='hl n'>image</span> is how you think and feel about the way you look. Having a positive body image means you <span class='hl v'>appreciate</span> your body, whatever it looks like or can do.",
            chi: "身体形象是你对自己外表的看法和感受。拥有积极的身体形象意味着无论你的身体看起来如何或能做什么，你都能欣赏它。"
        },
        {
            eng: "Dr Tharaka Gunarathne is a <span class='hl n'>psychologist</span> (someone who helps people understand their emotions). He says body image can be <span class='hl v'>influenced</span> by what you see on TV and social media, as well as friends and family.",
            chi: "Tharaka Gunarathne 博士是一位心理学家（帮助人们理解自己情绪的人）。他说，身体形象会受到你在电视和社交媒体上看到的内容，以及朋友和家人的影响。"
        },
        {
            eng: "<span class='hl n'>Puberty</span>, when a child’s body develops and changes as they become an adult, can make a difference too. It’s normal to care about how you look, but when you worry about it too much it can affect your mood.",
            chi: "青春期，即孩子的身体发育并转变为成人的过程，也会产生影响。关心自己的外表是正常的，但如果你过于担心，就会影响你的情绪。"
        },
        {
            eng: "Research shows that when you understand how <span class='hl adj'>amazing</span> your body is you are more likely to treat it with <span class='hl n'>respect</span> and kindness.",
            chi: "研究表明，当你了解你的身体有多么奇妙时，你就更有可能尊重并善待它。"
        },
        {
            eng: "If you’re busy worrying about having perfect hair or how tall you are, you can forget all the <span class='hl adj'>brilliant</span> things your body can do like cycling, crafting, dancing or swimming.",
            chi: "如果你忙于担心拥有完美的头发或身高，你可能会忘记你的身体能做的所有精彩事情，比如骑车、手工、跳舞或游泳。"
        }
    ],

    sidebar: {
        title: "Molly Forbes’s Tips (Molly Forbes 的建议)",
        items: [
            { t: "Remember that all bodies are good bodies.", c: "记住所有的身体都是好身体。", e: "Try to spot messages that make you think some bodies are “good” or “bad”.", ch: "试着识别那些让你觉得某些身体是“好”或“坏”的信息。" },
            { t: "Celebrate differences.", c: "庆祝差异。", e: "Even if everybody ate the same food, everyone would still have different types of bodies.", ch: "即使每个人都吃同样的食物，每个人的体型仍然会不同。" },
            { t: "Love your body.", c: "爱你的身体。", e: "Celebrate your body for what it can do. Think of the ways it lets you live your life.", ch: "为你的身体所能做的事而庆祝。想想它让你生活的方式。" }
        ]
    },

    vocab: [
        { w: "Appreciate", p: "v.", m: "欣赏；感激", s: "You should appreciate your body." },
        { w: "Psychologist", p: "n.", m: "心理学家", s: "The psychologist helps understand emotions." },
        { w: "Influence", p: "v.", m: "影响", s: "TV can influence how we feel." },
        { w: "Puberty", p: "n.", m: "青春期", s: "Puberty is when a body changes." },
        { w: "Respect", p: "n./v.", m: "尊重", s: "Treat your body with respect." },
        { w: "Brilliant", p: "adj.", m: "杰出的；精彩的", s: "Our bodies can do brilliant things." }
    ],

    sentence: {
        trans: "研究表明，当你了解你的身体有多么奇妙时，你就更有可能尊重并善待它。",
        chunks: [
            { t: "Research", l: "Subj" }, { t: "shows", l: "Verb" }, { t: "that", l: "Conn" },
            { t: "(", l: "" }, { t: "when", l: "Conn" }, { t: "you", l: "Subj" }, { t: "understand", l: "Verb" },
            { t: "how amazing your body is", l: "Obj-Cl" }, { t: ")", l: "" },
            { t: "you", l: "Subj" }, { t: "are more likely to treat", l: "Verb" }, { t: "it", l: "Obj" }
        ]
    }
};

// --- 渲染逻辑 (Pure JS) ---
function render() {
    const app = document.getElementById('app');
    
    // 1. 封面页
    const cover = document.createElement('div');
    cover.className = 'card';
    cover.innerHTML = `
        <div class="cover-hero" onclick="document.getElementById('upload-input').click()">
            <img id="hero-img" style="display:none">
            <div class="hero-tip" id="hero-txt">点击此处上传封面图片</div>
        </div>
        <div class="cover-header">
            <span class="meta-tag">${DATA.issue}</span>
            <h1 class="main-title">${DATA.title}</h1>
            <div class="sub-title">${DATA.subtitle}</div>
        </div>
        <div class="page-footer">
            <span>Designed for Education</span>
            <span>Page 1</span>
        </div>
    `;
    app.appendChild(cover);

    // 2. 正文页
    const page2 = document.createElement('div');
    page2.className = 'card';
    page2.innerHTML = `
        <div class="page-header">
            <div class="ph-title">${DATA.title}</div>
            <div style="color:#999">Continued...</div>
        </div>
        <div class="content-area" id="content-2"></div>
        <div class="page-footer"><span>The Week Junior</span><span>Page 2</span></div>
    `;
    app.appendChild(page2);

    const c2 = page2.querySelector('#content-2');
    
    // 渲染正文
    DATA.articles.forEach(art => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div class="col-eng">${art.eng}</div><div class="col-chi">${art.chi}</div>`;
        c2.appendChild(row);
    });

    // 渲染侧边栏 (Molly's Tips)
    const supp = document.createElement('div');
    supp.className = 'supp-box';
    let suppHTML = `<div class="supp-title">${DATA.sidebar.title}</div>`;
    DATA.sidebar.items.forEach(item => {
        suppHTML += `
            <div class="supp-item">
                <div class="supp-eng"><b>${item.t}</b> ${item.e}</div>
                <div class="supp-chi"><b>${item.c}</b> ${item.ch}</div>
            </div>`;
    });
    supp.innerHTML = suppHTML;
    c2.appendChild(supp);

    // 3. 教研页
    const page3 = document.createElement('div');
    page3.className = 'card';
    page3.innerHTML = `
        <div class="page-header"><div class="ph-title">Vocabulary & Analysis</div></div>
        <div class="content-area" id="content-3"></div>
        <div class="page-footer"><span>Study Notes</span><span>Page 3</span></div>
    `;
    app.appendChild(page3);
    const c3 = page3.querySelector('#content-3');

    // 词汇
    c3.innerHTML += `<div class="section-title">Core Vocabulary</div>`;
    const vGrid = document.createElement('div');
    vGrid.className = 'vocab-grid';
    DATA.vocab.forEach(v => {
        vGrid.innerHTML += `
            <div class="v-card">
                <div class="v-top">
                    <span class="v-w">${v.w}</span>
                    <span class="v-p">${v.p}</span>
                    <span class="v-m">${v.m}</span>
                </div>
                <div class="v-sent">"${v.s}"</div>
            </div>`;
    });
    c3.appendChild(vGrid);

    // 长难句
    c3.innerHTML += `<div class="section-title">Sentence Structure</div>`;
    const sBox = document.createElement('div');
    sBox.className = 'chunk-box';
    DATA.sentence.chunks.forEach(c => {
        const borderCol = c.l.includes('Subj') ? '#C0392B' : c.l.includes('Verb') ? '#2980B9' : '#ccc';
        sBox.innerHTML += `
            <div class="chunk">
                <div class="c-txt" style="border-color:${borderCol}">${c.t}</div>
                <div class="c-lbl" style="color:${borderCol}">${c.l}</div>
            </div>`;
    });
    c3.appendChild(sBox);
    c3.innerHTML += `<div style="padding:15px; background:#f0f0f0; border-radius:8px; margin-top:10px"><b>翻译：</b>${DATA.sentence.trans}</div>`;
}

// --- 图片上传逻辑 ---
function loadCover(e) {
    const file = e.target.files[0];
    if (file) {
        const url = URL.createObjectURL(file);
        const img = document.getElementById('hero-img');
        const txt = document.getElementById('hero-txt');
        img.src = url;
        img.style.display = 'block';
        txt.style.display = 'none';
    }
}

// --- 立即执行 ---
try {
    render();
} catch (e) {
    document.getElementById('error-console').style.display = 'block';
    document.getElementById('error-console').innerText = "Render Error: " + e.message;
}
</script>
</body>
</html>
