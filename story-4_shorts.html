<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shorts Pro - Custom Background Edition</title>
    <style>
        :root {
            --word-active-color: #ccff00; 
            --female-color: #ec4899; 
            --male-color: #2dd4bf;   
            --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0; padding: 0; background-color: #000;
            font-family: var(--font-stack);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; color: white; user-select: none;
            overflow-x: hidden; overflow-y: auto; 
        }

        #stageScaler {
            margin-top: 20px; width: 90vw; max-width: 450px; 
            aspect-ratio: 9 / 16; display: flex; align-items: center;
            justify-content: center; position: relative; z-index: 10;
        }

        #stageArea {
            width: 1080px; height: 1920px;
            position: absolute; 
            background-image: url('{{BG_SRC}}'); /* 默认由 Python 填入，或手动选择 */
            background-size: cover; background-position: center;
            overflow: hidden; box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            transform-origin: center center;
        }

        .overlay-layer {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 1;
        }

        /* 顶部 Header */
        .speaker-header {
            position: absolute; top: 90px; left: 90px; right: 90px;
            z-index: 5; display: flex; align-items: center;
            justify-content: space-between; isolation: isolate;
        }

        .speaker-info { display: flex; align-items: center; gap: 25px; flex-shrink: 0; }
        
        .avatar {
            width: 75px; height: 75px; border-radius: 50%;
            background-size: cover; background-position: center;
            border: 6px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            background-image: url('female.png'); /* 默认 Female */
        }

        .speaker-name {
            font-size: 45px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; color: #fff; mix-blend-mode: exclusion;
        }

        .speaker-state-female .avatar { border-color: var(--female-color); box-shadow: 0 0 20px var(--female-color); }
        .speaker-state-male .avatar { border-color: var(--male-color); box-shadow: 0 0 20px var(--male-color); }

        .progress-indicator { display: flex; align-items: center; justify-content: flex-end; width: 520px; }
        #timerText { font-size: 32px; font-weight: 700; color: #fff; mix-blend-mode: exclusion; font-family: monospace; }
        
        .wave-container { 
            display: flex; gap: 6px; height: 60px; margin-left: 25px; 
            align-items: center; mix-blend-mode: exclusion;
        }
        .wave-bar { width: 5px; background: rgba(255,255,255,0.4); border-radius: 3px; transition: background-color 0.2s; }
        .wave-bar.active { background: #fff; }

        /* === 文字区域：同步顶部 240px 位置 === */
        .text-block {
            position: absolute;
            top: 240px; 
            left: 0; width: 100%;
            padding: 0 100px; box-sizing: border-box;
            z-index: 2;
            display: flex; flex-direction: column; gap: 35px;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .text-block.visible { opacity: 1; transform: translateY(0); }

        .english-content {
            font-size: 70px; 
            line-height: 1.45; font-weight: 800;
            text-align: left; color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.5);
        }

        .chinese-content {
            font-size: 40px; 
            line-height: 1.5; font-weight: 500;
            text-align: left; color: rgba(255, 255, 255, 0.6);
            mix-blend-mode: exclusion;
        }

        .word { display: inline; transition: color 0.15s ease; }
        .word.active { color: var(--word-active-color) !important; text-shadow: 0 0 15px rgba(204,255,0,0.6); }

        /* 面板控制 */
        body.recording-mode .controls-panel { display: none !important; }
        body.recording-mode #stageScaler { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; margin: 0; }
        
        .controls-panel {
            padding: 30px; display: flex; gap: 12px; flex-wrap: wrap;
            justify-content: center; max-width: 500px; z-index: 20;
            background: #121212; width: 100%; box-sizing: border-box;
        }
        .ctrl-btn {
            padding: 12px 24px; background: #222; color: #fff;
            border: 1px solid #444; border-radius: 12px; cursor: pointer;
            font-size: 14px; font-weight: 600;
        }
        .record-btn { background: #ef4444; border: none; }
    </style>
</head>
<body class="speaker-state-female">

<div id="stageScaler">
    <div id="stageArea">
        <div class="overlay-layer"></div>

        <div id="headerContainer" class="speaker-header speaker-state-female">
            <div class="speaker-info">
                <div id="avatarEl" class="avatar"></div>
                <div id="nameEl" class="speaker-name">周末英语剧场</div>
            </div>
            <div class="progress-indicator">
                <span id="timerText">00:00</span>
                <div id="waveContainer" class="wave-container"></div>
            </div>
        </div>

        <div id="textContainer" class="text-block">
            <div id="englishArea" class="english-content"></div>
            <div id="chineseArea" class="chinese-content"></div>
        </div>
    </div>
</div>

<div class="controls-panel">
    <input type="file" id="bgInput" style="display:none;" accept="image/*">
    <button class="ctrl-btn" onclick="document.getElementById('bgInput').click()">🖼️ 换背景</button>
    <button class="ctrl-btn" onclick="toggleColor()">🎨 换颜色</button>
    <button class="ctrl-btn" onclick="adjustFontSize(5)">A+</button>
    <button class="ctrl-btn" onclick="adjustFontSize(-5)">A-</button>
    <button class="ctrl-btn" id="playBtn">▶️ 播放预览</button>
    <button class="ctrl-btn record-btn" id="mobileRecordBtn">📱 全屏录制</button>
</div>

<audio id="audioPlayer">
    <source src="story-4.m4a" type="audio/mp4">
</audio>

    const audio = document.getElementById('audioPlayer');
    const stageArea = document.getElementById('stageArea');
    const textContainer = document.getElementById('textContainer');
    const englishArea = document.getElementById('englishArea');
    const chineseArea = document.getElementById('chineseArea');
    const timerText = document.getElementById('timerText');
    const avatarEl = document.getElementById('avatarEl');
    const waveContainer = document.getElementById('waveContainer');
    const headerContainer = document.getElementById('headerContainer');
    const bgInput = document.getElementById('bgInput');

    let processedBlocks = []; 
    let currentBlockIndex = -1;
    let currentFontSize = 70; 
    const WAVE_BAR_COUNT = 30;

    // 处理本地背景更换
    bgInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                stageArea.style.backgroundImage = `url('${event.target.result}')`;
            };
            reader.readAsDataURL(file);
        }
    });

    // 智能拆分逻辑
    function segmentData(data) {
        const WORD_LIMIT = 20;
        let blocks = [];
        data.forEach(item => {
            let words = item.words || [];
            if (words.length <= WORD_LIMIT) {
                blocks.push({...item});
            } else {
                let startIdx = 0;
                while (startIdx < words.length) {
                    let takeCount = Math.min(WORD_LIMIT, words.length - startIdx);
                    if (startIdx + takeCount < words.length) {
                        for (let j = startIdx + takeCount - 1; j > startIdx + 5; j--) {
                            if (/[.,!?;]/.test(words[j].word)) { takeCount = j - startIdx + 1; break; }
                        }
                    }
                    let chunk = words.slice(startIdx, startIdx + takeCount);
                    blocks.push({
                        speaker: item.speaker,
                        start: chunk[0].start,
                        end: chunk[chunk.length - 1].end,
                        words: chunk,
                        sentence_zh: item.sentence_zh
                    });
                    startIdx += takeCount;
                }
            }
        });
        return blocks;
    }

    function init() {
        processedBlocks = segmentData(transcriptData);
        waveContainer.innerHTML = '';
        const h = [30, 50, 80, 60, 40, 70, 90, 100, 80, 50, 40, 60, 80, 90, 70, 50, 30, 40, 60, 80, 100, 90, 70, 50, 40, 60, 80, 60, 40, 30];
        for(let i=0; i<WAVE_BAR_COUNT; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = h[i % h.length] + '%';
            waveContainer.appendChild(bar);
        }
        updateScale();
        audio.addEventListener('loadedmetadata', () => { timerText.innerText = formatTime(audio.duration); });
    }

    function updateScale() {
        const scale = document.getElementById('stageScaler').offsetWidth / 1080;
        document.getElementById('stageArea').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', updateScale);

    function renderLoop() {
        if (!audio.paused) {
            const t = audio.currentTime;
            updateTimeline(t);
            const pct = t / audio.duration;
            const activeIdx = Math.floor(pct * WAVE_BAR_COUNT);
            document.querySelectorAll('.wave-bar').forEach((b, i) => i <= activeIdx ? b.classList.add('active') : b.classList.remove('active'));
            timerText.innerText = "-" + formatTime(audio.duration - t);
            requestAnimationFrame(renderLoop);
        }
    }

    function updateTimeline(t) {
        let activeIdx = -1;
        for (let i = 0; i < processedBlocks.length; i++) {
            if (t >= processedBlocks[i].start && t < processedBlocks[i].end + 0.1) { activeIdx = i; break; }
        }
        if (activeIdx !== -1 && activeIdx !== currentBlockIndex) {
            currentBlockIndex = activeIdx;
            textContainer.classList.remove('visible');
            setTimeout(() => { renderBlock(activeIdx); textContainer.classList.add('visible'); }, 50);
        }
        if (currentBlockIndex !== -1) {
            const spans = englishArea.querySelectorAll('.word');
            spans.forEach(span => {
                const s = parseFloat(span.dataset.start), e = parseFloat(span.dataset.end);
                if (t >= s && t < e) span.classList.add('active'); else span.classList.remove('active');
            });
        }
    }

    function renderBlock(index) {
        const block = processedBlocks[index];
        englishArea.innerHTML = '';
        block.words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'word'; span.innerText = w.word;
            span.dataset.start = w.start; span.dataset.end = w.end;
            englishArea.appendChild(span);
            englishArea.appendChild(document.createTextNode(" "));
        });
        chineseArea.innerText = block.sentence_zh || "";
        
        // 📍 严谨 Speaker 逻辑判断
        const lower = (block.speaker || "").toLowerCase();
        headerContainer.classList.remove('speaker-state-female', 'speaker-state-male');
        if (lower.includes('male') && !lower.includes('female')) {
            headerContainer.classList.add('speaker-state-male');
            avatarEl.style.backgroundImage = "url('male.png')";
        } else {
            headerContainer.classList.add('speaker-state-female');
            avatarEl.style.backgroundImage = "url('female.png')";
        }
    }

    function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }

    document.getElementById('playBtn').addEventListener('click', () => { if(audio.paused) { audio.play(); renderLoop(); } else { audio.pause(); } });
    document.getElementById('mobileRecordBtn').addEventListener('click', () => {
        document.body.classList.add('recording-mode');
        const scale = window.innerWidth / 1080;
        document.getElementById('stageArea').style.transform = `scale(${scale})`;
        setTimeout(() => { audio.currentTime = 0; audio.play(); renderLoop(); }, 5000);
    });

    window.adjustFontSize = function(delta) { 
        currentFontSize += delta; 
        englishArea.style.fontSize = currentFontSize + "px"; 
        chineseArea.style.fontSize = (currentFontSize - 30) + "px"; 
    }
    
    init();
</script>
