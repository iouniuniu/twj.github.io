<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shorts Pro Generator</title>
    <style>
        :root {
            --word-active-color: #ccff00; 
            --female-color: #ec4899; 
            --male-color: #2dd4bf;   
            --unknown-color: #9ca3af;
            --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: #121212;
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto; 
        }

        #stageScaler {
            margin-top: 20px;
            width: 90vw; 
            max-width: 450px; 
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        #stageArea {
            width: 1080px; height: 1920px;
            position: absolute;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            transform-origin: center center;
        }

        .bg-layer {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .overlay-layer {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .speaker-header {
            position: absolute;
            top: 90px; left: 90px; right: 90px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            isolation: isolate; 
        }

        .speaker-info {
            display: flex; align-items: center;
            gap: 25px; flex-shrink: 0;
        }

        .avatar {
            width: 75px; height: 75px;
            border-radius: 50%;
            background-color: #ddd;
            background-size: cover;
            background-position: center;
            border: 6px solid rgba(255,255,255,0.8);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .speaker-name {
            font-size: 45px; font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px; color: #fff;
            mix-blend-mode: exclusion;
        }

        .progress-indicator {
            display: flex; align-items: center;
            justify-content: flex-end;
            width: 480px; mix-blend-mode: exclusion;
        }

        #timerText {
            font-size: 32px; font-weight: 700;
            color: #fff; margin-right: 20px;
            flex-shrink: 0; font-family: monospace;
        }

        .wave-container {
            display: flex; align-items: center;
            gap: 6px; height: 60px;
            width: 300px; justify-content: flex-end;
        }

        .wave-bar {
            width: 5px; background-color: rgba(255, 255, 255, 0.2);
            border-radius: 3px; transition: background-color 0.2s;
        }
        .wave-bar.active { background-color: rgba(255, 255, 255, 1); }

        .speaker-state-female .avatar { border-color: var(--female-color); }
        .speaker-state-male .avatar { border-color: var(--male-color); }

        /* === 2. 文本块布局 === */
        .text-block {
            position: absolute;
            top: 240px; left: 0; width: 100%;
            padding: 0 100px; box-sizing: border-box;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 40px; /* 英中之间的间距 */
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .text-block.visible { opacity: 1; transform: translateY(0); }

        /* 英文样式 */
        .english-content {
            font-size: 74px;
            line-height: 1.45;
            text-align: left;
            font-weight: 800;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* 📍 中文样式优化 */
        .chinese-content {
            font-size: 54px; /* 比英文小两号 */
            line-height: 1.5;
            text-align: left;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6); /* 暗淡一些 */
            mix-blend-mode: exclusion; /* 自适应背景 */
        }

        .word {
            display: inline; color: inherit;
            transition: color 0.15s ease, text-shadow 0.15s ease;
        }
        .word.active {
            color: var(--word-active-color) !important;
            text-shadow: 0 0 30px rgba(204, 255, 0, 0.8);
        }

        /* 录制与沉浸 */
        body.recording-mode { overflow: hidden !important; background-color: #000; }
        body.recording-mode #stageScaler { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; margin: 0; z-index: 9999; }
        body.recording-mode #stageArea { box-shadow: none; }
        body.recording-mode .controls-panel { display: none !important; }

        .controls-panel {
            padding: 30px; display: flex; gap: 12px;
            flex-wrap: wrap; justify-content: center;
            max-width: 500px; z-index: 5;
            background: #121212; width: 100%; box-sizing: border-box;
        }
        .ctrl-btn {
            padding: 12px 20px; background: #2a2a2a;
            color: #efefef; border: 1px solid #444;
            border-radius: 12px; cursor: pointer;
            font-size: 14px; font-weight: 600;
        }
        .primary-btn { background: #a855f7; border: none; color: white; }
        .record-btn { background: #ef4444; border: none; color: white; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="stageScaler">
    <div id="stageArea">
        <img id="bgImage" class="bg-layer" src="cover.jpg" alt="Background">
        <div class="overlay-layer"></div>

        <div id="headerContainer" class="speaker-header">
            <div class="speaker-info">
                <div id="avatarEl" class="avatar"></div>
                <div id="nameEl" class="speaker-name">周末英语剧场</div>
            </div>
            <div class="progress-indicator">
                <span id="timerText">00:00</span>
                <div id="waveContainer" class="wave-container"></div>
            </div>
        </div>

        <div id="textContainer" class="text-block">
            <div id="englishArea" class="english-content"></div>
            <div id="chineseArea" class="chinese-content"></div>
        </div>
    </div>
</div>

<div id="hiddenTitle" style="display:none;">story-1</div>

<div class="controls-panel">
    <button class="ctrl-btn" onclick="document.getElementById('bgInput').click()">🖼️ 更换背景</button>
    <input type="file" id="bgInput" accept="image/*" onchange="changeBackground(this)">
    <button class="ctrl-btn" onclick="toggleColor()">🎨 换颜色</button>
    <button class="ctrl-btn" onclick="adjustFontSize(10)">A+</button>
    <button class="ctrl-btn" onclick="adjustFontSize(-10)">A-</button>
    <button class="ctrl-btn primary-btn" id="playBtn">▶️ 预览</button>
    <button class="ctrl-btn record-btn" id="recordVideoBtn" style="display:none;">🎥 电脑内录</button>
    <button class="ctrl-btn record-btn" id="mobileRecordBtn" style="display:none;">📱 手机全屏</button>
</div>

<audio id="audioPlayer">
    <source src="story-1.mp3" type="audio/mp4">
</audio>

    const audio = document.getElementById('audioPlayer');
    const stageScaler = document.getElementById('stageScaler');
    const stageArea = document.getElementById('stageArea');
    const headerContainer = document.getElementById('headerContainer');
    const avatarEl = document.getElementById('avatarEl');
    const nameEl = document.getElementById('nameEl');
    const textContainer = document.getElementById('textContainer');
    const englishArea = document.getElementById('englishArea');
    const chineseArea = document.getElementById('chineseArea');
    const timerTextEl = document.getElementById('timerText');
    const waveContainer = document.getElementById('waveContainer');
    const playBtn = document.getElementById('playBtn');
    const recordVideoBtn = document.getElementById('recordVideoBtn');
    const mobileRecordBtn = document.getElementById('mobileRecordBtn');
    const bgImage = document.getElementById('bgImage');

    let processedBlocks = []; 
    let currentBlockIndex = -1;
    let currentFontSize = 74; 
    let isImmersive = false;

    const WORD_LIMIT = 20; 
    const WAVE_BAR_COUNT = 30;

    function formatTime(seconds) {
        const m = Math.floor(Math.max(0, seconds) / 60);
        const s = Math.floor(Math.max(0, seconds) % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateScale() {
        const scale = stageScaler.offsetWidth / 1080;
        stageArea.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', updateScale);

    function createWaveform() {
        waveContainer.innerHTML = '';
        const heights = [30, 50, 80, 60, 40, 70, 90, 100, 80, 50, 40, 60, 80, 90, 70, 50, 30, 40, 60, 80, 100, 90, 70, 50, 40, 60, 80, 60, 40, 30];
        for (let i = 0; i < WAVE_BAR_COUNT; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = heights[i % heights.length] + '%';
            waveContainer.appendChild(bar);
        }
    }

    /* 📍 增强分段逻辑：同时处理中文翻译 */
    function segmentData(data) {
        if (!data || data.length === 0) return [];
        let blocks = [];
        let currentBlock = { speaker: data[0].speaker, start: data[0].start, end: 0, words: [], zh_sentences: [] };

        data.forEach((sentence, index) => {
            const wordCountInSentence = sentence.words ? sentence.words.length : 0;
            const speakerChanged = sentence.speaker !== currentBlock.speaker;
            
            if ((speakerChanged || (currentBlock.words.length + wordCountInSentence > WORD_LIMIT)) && currentBlock.words.length > 0) {
                blocks.push(currentBlock);
                currentBlock = { speaker: sentence.speaker, start: sentence.start, end: 0, words: [], zh_sentences: [] };
            }

            if (sentence.words) currentBlock.words.push(...sentence.words);
            // 📍 记录对应的中文
            if (sentence.sentence_zh) currentBlock.zh_sentences.push(sentence.sentence_zh);
            
            currentBlock.end = sentence.end;

            if (index === data.length - 1) blocks.push(currentBlock);
        });
        return blocks;
    }

    function setInitialState() {
        avatarEl.style.backgroundImage = "url('female.png')";
        nameEl.innerText = "周末英语剧场";
        headerContainer.className = 'speaker-header';
        englishArea.innerHTML = "";
        chineseArea.innerHTML = "";
        if (audio.duration) timerTextEl.innerText = formatTime(audio.duration);
    }

    function init() {
        processedBlocks = segmentData(rawTranscriptData);
        createWaveform();
        checkDevice();
        setInitialState();
        setTimeout(updateScale, 100);
        audio.addEventListener('loadedmetadata', () => { timerTextEl.innerText = formatTime(audio.duration); });
    }

    function renderLoop() {
        if (!audio.paused) {
            updateTimeline();
            const pct = audio.currentTime / audio.duration;
            const activeBarIndex = Math.floor(pct * WAVE_BAR_COUNT);
            document.querySelectorAll('.wave-bar').forEach((bar, i) => {
                if (i <= activeBarIndex) bar.classList.add('active');
                else bar.classList.remove('active');
            });
            timerTextEl.innerText = "-" + formatTime(audio.duration - audio.currentTime);
            requestAnimationFrame(renderLoop);
        }
    }

    function updateTimeline() {
        const t = audio.currentTime;
        let activeIdx = -1;
        for (let i = 0; i < processedBlocks.length; i++) {
            if (t >= processedBlocks[i].start && t < processedBlocks[i].end + 0.1) {
                activeIdx = i; break;
            }
        }
        if (activeIdx !== -1 && activeIdx !== currentBlockIndex) {
            currentBlockIndex = activeIdx;
            textContainer.classList.remove('visible');
            setTimeout(() => { renderBlock(activeIdx); textContainer.classList.add('visible'); }, 50);
        }
        if (currentBlockIndex !== -1) {
            const spans = englishArea.querySelectorAll('.word');
            spans.forEach(span => {
                const s = parseFloat(span.dataset.start), e = parseFloat(span.dataset.end);
                if (t >= s && t < e) span.classList.add('active');
                else span.classList.remove('active');
            });
        }
    }

    function renderBlock(index) {
        const block = processedBlocks[index];
        const spkName = block.speaker || "Unknown";
        nameEl.innerText = spkName;
        headerContainer.classList.remove('speaker-state-female', 'speaker-state-male');
        const lowerName = spkName.toLowerCase();
        if (lowerName.includes('female')) {
            headerContainer.classList.add('speaker-state-female');
            avatarEl.style.backgroundImage = "url('female.png')";
        } else if (lowerName.includes('male')) {
            headerContainer.classList.add('speaker-state-male');
            avatarEl.style.backgroundImage = "url('male.png')";
        }

        // 渲染英文单词
        englishArea.innerHTML = ''; 
        block.words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'word'; span.innerText = w.word;
            span.dataset.start = w.start; span.dataset.end = w.end;
            englishArea.appendChild(span);
            englishArea.appendChild(document.createTextNode(" ")); 
        });

        // 📍 渲染中文段落
        chineseArea.innerText = block.zh_sentences.join(' ');
    }

    function checkDevice() {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) recordVideoBtn.style.display = 'flex';
        else mobileRecordBtn.style.display = 'flex';
    }

    function enterImmersive() {
        isImmersive = true;
        document.body.classList.add('recording-mode');
        const scale = window.innerWidth / 1080;
        stageArea.style.transform = `scale(${scale})`;
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    }

    function exitImmersive() {
        isImmersive = false;
        document.body.classList.remove('recording-mode');
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        updateScale();
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); renderLoop(); playBtn.innerText = "⏸ 暂停"; }
        else { audio.pause(); playBtn.innerText = "▶️ 预览"; }
    });

    mobileRecordBtn.addEventListener('click', () => {
        enterImmersive();
        setTimeout(() => { audio.currentTime = 0; audio.play(); renderLoop(); }, 5000);
    });

    audio.addEventListener('ended', () => {
        playBtn.innerText = "▶️ 预览";
        if (isImmersive) exitImmersive();
        setInitialState();
        currentBlockIndex = -1;
    });

    window.changeBackground = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => bgImage.src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    window.adjustFontSize = function(delta) {
        currentFontSize += delta;
        englishArea.style.fontSize = currentFontSize + "px";
        chineseArea.style.fontSize = (currentFontSize - 20) + "px";
    }

    window.toggleColor = function() {
        const colors = ['#ccff00', '#00ffcc', '#007aff', '#ff00ff'];
        const current = getComputedStyle(document.documentElement).getPropertyValue('--word-active-color').trim();
        let next = colors[(colors.indexOf(current) + 1) % colors.length];
        document.documentElement.style.setProperty('--word-active-color', next);
    }

    recordVideoBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 1080, height: 1920, frameRate: 60 },
                audio: { echoCancellation: false, systemAudio: "include" },
                preferCurrentTab: true
            });
            enterImmersive();
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 20000000 });
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: "video/webm" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = document.getElementById('hiddenTitle').innerText.trim() + ".webm";
                a.click();
                exitImmersive();
            };
            recorder.start();
            setTimeout(() => { audio.currentTime = 0; audio.play(); renderLoop(); }, 1000);
            audio.onended = () => { recorder.stop(); stream.getTracks().forEach(t => t.stop()); };
        } catch (err) {}
    });

    stageArea.addEventListener('dblclick', () => { if (isImmersive) { audio.pause(); exitImmersive(); } });
    init();
</script>
</body>
</html>
