<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shorts Generator</title>
    <style>
        :root {
            /* 🎨 配色 */
            --highlight-bg: #ccff00; 
            --highlight-text: #000000;
            
            /* 性别色 */
            --female-color: #ec4899; 
            --male-color: #2dd4bf;   
            --unknown-color: #9ca3af;

            --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            margin: 0;
            background-color: #1a1a1a;
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            user-select: none;
        }

        /* === 舞台 (9:16) === */
        #stageArea {
            width: 360px;
            height: 640px;
            position: relative;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); /* 遮罩稍微调淡一点，展示自适应效果 */
            z-index: 1;
        }

        /* === 1. 固定头部 (头像+名字) === 
           📍 核心修改：绝对定位，距离顶部 80px
        */
        .speaker-header {
            position: absolute;
            top: 80px;  /* 距离顶部 80px */
            left: 30px; /* 左对齐 */
            z-index: 3;
            
            display: flex;
            align-items: center;
            gap: 12px;
            
            /* 确保混合模式不影响头像 */
            isolation: isolate; 
        }

        /* 头像 */
        .avatar {
            width: 25px;  /* 一半大小 */
            height: 25px;
            border-radius: 50%;
            background-color: #ddd;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            
            transition: border-color 0.3s ease;
        }

        /* 名字标签 */
        .speaker-name {
            font-size: 15px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            transition: all 0.3s ease;
        }

        /* ✨ 魔法：自适应模式 (初始状态) */
        .adaptive-mode .speaker-name {
            /* 差值混合：白底变黑字，黑底变白字 */
            mix-blend-mode: exclusion; 
            color: #fff;
            text-shadow: none; /* 自适应模式不需要阴影 */
        }

        /* ✨ 正常模式 (播放状态：带颜色) */
        .speaker-state-female .speaker-name { 
            color: var(--female-color); 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            mix-blend-mode: normal;
        }
        .speaker-state-female .avatar { border-color: var(--female-color); }

        .speaker-state-male .speaker-name { 
            color: var(--male-color); 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            mix-blend-mode: normal;
        }
        .speaker-state-male .avatar { border-color: var(--male-color); }


        /* === 2. 文本块 === 
           位于头像下方，留出间距
        */
        .text-block {
            position: absolute;
            top: 130px; /* 80px (Top) + 25px (Avatar) + 25px (Gap) */
            left: 0;
            width: 100%;
            padding: 0 30px 0 34px; /* 左边稍微多一点，对齐文字视觉 */
            box-sizing: border-box;
            z-index: 2;

            font-size: 28px;
            line-height: 1.4;
            text-align: left;
            font-weight: 800;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .text-block.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 单词高亮 */
        .word {
            display: inline-block;
            position: relative;
            z-index: 1;
            padding: 2px 4px; 
            margin: 0 1px;
            border-radius: 6px;
            transition: background-color 0.1s;
        }

        .word.active {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            text-shadow: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 录制清理 */
        body.recording .controls-panel { display: none !important; }
        body.recording #stageArea { cursor: none; }

        /* 控制面板 */
        .controls-panel {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }
        .ctrl-btn {
            padding: 8px 16px;
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .ctrl-btn:hover { background: #444; color: white; }
        .primary-btn { background: #a855f7; border: none; color: white; font-weight: bold; }
        .record-btn { background: #ef4444; border: none; color: white; font-weight: bold; }
        input[type="file"] { display: none; }

    </style>
</head>
<body>

<div id="stageArea">
    <img id="bgImage" class="bg-layer" src="cover.jpg" alt="Background">
    <div class="overlay-layer"></div>

    <div id="headerContainer" class="speaker-header adaptive-mode">
        <div id="avatarEl" class="avatar"></div>
        <div id="nameEl" class="speaker-name">周末英语剧场</div>
    </div>

    <div id="textContainer" class="text-block"></div>
</div>

<div id="hiddenTitle" style="display:none;">The Sewing Mistake Behind the Sad Horse</div>

<div class="controls-panel">
    <button class="ctrl-btn" onclick="document.getElementById('bgInput').click()">🖼️ 换背景</button>
    <input type="file" id="bgInput" accept="image/*" onchange="changeBackground(this)">
    
    <button class="ctrl-btn" onclick="toggleColor()">🎨 换高亮</button>
    
    <button class="ctrl-btn" onclick="adjustFontSize(2)">A+</button>
    <button class="ctrl-btn" onclick="adjustFontSize(-2)">A-</button>

    <button class="ctrl-btn primary-btn" id="playBtn">▶️ 预览</button>
    <button class="ctrl-btn record-btn" id="recordBtn">🎥 录制 (9:16)</button>
</div>

    function segmentData(data) {
        if (!data || data.length === 0) return [];
        let blocks = [];
        let currentBlock = {

            end: 0,
            words: []

                    end: 0,
                    words: []

                        words: []

        if (activeIdx !== -1 && activeIdx !== currentBlockIndex) {
            currentBlockIndex = activeIdx;
            
            textContainer.classList.remove('visible');
            
            setTimeout(() => {
                renderBlock(activeIdx);
                textContainer.classList.add('visible');
            }, 50);
        }

        if (currentBlockIndex !== -1) {
            const spans = textContainer.querySelectorAll('.word');
            spans.forEach(span => {
                const s = parseFloat(span.dataset.start);
                const e = parseFloat(span.dataset.end);
                if (t >= s && t < e) span.classList.add('active');
                else span.classList.remove('active');
            });
        }
    }

    function renderBlock(index) {
        const block = processedBlocks[index];
        
        // --- 切换 Speaker (取消自适应，应用颜色) ---
        const spkName = block.speaker || "Unknown";
        nameEl.innerText = spkName;
        
        // 移除 adaptive-mode，移除旧颜色
        headerContainer.className = 'speaker-header'; 
        
        const lowerName = spkName.toLowerCase();
        
        // 切换头像和颜色
        if (lowerName.includes('female')) {
            headerContainer.classList.add('speaker-state-female');
            avatarEl.style.backgroundImage = "url('FEMALE.jpg')";
        } else if (lowerName.includes('male')) {
            headerContainer.classList.add('speaker-state-male');
            avatarEl.style.backgroundImage = "url('male.jpg')";
        } else {
            avatarEl.style.backgroundImage = "url('FEMALE.jpg')"; 
        }

        // --- 渲染文字 ---
        textContainer.innerHTML = ''; 
        block.words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = w.word;
            span.dataset.start = w.start;
            span.dataset.end = w.end;
            textContainer.appendChild(span);
            textContainer.appendChild(document.createTextNode(" ")); 
        });
    }

    // --- 3. 交互 ---
    window.adjustFontSize = function(delta) {
        currentFontSize += delta;
        textContainer.style.fontSize = currentFontSize + "px";
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            document.body.classList.add('playing');
            audio.play();
            renderLoop();
            playBtn.innerText = "⏸ 暂停";
            textContainer.classList.add('visible');
        } else {
            document.body.classList.remove('playing');
            audio.pause();
            playBtn.innerText = "▶️ 预览";
        }
    });

    audio.addEventListener('ended', () => {
        document.body.classList.remove('playing');
        document.body.classList.remove('recording');
        playBtn.innerText = "▶️ 预览";
        // 播放结束，恢复初始 "周末英语剧场" 状态
        setInitialState();
        currentBlockIndex = -1;
    });

    window.changeBackground = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => bgImage.src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    const colors = [
        {bg:'#ccff00', text:'#000'}, 
        {bg:'#00ffcc', text:'#000'}, 
        {bg:'#ff00ff', text:'#fff'}, 
        {bg:'#ffffff', text:'#000'}  
    ];
    let cIdx = 0;
    window.toggleColor = function() {
        cIdx = (cIdx + 1) % colors.length;
        document.documentElement.style.setProperty('--highlight-bg', colors[cIdx].bg);
        document.documentElement.style.setProperty('--highlight-text', colors[cIdx].text);
    }

    // --- 4. 录制 ---
    recordBtn.addEventListener('click', async () => {
        if (!navigator.mediaDevices.getDisplayMedia) {
            alert("请使用电脑版 Chrome 录制");
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 720, height: 1280, frameRate: 60 },
                audio: { echoCancellation: false, noiseSuppression: false },
                preferCurrentTab: true,
                systemAudio: "include"
            });

            if (stream.getAudioTracks().length === 0) {
                alert("❌ 必须勾选【分享音频】");
                stream.getTracks().forEach(t => t.stop());
                return;
            }

            document.body.classList.add('recording');
            document.body.classList.add('playing');
            
            const mimeType = MediaRecorder.isTypeSupported("video/webm; codecs=vp9") ? "video/webm; codecs=vp9" : "video/webm";
            const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 10000000 });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: "video/webm" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = url;
                const fileTitle = document.getElementById('hiddenTitle').innerText.trim() || "shorts_video";
                a.download = fileTitle + ".webm";
                document.body.appendChild(a);
                a.click();
                
                document.body.classList.remove('recording');
                document.body.classList.remove('playing');
            };

            recorder.start();
            setTimeout(() => {
                audio.currentTime = 0;
                audio.play();
                renderLoop();
            }, 1000);

            audio.onended = () => {
                recorder.stop();
                stream.getTracks().forEach(t => t.stop());
            };
        } catch (err) { console.error(err); }
    });

    init();
</script>
</body>
</html>
