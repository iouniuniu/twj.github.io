<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shorts Generator</title>
    <style>
        :root {
            /* 🎨 高亮颜色：回归明亮的荧光黄，但不使用背景色 */
            --word-active-color: #ccff00; 
            --normal-text: rgba(255, 255, 255, 0.95);
            
            /* 性别色 */
            --female-color: #ec4899; 
            --male-color: #2dd4bf;   
            --unknown-color: #9ca3af;

            --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            background-color: #1a1a1a;
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            user-select: none;
        }

        /* === 舞台 (9:16) === */
        #stageArea {
            width: 360px;
            height: 640px;
            position: relative;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* === 1. 固定头部 (距离顶部 30px) === */
        .speaker-header {
            position: absolute;
            top: 30px;  /* 📍 向上调整到 30px */
            left: 30px; 
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 10px;
            isolation: isolate; 
        }

        .avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background-color: #ddd;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: border-color 0.3s ease;
        }

        .speaker-name {
            font-size: 15px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            transition: all 0.3s ease;
        }

        /* 自适应标题模式 */
        .adaptive-mode .speaker-name {
            mix-blend-mode: exclusion; 
            color: #fff;
        }

        /* 正常说话模式 */
        .speaker-state-female .speaker-name { color: var(--female-color); mix-blend-mode: normal; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .speaker-state-female .avatar { border-color: var(--female-color); }

        .speaker-state-male .speaker-name { color: var(--male-color); mix-blend-mode: normal; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .speaker-state-male .avatar { border-color: var(--male-color); }


        /* === 2. 文本块 (紧随其下) === */
        .text-block {
            position: absolute;
            top: 80px; /* 30px + 25px + 25px 间距 */
            left: 0;
            width: 100%;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 2;

            font-size: 28px;
            line-height: 1.45;
            text-align: left;
            font-weight: 800;
            color: var(--normal-text);
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
            
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .text-block.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === 3. 单词高亮 (回归 Template 方式) === */
        .word {
            display: inline; /* 恢复自然行内排列，解决间距问题 */
            color: inherit;
            transition: color 0.15s ease, text-shadow 0.15s ease;
            position: relative;
        }

        .word.active {
            /* 只改变文字颜色，不加背景 */
            color: var(--word-active-color) !important;
            /* 增加发光感 */
            text-shadow: 0 0 12px rgba(204, 255, 0, 0.6), 0 0 20px rgba(204, 255, 0, 0.4);
        }

        /* 录制清理 */
        body.recording .controls-panel { display: none !important; }
        body.recording #stageArea { cursor: none; }

        /* 控制面板 */
        .controls-panel {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }
        .ctrl-btn {
            padding: 8px 16px;
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .ctrl-btn:hover { background: #444; color: white; }
        .primary-btn { background: #a855f7; border: none; color: white; font-weight: bold; }
        .record-btn { background: #ef4444; border: none; color: white; font-weight: bold; }
        input[type="file"] { display: none; }

    </style>
</head>
<body>

<div id="stageArea">
    <img id="bgImage" class="bg-layer" src="cover.jpg" alt="Background">
    <div class="overlay-layer"></div>

    <div id="headerContainer" class="speaker-header adaptive-mode">
        <div id="avatarEl" class="avatar"></div>
        <div id="nameEl" class="speaker-name">周末英语剧场</div>
    </div>

    <div id="textContainer" class="text-block"></div>
</div>

<div id="hiddenTitle" style="display:none;">{{TRACK_TITLE}}</div>

<div class="controls-panel">
    <button class="ctrl-btn" onclick="document.getElementById('bgInput').click()">🖼️ 背景</button>
    <input type="file" id="bgInput" accept="image/*" onchange="changeBackground(this)">
    
    <button class="ctrl-btn" onclick="toggleColor()">🎨 换颜色</button>
    
    <button class="ctrl-btn" onclick="adjustFontSize(2)">A+</button>
    <button class="ctrl-btn" onclick="adjustFontSize(-2)">A-</button>

    <button class="ctrl-btn primary-btn" id="playBtn">▶️ 预览</button>
    <button class="ctrl-btn record-btn" id="recordBtn">🎥 录制 (9:16)</button>
</div>

<audio id="audioPlayer">
    <source src="{{AUDIO_SRC}}" type="audio/mp4">
</audio>

<script>
    const rawTranscriptData = {{JSON_DATA}};

    const audio = document.getElementById('audioPlayer');
    const headerContainer = document.getElementById('headerContainer');
    const avatarEl = document.getElementById('avatarEl');
    const nameEl = document.getElementById('nameEl');
    const textContainer = document.getElementById('textContainer');
    const playBtn = document.getElementById('playBtn');
    const recordBtn = document.getElementById('recordBtn');
    const bgImage = document.getElementById('bgImage');

    let processedBlocks = []; 
    let currentBlockIndex = -1;
    let renderLoopId;
    let currentFontSize = 28; 
    
    const TARGET_DURATION = 10; 
    const MAX_WORDS_PER_SCREEN = 30;

    function setInitialState() {
        avatarEl.style.backgroundImage = "url('FEMALE.jpg')";
        nameEl.innerText = "周末英语剧场";
        headerContainer.className = 'speaker-header adaptive-mode';
        textContainer.innerHTML = "";
    }

    function segmentData(data) {
        if (!data || data.length === 0) return [];
        let blocks = [];
        let currentBlock = {
            speaker: data[0].speaker, 
            start: data[0].start,
            end: 0,
            words: []
        };

        data.forEach((sentence, index) => {
            if (sentence.speaker !== currentBlock.speaker && currentBlock.words.length > 0) {
                blocks.push(currentBlock);
                currentBlock = {
                    speaker: sentence.speaker,
                    start: sentence.start,
                    end: 0,
                    words: []
                };
            }

            if (sentence.words) currentBlock.words.push(...sentence.words);
            currentBlock.end = sentence.end;

            let duration = currentBlock.end - currentBlock.start;
            let wordCount = currentBlock.words.length;
            let isLast = index === data.length - 1;

            if ((duration >= TARGET_DURATION || wordCount >= MAX_WORDS_PER_SCREEN || isLast) && currentBlock.words.length > 0) {
                blocks.push(currentBlock);
                if (!isLast) {
                    currentBlock = {
                        speaker: data[index+1].speaker,
                        start: data[index+1].start,
                        end: 0,
                        words: []
                    };
                }
            }
        });
        return blocks;
    }

    function init() {
        processedBlocks = segmentData(rawTranscriptData);
        setInitialState();
    }

    function renderLoop() {
        if (!audio.paused) {
            updateTimeline();
            requestAnimationFrame(renderLoop);
        }
    }

    function updateTimeline() {
        const t = audio.currentTime;
        let activeIdx = -1;
        for (let i = 0; i < processedBlocks.length; i++) {
            if (t >= processedBlocks[i].start && t < processedBlocks[i].end + 0.1) {
                activeIdx = i;
                break;
            }
        }

        if (activeIdx !== -1 && activeIdx !== currentBlockIndex) {
            currentBlockIndex = activeIdx;
            textContainer.classList.remove('visible');
            setTimeout(() => {
                renderBlock(activeIdx);
                textContainer.classList.add('visible');
            }, 50);
        }

        if (currentBlockIndex !== -1) {
            const spans = textContainer.querySelectorAll('.word');
            spans.forEach(span => {
                const s = parseFloat(span.dataset.start);
                const e = parseFloat(span.dataset.end);
                if (t >= s && t < e) span.classList.add('active');
                else span.classList.remove('active');
            });
        }
    }

    function renderBlock(index) {
        const block = processedBlocks[index];
        const spkName = block.speaker || "Unknown";
        nameEl.innerText = spkName;
        headerContainer.className = 'speaker-header'; 
        const lowerName = spkName.toLowerCase();
        
        if (lowerName.includes('female')) {
            headerContainer.classList.add('speaker-state-female');
            avatarEl.style.backgroundImage = "url('FEMALE.jpg')";
        } else if (lowerName.includes('male')) {
            headerContainer.classList.add('speaker-state-male');
            avatarEl.style.backgroundImage = "url('male.jpg')";
        } else {
            avatarEl.style.backgroundImage = "url('FEMALE.jpg')"; 
        }

        textContainer.innerHTML = ''; 
        block.words.forEach(w => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = w.word;
            span.dataset.start = w.start;
            span.dataset.end = w.end;
            textContainer.appendChild(span);
            textContainer.appendChild(document.createTextNode(" ")); 
        });
    }

    window.adjustFontSize = function(delta) {
        currentFontSize += delta;
        textContainer.style.fontSize = currentFontSize + "px";
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            document.body.classList.add('playing');
            audio.play();
            renderLoop();
            playBtn.innerText = "⏸ 暂停预览";
            textContainer.classList.add('visible');
        } else {
            document.body.classList.remove('playing');
            audio.pause();
            playBtn.innerText = "▶️ 播放预览";
        }
    });

    audio.addEventListener('ended', () => {
        document.body.classList.remove('playing', 'recording');
        playBtn.innerText = "▶️ 播放预览";
        setInitialState();
        currentBlockIndex = -1;
    });

    window.changeBackground = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => bgImage.src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    const colors = ['#ccff00', '#00ffcc', '#007aff', '#ffffff'];
    let cIdx = 0;
    window.toggleColor = function() {
        cIdx = (cIdx + 1) % colors.length;
        document.documentElement.style.setProperty('--word-active-color', colors[cIdx]);
    }

    recordBtn.addEventListener('click', async () => {
        if (!navigator.mediaDevices.getDisplayMedia) {
            alert("请使用电脑版 Chrome 录制");
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 1080, height: 1920, frameRate: 60 },
                audio: { echoCancellation: false, noiseSuppression: false },
                preferCurrentTab: true,
                systemAudio: "include"
            });

            if (stream.getAudioTracks().length === 0) {
                alert("❌ 请勾选【分享音频】");
                stream.getTracks().forEach(t => t.stop());
                return;
            }

            document.body.classList.add('recording', 'playing');
            const mimeType = MediaRecorder.isTypeSupported("video/webm; codecs=vp9") ? "video/webm; codecs=vp9" : "video/webm";
            const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 15000000 });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: "video/webm" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = (document.getElementById('hiddenTitle').innerText.trim() || "video") + ".webm";
                a.click();
                document.body.classList.remove('recording', 'playing');
            };

            recorder.start();
            setTimeout(() => { audio.currentTime = 0; audio.play(); renderLoop(); }, 1000);
            audio.onended = () => { recorder.stop(); stream.getTracks().forEach(t => t.stop()); };
        } catch (err) { console.error(err); }
    });

    init();
</script>
</body>
</html>
