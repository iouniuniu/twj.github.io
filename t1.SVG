<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 卡洛塔风格：水粉厚涂阴影 -->
    <filter id="art-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#172554" flood-opacity="0.15"/>
    </filter>
    <filter id="soft-edge">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&amp;family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;display=swap');
      
      .serif-en { font-family: 'Playfair Display', serif; }
      .serif-cn { font-family: 'Noto Serif SC', serif; }
      
      /* 总时长 65s (5 scenes * 13s) */
      /* 每一个场景分配 13s，包含淡入淡出和较长的停留时间 */
      @keyframes sceneFade {
        0%, 1.5% { opacity: 0; transform: scale(1.02); }
        4%, 18% { opacity: 1; transform: scale(1); }
        20%, 100% { opacity: 0; transform: scale(0.98); }
      }

      @keyframes elementFloat { 
        0%, 100% { transform: translateY(0); } 
        50% { transform: translateY(-15px); } 
      }

      /* 动画类：使用双层嵌套法，外层控制透明度，不影响 transform 坐标 */
      .scene-group { opacity: 0; transform-origin: center; }
      .scene-0 { animation: sceneFade 65s ease-in-out 0s infinite; }
      .scene-1 { animation: sceneFade 65s ease-in-out 13s infinite; }
      .scene-2 { animation: sceneFade 65s ease-in-out 26s infinite; }
      .scene-3 { animation: sceneFade 65s ease-in-out 39s infinite; }
      .scene-4 { animation: sceneFade 65s ease-in-out 52s infinite; }

      .floating { animation: elementFloat 8s ease-in-out infinite; }

      /* 卡洛塔调色板 */
      .color-midnight { fill: #172554; }
      .color-terracotta { fill: #c2410c; }
      .color-mustard { fill: #fbbf24; }
      .color-cream { fill: #fefce8; }
      .color-rust { fill: #9a3412; }
      .color-olive { fill: #14532d; }
    </style>
  </defs>

  <!-- 全局画布底色 -->
  <rect width="100%" height="100%" fill="#fcfaf5" />

  <!-- ========================================== -->
  <!-- Scene 0: 封面 (Phrases with thing) -->
  <!-- ========================================== -->
  <g transform="translate(540, 960)">
    <g class="scene-group scene-0">
      <rect x="-480" y="-860" width="960" height="1720" rx="60" class="color-midnight" filter="url(#art-shadow)" />
      
      <!-- 视觉中心：巨大的芥末黄太阳与托举的手 -->
      <circle r="380" class="color-mustard" opacity="0.8" filter="url(#soft-edge)" />
      <g transform="translate(0, 400)">
        <path d="M 0 0 C -150 -200, -350 -250, -500 -250 C -550 -250, -580 -200, -550 -150 C -500 -50, -200 50, 0 100" fill="#c2410c" filter="url(#soft-edge)" />
      </g>

      <!-- 封面文字：thing 粗体字 -->
      <g transform="translate(0, -150)" text-anchor="middle">
        <text font-size="120" class="serif-en color-cream" font-weight="700" letter-spacing="4">Phrases with</text>
        <!-- 重点：thing 为粗体字 -->
        <text y="140" font-size="180" class="serif-en color-cream" font-weight="900" letter-spacing="-2">thing</text>
        
        <rect y="220" x="-180" width="360" height="4" fill="#fbbf24" opacity="0.5" />
        <!-- 已修改：卡洛塔艺术剧场 -> English in a minute -->
        <text y="280" font-size="42" class="serif-en color-mustard" font-weight="700" letter-spacing="1">English in a minute</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Scene 1: a thing of the past (过时的事物) -->
  <!-- ========================================== -->
  <g transform="translate(540, 960)">
    <g class="scene-group scene-1">
      <rect x="-480" y="-860" width="960" height="1720" rx="60" class="color-cream" filter="url(#art-shadow)" />
      
      <!-- 顶部短语标题 -->
      <text y="-620" text-anchor="middle" font-size="105" class="serif-en color-terracotta" font-weight="900">a thing</text>
      <text y="-510" text-anchor="middle" font-size="105" class="serif-en color-terracotta" font-weight="900">of the past</text>

      <!-- 中部插画：流沙怀表 -->
      <g transform="translate(0, -80)">
        <g class="floating">
          <path d="M -150 -180 L 150 -180 L 20 20 L 150 220 L -150 220 L -20 20 Z" fill="#fbbf24" opacity="0.8" filter="url(#soft-edge)" />
          <circle cy="-120" r="80" fill="#c2410c" />
          <path d="M 0 0 L 0 100" stroke="#9a3412" stroke-width="4" stroke-dasharray="8 8" />
        </g>
      </g>

      <!-- 底部例句区 -->
      <g transform="translate(0, 480)">
        <rect x="-440" y="-140" width="880" height="320" rx="40" class="color-terracotta" />
        <text y="-50" text-anchor="middle" font-size="38" class="serif-cn color-cream" font-weight="900">过时的事物 / 陈年往事</text>
        <text y="40" text-anchor="middle" font-size="28" class="serif-en color-cream" font-weight="700">"Getting lost is a thing of the past"</text>
        <text y="80" text-anchor="middle" font-size="28" class="serif-en color-cream" font-weight="700">"now we've all got phones."</text>
        <text y="145" text-anchor="middle" font-size="22" class="serif-cn color-cream" opacity="0.8">（如今有了手机，迷路已成往事。）</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Scene 2: no such thing (子虚乌有) -->
  <!-- ========================================== -->
  <g transform="translate(540, 960)">
    <g class="scene-group scene-2">
      <rect x="-480" y="-860" width="960" height="1720" rx="60" class="color-midnight" filter="url(#art-shadow)" />
      
      <text y="-620" text-anchor="middle" font-size="105" class="serif-en color-mustard" font-weight="900">no such</text>
      <text y="-510" text-anchor="middle" font-size="105" class="serif-en color-mustard" font-weight="900">thing</text>

      <!-- 中部插画：通往月亮的空云梯 -->
      <g transform="translate(0, -80)">
        <g class="floating">
          <circle r="280" class="color-mustard" opacity="0.3" filter="url(#soft-edge)" />
          <path d="M -100 150 L -30 0 M 30 0 L 100 150" stroke="#fefce8" stroke-width="15" stroke-linecap="round" />
          <path d="M -80 120 L 80 120 M -60 70 L 60 70" stroke="#fefce8" stroke-width="10" />
          <path d="M -20 -30 Q 0 -80 20 -30" stroke="#fefce8" stroke-width="10" stroke-dasharray="10 10" />
        </g>
      </g>

      <g transform="translate(0, 480)">
        <rect x="-440" y="-140" width="880" height="320" rx="40" class="color-mustard" />
        <text y="-50" text-anchor="middle" font-size="38" class="serif-cn color-midnight" font-weight="900">子虚乌有 / 根本没有这回事</text>
        <text y="40" text-anchor="middle" font-size="28" class="serif-en color-midnight" font-weight="700">"A way to learn English instantly?"</text>
        <text y="80" text-anchor="middle" font-size="28" class="serif-en color-midnight" font-weight="700">"I'm afraid there's no such thing!"</text>
        <text y="145" text-anchor="middle" font-size="22" class="serif-cn color-midnight" opacity="0.8">（瞬间学好英语？恐怕根本没这回事！）</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Scene 3: the next big thing (下一个大热门) -->
  <!-- ========================================== -->
  <g transform="translate(540, 960)">
    <g class="scene-group scene-3">
      <rect x="-480" y="-860" width="960" height="1720" rx="60" class="color-cream" filter="url(#art-shadow)" />
      
      <text y="-620" text-anchor="middle" font-size="105" class="serif-en color-rust" font-weight="900">the next</text>
      <text y="-510" text-anchor="middle" font-size="105" class="serif-en color-rust" font-weight="900">big thing</text>

      <!-- 中部插画：黑胶唱片上长出的萌芽 -->
      <g transform="translate(0, -80)">
        <g class="floating">
          <circle r="300" class="color-midnight" />
          <circle r="270" fill="none" stroke="#fefce8" stroke-width="1" opacity="0.3" />
          <path d="M 0 0 Q 80 -150 150 -250 Q 200 -300 150 -280 Q 80 -250 0 0" fill="#14532d" />
          <circle r="25" class="color-mustard" />
        </g>
      </g>

      <g transform="translate(0, 480)">
        <rect x="-440" y="-140" width="880" height="320" rx="40" fill="#14532d" />
        <text y="-50" text-anchor="middle" font-size="38" class="serif-cn color-cream" font-weight="900">下一个大热门 / 成功的新事物</text>
        <text y="40" text-anchor="middle" font-size="28" class="serif-en color-cream" font-weight="700">"You've got to hear this band. I think"</text>
        <text y="80" text-anchor="middle" font-size="28" class="serif-en color-cream" font-weight="700">"they might be the next big thing!"</text>
        <text y="145" text-anchor="middle" font-size="22" class="serif-cn color-cream" opacity="0.8">（你得听听这个乐队，我觉得他们会大火！）</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Scene 4: in the thick of things (最忙碌的状态) -->
  <!-- ========================================== -->
  <g transform="translate(540, 960)">
    <g class="scene-group scene-4">
      <rect x="-480" y="-860" width="960" height="1720" rx="60" class="color-rust" filter="url(#art-shadow)" />
      
      <text y="-620" text-anchor="middle" font-size="105" class="serif-en color-cream" font-weight="900">in the thick</text>
      <text y="-510" text-anchor="middle" font-size="105" class="serif-en color-cream" font-weight="900">of things</text>

      <!-- 中部插画：旋涡中心的平静 -->
      <g transform="translate(0, -80)">
        <g class="floating">
          <path d="M -300 0 A 300 150 0 1 0 300 0 A 300 150 0 1 0 -350 0" fill="none" stroke="#fefce8" stroke-width="30" opacity="0.2" />
          <path d="M -200 0 A 220 100 0 1 1 200 0 A 220 100 0 1 1 -200 0" fill="none" stroke="#fbbf24" stroke-width="20" opacity="0.3" />
          <circle r="15" class="color-midnight" />
          <path d="M -10 12 L -20 40 M 10 12 L 20 40" stroke="#fefce8" stroke-width="5" stroke-linecap="round" />
        </g>
      </g>

      <g transform="translate(0, 480)">
        <rect x="-440" y="-140" width="880" height="320" rx="40" class="color-midnight" />
        <text y="-50" text-anchor="middle" font-size="38" class="serif-cn color-cream" font-weight="900">处于最忙碌/最核心的状态</text>
        <text y="40" text-anchor="middle" font-size="28" class="serif-en color-cream" font-weight="700">"If you want to work in a hospital, you need"</text>
        <text y="80" text-anchor="middle" font-size="28" class="serif-en color-cream" font-weight="700">"to like being in the thick of things."</text>
        <text y="145" text-anchor="middle" font-size="22" class="serif-cn color-cream" opacity="0.8">（如果你想在医院工作，就得热爱这种忙碌感。）</text>
      </g>
    </g>
  </g>
</svg>
