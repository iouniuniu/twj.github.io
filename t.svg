<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 极简治愈系柔和阴影与发光 -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="gentle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5c6b73" flood-opacity="0.08"/>
    </filter>

    <!-- 莫兰迪渐变色 -->
    <linearGradient id="warm-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2c2a4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f9f6f0" stop-opacity="0" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap');
      
      /* 字体设置 */
      .serif-en { font-family: 'Playfair Display', serif; }
      .serif-cn { font-family: 'Noto Serif SC', serif; }
      
      /* 动画定义 */
      @keyframes fadeInSoft { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
      @keyframes floatSlower { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-18px) rotate(3deg); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 0.7; transform: scale(1.02); } }
      @keyframes steamRise { 0% { opacity: 0; transform: translateY(0) scale(0.8); } 50% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-30px) scale(1.2); } }

      /* 面板入场 (严格遵守 2s 间隔) */
      .panel-1 { animation: fadeInSoft 2s ease-out 0s forwards; opacity: 0; }
      .panel-2 { animation: fadeInSoft 2s ease-out 2s forwards; opacity: 0; }
      .panel-3 { animation: fadeInSoft 2s ease-out 4s forwards; opacity: 0; }
      .panel-4 { animation: fadeInSoft 2s ease-out 6s forwards; opacity: 0; }

      /* 元素动画 */
      .anim-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .anim-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float-2 { animation: floatSlower 7s ease-in-out infinite; }
      .anim-steam { animation: steamRise 4s ease-in-out infinite; }
      
      /* 调色板 */
      .text-dark { fill: #5c6b73; }
      .text-muted { fill: #8ba09c; }
      .text-accent { fill: #b88a6d; }
    </style>
  </defs>

  <!-- 燕麦色背景 -->
  <rect width="100%" height="100%" fill="#f9f6f0" />

  <!-- ========================================== -->
  <!-- Panel 1: 引入 - 宁静与足迹 -->
  <!-- ========================================== -->
  <g transform="translate(60, 50)">
    <g class="panel-1">
      <rect width="960" height="400" rx="20" fill="#ffffff" filter="url(#gentle-shadow)" />
      
      <!-- 极简窗户与月光 (靠右排版，预留绝佳左侧空间) -->
      <g transform="translate(700, 50)">
        <rect x="0" y="0" width="200" height="250" rx="10" fill="#eef2f3" />
        <circle cx="140" cy="60" r="30" fill="#e2c2a4" filter="url(#soft-glow)" />
      </g>

      <!-- 光影投射 -->
      <polygon points="700,300 900,300 780,400 500,400" fill="url(#warm-light)" />

      <!-- 无脸极简人像 -->
      <g transform="translate(580, 220)">
        <path d="M -70 180 C -50 30, 50 30, 70 180 Z" fill="#daddd8" />
        <circle cx="0" cy="30" r="50" fill="#f4ebd9" />
        <rect x="35" y="90" width="30" height="50" rx="4" fill="#ffffff" filter="url(#soft-glow)" />
        <line x1="15" y1="120" x2="35" y2="105" stroke="#c1c8b6" stroke-width="6" stroke-linecap="round" />
      </g>

      <!-- 冒热气的咖啡杯 -->
      <g transform="translate(780, 350)">
        <path d="M -20 0 L 20 0 C 20 30, -20 30, -20 0 Z" fill="#c1c8b6" />
        <path d="M 20 5 C 30 5, 30 20, 20 20" fill="none" stroke="#c1c8b6" stroke-width="4" />
        <path d="M -8 -10 Q 0 -25 -8 -40" fill="none" stroke="#e2c2a4" stroke-width="3" class="anim-steam" />
        <path d="M 8 -10 Q 0 -25 8 -40" fill="none" stroke="#e2c2a4" stroke-width="3" class="anim-steam" style="animation-delay: 2s;" />
      </g>

      <!-- 诗意与剧情的融合排版 (字号与行距拉大) -->
      <text x="60" y="150" font-size="28" class="serif-cn text-dark">岁末的深夜，屏幕微微亮起，</text>
      <text x="60" y="210" font-size="28" class="serif-cn text-dark">那些名为 App 的小小流浪者，</text>
      <text x="60" y="270" font-size="28" class="serif-cn text-dark">悄然留下了我们一年的数据足迹。</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 2: 呈现 - 影子与无处不在 -->
  <!-- ========================================== -->
  <g transform="translate(60, 490)">
    <g class="panel-2">
      <rect width="960" height="400" rx="20" fill="#f4f6f3" filter="url(#gentle-shadow)" />

      <g transform="translate(480, 190)">
        <g class="anim-glow">
          <circle cx="0" cy="-20" r="130" fill="none" stroke="#e2c2a4" stroke-width="3" opacity="0.3" />
          <circle cx="0" cy="-20" r="95" fill="#e2c2a4" opacity="0.1" filter="url(#soft-glow)" />
          <circle cx="0" cy="-20" r="60" fill="#c1c8b6" opacity="0.15" filter="url(#soft-glow)" />
        </g>
        <!-- 核心单词 -->
        <text x="0" y="0" text-anchor="middle" font-size="68" class="serif-en text-dark" letter-spacing="6">UBIQUITOUS</text>
      </g>
      
      <text x="480" y="340" text-anchor="middle" font-size="26" class="serif-cn text-dark">这些数据正如你看不见的影子，早已无处不在。</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 3: 意境 - 包裹与缝隙 -->
  <!-- ========================================== -->
  <g transform="translate(60, 930)">
    <g class="panel-3">
      <rect width="960" height="400" rx="20" fill="#ffffff" filter="url(#gentle-shadow)" />

      <!-- 视觉中心整体上移，坐标经过严格计算，确保绝对不与下方文字冲突 -->
      <g transform="translate(480, 120)">
        <circle cx="0" cy="0" r="15" fill="#e2c2a4" filter="url(#soft-glow)" />
        
        <g class="anim-float-1">
          <path d="M -180 -40 Q -160 -70 -140 -40" fill="none" stroke="#c1c8b6" stroke-width="4" stroke-linecap="round" />
          <circle cx="-180" cy="-40" r="6" fill="#c1c8b6" />
          <!-- 文字下移，避开上方图形 -->
          <text x="-160" y="-5" text-anchor="middle" font-size="20" class="serif-cn text-muted">听过的歌</text>
        </g>
        
        <g class="anim-float-2">
          <path d="M 130 -40 C 160 -80, 200 -40, 170 -15 C 140 25, 100 -15, 130 -40 Z" fill="#eef2f3" stroke="#daddd8" stroke-width="3" />
          <!-- 文字下移 -->
          <text x="160" y="-5" text-anchor="middle" font-size="20" class="serif-cn text-muted">学过的词</text>
        </g>

        <g class="anim-float-1" style="animation-delay: -2s;">
          <circle cx="-120" cy="60" r="22" fill="none" stroke="#e2c2a4" stroke-width="4" />
          <line x1="-120" y1="60" x2="-105" y2="45" stroke="#e2c2a4" stroke-width="4" stroke-linecap="round" />
          <!-- 文字充分下移，保证与下方段落的绝对间距 -->
          <text x="-120" y="130" text-anchor="middle" font-size="20" class="serif-cn text-muted">尝过的食物</text>
        </g>

        <g class="anim-float-2" style="animation-delay: -3s;">
          <path d="M 120 40 Q 120 70 90 70 Q 120 70 120 100 Q 120 70 150 70 Q 120 70 120 40 Z" fill="#daddd8" />
          <!-- 文字充分下移 -->
          <text x="120" y="130" text-anchor="middle" font-size="20" class="serif-cn text-muted">游戏的片刻</text>
        </g>
      </g>

      <!-- 彻底重新计算的行距：分为两行，行间距 50px，具有极致的呼吸感 -->
      <text x="480" y="345" text-anchor="middle" font-size="26" class="serif-cn text-dark">它们秘密而温顺地，渗透并包裹着生活里的每一个缝隙。</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 4: 沉淀 - 手帐笔记 (完美留白) -->
  <!-- ========================================== -->
  <g transform="translate(60, 1370)">
    <g class="panel-4">
      <rect width="960" height="500" rx="20" fill="#faf9f7" stroke="#eef2f3" stroke-width="3" filter="url(#gentle-shadow)" />
      
      <!-- 手帐装订线孔 -->
      <g fill="#daddd8">
        <circle cx="60" cy="50" r="6" /> <circle cx="60" cy="100" r="6" />
        <circle cx="60" cy="150" r="6" /> <circle cx="60" cy="200" r="6" />
        <circle cx="60" cy="250" r="6" /> <circle cx="60" cy="300" r="6" />
        <circle cx="60" cy="350" r="6" /> <circle cx="60" cy="400" r="6" />
        <circle cx="60" cy="450" r="6" />
      </g>
      <line x1="90" y1="0" x2="90" y2="500" stroke="#eef2f3" stroke-width="3" />

      <!-- 右下角安静趴着的极简猫咪 (略微上移，腾出底部边缘) -->
      <g transform="translate(820, 420)">
        <ellipse cx="0" cy="0" rx="35" ry="25" fill="#daddd8" />
        <path d="M -25 0 C -45 0, -45 -30, -20 -15" fill="none" stroke="#daddd8" stroke-width="8" stroke-linecap="round" />
        <polygon points="15,-20 20,-35 30,-20" fill="#daddd8" /> 
        <polygon points="30,-15 40,-25 40,-5" fill="#daddd8" />
      </g>

      <!-- 优雅的笔记内容 (拉大字号与行间距，整体起始位置上移，彻底解决压底问题) -->
      <g transform="translate(140, 50)">
        <text x="0" y="40" font-size="52" class="serif-en text-dark" letter-spacing="2">Ubiquitous</text>
        <text x="320" y="40" font-size="28" class="serif-en text-muted">[ juːˈbɪkwɪtəs ]</text>
        
        <line x1="0" y1="90" x2="740" y2="90" stroke="#eef2f3" stroke-width="2" />
        
        <!-- 散文般的词源解析 -->
        <text x="0" y="150" font-size="26" class="serif-cn text-accent">Etymology · 词源微光</text>
        <text x="0" y="200" font-size="24" class="serif-cn text-dark">UBI (何处) + QUE (皆是)</text>
        <text x="0" y="245" font-size="22" class="serif-cn text-muted">如同倾洒的月光，所及之处，皆有它的身影 = 无处不在</text>

        <line x1="0" y1="300" x2="740" y2="300" stroke="#eef2f3" stroke-width="2" stroke-dasharray="6 6" />

        <!-- 极简例句 -->
        <text x="0" y="360" font-size="24" class="serif-en text-dark" letter-spacing="0.5">"Packaging user data into graphics has become ubiquitous."</text>
        <text x="0" y="405" font-size="22" class="serif-cn text-muted">（将用户数据打包成图表的做法已无处不在。）</text>
      </g>
    </g>
  </g>

</svg>
