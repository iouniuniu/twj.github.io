<svg viewBox="0 0 600 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 萌系网格背景 -->
    <pattern id="kawaii-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#fbcfe8" stroke-width="1.5" stroke-dasharray="3 3"/>
    </pattern>

    <!-- 柔和的阴影 -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#fda4af" flood-opacity="0.3"/>
    </filter>

    <!-- 日漫集中线 (Speed Lines) -->
    <g id="speed-lines" fill="#ffffff" opacity="0.6">
      <polygon points="300,100 0,0 20,0" />
      <polygon points="300,100 100,0 120,0" />
      <polygon points="300,100 200,0 220,0" />
      <polygon points="300,100 300,0 320,0" />
      <polygon points="300,100 400,0 420,0" />
      <polygon points="300,100 500,0 520,0" />
      <polygon points="300,100 600,0 580,0" />
      <polygon points="300,100 600,100 600,120" />
      <polygon points="300,100 0,100 0,120" />
    </g>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap');

      /* 字体设置：圆润可爱风 */
      .kawaii-text { font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif; font-weight: 900; }
      .desc-text { font-family: 'Nunito', sans-serif; font-weight: 700; }

      /* 动画序列 */
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popBounce {
        0% { opacity: 0; transform: scale(0.5); }
        60% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes floatKawaii {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes blinkStar {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes sweatDrop {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        20% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(15px) scale(0.8); opacity: 0; }
      }

      /* 动画应用 */
      .panel-1 { animation: slideDown 0.8s ease-out forwards; opacity: 0; }
      .sweat { animation: sweatDrop 2s infinite ease-in; opacity: 0; transform-origin: top; }
      
      .panel-2 { animation: slideDown 0.8s ease-out 1.2s forwards; opacity: 0; }
      .huge-text { animation: popBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards; opacity: 0; transform-origin: center; }
      
      .panel-3 { animation: slideDown 0.8s ease-out 2.5s forwards; opacity: 0; }
      .chibi-1 { animation: popBounce 0.5s ease-out 3.0s forwards, floatKawaii 3s ease-in-out 3.5s infinite; opacity: 0; transform-origin: center; }
      .chibi-2 { animation: popBounce 0.5s ease-out 3.2s forwards, floatKawaii 3s ease-in-out 3.6s infinite; opacity: 0; transform-origin: center; }
      
      .sparkle { animation: blinkStar 1.5s infinite ease-in-out; transform-origin: center; }
      .sparkle-delay { animation: blinkStar 1.5s infinite ease-in-out 0.7s; transform-origin: center; }
      
      .dict-card { animation: popBounce 0.6s ease-out 4.2s forwards; opacity: 0; transform-origin: bottom right; }
    </style>
  </defs>

  <!-- 粉色格纹背景 -->
  <rect width="100%" height="100%" fill="#fff0f5" />
  <rect width="100%" height="100%" fill="url(#kawaii-grid)" />

  <!-- ==================== Panel 1: 晕头转向的听众 ==================== -->
  <g class="panel-1">
    <!-- 圆角画框 -->
    <rect x="30" y="30" width="540" height="220" rx="25" fill="#ffffff" stroke="#fbcfe8" stroke-width="6" filter="url(#soft-shadow)" />
    
    <!-- Q版 晕乎乎的听众 -->
    <g transform="translate(130, 160)">
      <!-- 金色头发与脸 -->
      <path d="M -40 0 C -40 -50, 40 -50, 40 0 C 40 40, 20 50, 0 50 C -20 50, -40 40, -40 0 Z" fill="#fef08a" />
      <circle cx="0" cy="10" r="35" fill="#fee2e2" />
      <!-- 晕圈眼 (X X) -->
      <path d="M -20 0 L -10 10 M -10 0 L -20 10" stroke="#4b5563" stroke-width="2" stroke-linecap="round" />
      <path d="M 10 0 L 20 10 M 20 0 L 10 10" stroke="#4b5563" stroke-width="2" stroke-linecap="round" />
      <!-- 委屈的小嘴 -->
      <path d="M -5 20 Q 0 15 5 20" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" />
      <!-- 红色耳机 -->
      <path d="M -35 10 A 35 35 0 0 1 35 10" fill="none" stroke="#9ca3af" stroke-width="4" />
      <rect x="-42" y="-5" width="10" height="25" rx="3" fill="#ef4444" />
      <rect x="32" y="-5" width="10" height="25" rx="3" fill="#ef4444" />
      <!-- 大汗滴 -->
      <path d="M 35 -15 Q 45 -5 45 5 A 10 10 0 0 1 25 5 Q 25 -5 35 -15 Z" fill="#bae6fd" class="sweat" />
    </g>

    <!-- 堆积如山的 100 张唱片 -->
    <g transform="translate(200, 180)">
       <rect x="0" y="-10" width="30" height="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
       <rect x="2" y="-18" width="30" height="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
       <rect x="-2" y="-26" width="30" height="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
       <rect x="0" y="-34" width="30" height="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
       <rect x="3" y="-42" width="30" height="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
       <rect x="-1" y="-50" width="30" height="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
       <text x="15" y="-60" text-anchor="middle" font-size="12" fill="#ef4444" class="kawaii-text">100首!</text>
    </g>

    <!-- 软萌对话气泡 -->
    <path d="M 230 110 Q 230 40 385 40 Q 540 40 540 110 Q 540 180 385 180 Q 300 180 250 200 Q 260 160 230 140 Z" fill="#f3f4f6" />
    <text x="385" y="90" text-anchor="middle" font-size="16" fill="#4b5563" class="kawaii-text">那本书推荐了 100 首必听爵士乐...</text>
    <text x="385" y="120" text-anchor="middle" font-size="16" fill="#4b5563" class="kawaii-text">真的太多了，根本听不完 💦</text>
    <text x="385" y="150" text-anchor="middle" font-size="16" fill="#4b5563" class="kawaii-text">林肯中心有没有什么好办法？</text>
  </g>

  <!-- ==================== Panel 2: 简练登场 (集中线特效) ==================== -->
  <g class="panel-2">
    <!-- 蓝色画框 -->
    <rect x="30" y="280" width="540" height="200" rx="25" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="6" filter="url(#soft-shadow)" />
    
    <!-- 集中线裁剪区域 -->
    <clipPath id="panel-2-clip">
      <rect x="35" y="285" width="530" height="190" rx="20" />
    </clipPath>
    <g clip-path="url(#panel-2-clip)" transform="translate(0, 280)">
      <use href="#speed-lines" />
    </g>

    <!-- 爆发出核心词汇 -->
    <g class="huge-text">
      <text x="300" y="360" text-anchor="middle" font-size="22" fill="#0284c7" class="desc-text">✨ 于是他们给出了 ✨</text>
      <!-- 双层文字制造立体描边感 -->
      <text x="300" y="420" text-anchor="middle" font-size="46" fill="#ffffff" stroke="#0ea5e9" stroke-width="12" stroke-linejoin="round" class="kawaii-text">A more CONCISE 10 !</text>
      <text x="300" y="420" text-anchor="middle" font-size="46" fill="#fef08a" class="kawaii-text">A more CONCISE 10 !</text>
      <text x="300" y="455" text-anchor="middle" font-size="18" fill="#0284c7" class="kawaii-text">( 更简练精华的 10 首！)</text>
    </g>
  </g>

  <!-- ==================== Panel 3: 对比登场 ==================== -->
  <g class="panel-3">
    <!-- 黄色画框 -->
    <rect x="30" y="510" width="540" height="340" rx="25" fill="#fef3c7" stroke="#fcd34d" stroke-width="6" filter="url(#soft-shadow)" />
    
    <text x="300" y="560" text-anchor="middle" font-size="20" fill="#d97706" class="kawaii-text">(* 浓缩的才是精华 *)</text>

    <!-- 闪亮星星装饰 -->
    <g fill="#fbbf24">
      <path d="M 120 580 Q 130 580 130 570 Q 130 580 140 580 Q 130 580 130 590 Q 130 580 120 580 Z" class="sparkle" />
      <path d="M 460 590 Q 480 590 480 570 Q 480 590 500 590 Q 480 590 480 610 Q 480 590 460 590 Z" class="sparkle-delay" />
      <path d="M 280 750 Q 290 750 290 740 Q 290 750 300 750 Q 290 750 290 760 Q 290 750 280 750 Z" class="sparkle" />
    </g>

    <!-- 左侧 Q版：厚重的 100首指南书 -->
    <g transform="translate(180, 660)">
      <g class="chibi-1">
        <rect x="-45" y="-45" width="90" height="100" rx="5" fill="#3b82f6" stroke="#1e3a8a" stroke-width="4" />
        <rect x="-35" y="-35" width="70" height="80" fill="#bfdbfe" />
        <text x="0" y="-10" text-anchor="middle" font-size="22" fill="#1e3a8a" class="kawaii-text">100</text>
        <!-- 疲惫的眼睛 (- -) -->
        <path d="M -15 15 L -5 15 M 5 15 L 15 15" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />
        <text x="0" y="85" text-anchor="middle" font-size="16" fill="#1d4ed8" class="kawaii-text">大部头 (太繁长)</text>
      </g>
    </g>

    <!-- 右侧 Q版：精简闪亮的 10首黑胶唱片 -->
    <g transform="translate(420, 660)">
      <g class="chibi-2">
        <circle cx="0" cy="0" r="50" fill="#1f2937" stroke="#111827" stroke-width="3" />
        <circle cx="0" cy="0" r="22" fill="#f43f5e" />
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
        <path d="M 2 0 L 22 0" stroke="#111827" stroke-width="1.5" stroke-dasharray="2 2" />
        <path d="M 12 18 L 0 22" stroke="#111827" stroke-width="1.5" stroke-dasharray="2 2" />
        <!-- 开心的眼睛 (^ ^) -->
        <path d="M -10 -5 Q -6 -12 -2 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 2 -5 Q 6 -12 10 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <!-- 小音符 -->
        <text x="35" y="-30" font-size="20" class="sparkle">🎵</text>
        <text x="0" y="85" text-anchor="middle" font-size="16" fill="#be185d" class="kawaii-text">10首 精选 (简明的)</text>
      </g>
    </g>

    <!-- 右下角：萌系词根科普便利贴 -->
    <g transform="translate(390, 770)">
      <g class="dict-card">
        <rect x="0" y="0" width="180" height="85" rx="10" fill="#fdf2f8" stroke="#f472b6" stroke-width="3" transform="rotate(-5)" filter="url(#soft-shadow)" />
        <!-- 胶带 -->
        <rect x="70" y="-15" width="40" height="15" fill="#fbcfe8" opacity="0.8" transform="rotate(-5)" />
        
        <text x="90" y="30" text-anchor="middle" font-size="16" fill="#be185d" class="kawaii-text" transform="rotate(-5)">📝 词根笔记</text>
        <text x="90" y="55" text-anchor="middle" font-size="14" fill="#64748b" class="desc-text" transform="rotate(-5)">CON(加强) + CISE(切割)</text>
        <text x="90" y="75" text-anchor="middle" font-size="14" fill="#db2777" class="kawaii-text" transform="rotate(-5)">= 切掉多余废话✂️ 简明的</text>
      </g>
    </g>
  </g>
</svg>