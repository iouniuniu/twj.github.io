<svg viewBox="0 0 600 1220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 萌系网格背景 -->
    <pattern id="kawaii-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#fbcfe8" stroke-width="1.5" stroke-dasharray="3 3"/>
    </pattern>

    <!-- 柔和的阴影 -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#fda4af" flood-opacity="0.3"/>
    </filter>

    <!-- 日漫集中线 (Speed Lines) -->
    <g id="speed-lines" fill="#ffffff" opacity="0.6">
      <polygon points="300,100 0,0 20,0" />
      <polygon points="300,100 100,0 120,0" />
      <polygon points="300,100 200,0 220,0" />
      <polygon points="300,100 300,0 320,0" />
      <polygon points="300,100 400,0 420,0" />
      <polygon points="300,100 500,0 520,0" />
      <polygon points="300,100 600,0 580,0" />
      <polygon points="300,100 600,100 600,120" />
      <polygon points="300,100 0,100 0,120" />
    </g>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&amp;family=ZCOOL+KuaiLe&amp;display=swap');

      /* 字体设置：圆润可爱风 */
      .kawaii-text { font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif; font-weight: 900; }
      .desc-text { font-family: 'Nunito', sans-serif; font-weight: 700; }

      /* 动画序列 */
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popBounce {
        0% { opacity: 0; transform: scale(0.5); }
        60% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes floatKawaii {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes dizzyShake {
        0%, 100% { transform: translateX(0) rotate(0); }
        25% { transform: translateX(-2px) rotate(-1deg); }
        75% { transform: translateX(2px) rotate(1deg); }
      }
      @keyframes sweatDrop {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        20% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(15px) scale(0.8); opacity: 0; }
      }

      /* 面板依次出现 */
      .panel-1 { animation: slideDown 0.8s ease-out forwards; opacity: 0; }
      .panel-2 { animation: slideDown 0.8s ease-out 1.2s forwards; opacity: 0; }
      .panel-3 { animation: slideDown 0.8s ease-out 2.4s forwards; opacity: 0; }
      .panel-4 { animation: slideDown 0.8s ease-out 3.6s forwards; opacity: 0; }

      /* 内部元素动画 */
      .sweat { animation: sweatDrop 2s infinite ease-in; opacity: 0; transform-origin: top; }
      .huge-text { animation: popBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards; opacity: 0; transform-origin: center; }
      
      .chibi-dizzy { animation: popBounce 0.5s ease-out 3.0s forwards, dizzyShake 1s ease-in-out 3.5s infinite; opacity: 0; transform-origin: center; }
      .chibi-float-1 { animation: popBounce 0.5s ease-out 3.1s forwards, floatKawaii 3s ease-in-out 3.6s infinite; opacity: 0; transform-origin: center; }
      .chibi-float-2 { animation: popBounce 0.5s ease-out 3.3s forwards, floatKawaii 3.2s ease-in-out 3.8s infinite; opacity: 0; transform-origin: center; }
      .chibi-float-3 { animation: popBounce 0.5s ease-out 3.5s forwards, floatKawaii 2.8s ease-in-out 3.4s infinite; opacity: 0; transform-origin: center; }
      .chibi-float-4 { animation: popBounce 0.5s ease-out 3.7s forwards, floatKawaii 3.5s ease-in-out 4.0s infinite; opacity: 0; transform-origin: center; }
      
      .chibi-teacher { animation: popBounce 0.5s ease-out 4.2s forwards, floatKawaii 3s ease-in-out 4.6s infinite; opacity: 0; transform-origin: center; }
      
      .bubble-pop-1 { animation: popBounce 0.6s ease-out 0.8s forwards; opacity: 0; transform-origin: left bottom; }
      .board-pop { animation: popBounce 0.6s ease-out 4.5s forwards; opacity: 0; transform-origin: center; }
    </style>
  </defs>

  <!-- 粉色格纹背景 -->
  <rect width="100%" height="100%" fill="#fff0f5" />
  <rect width="100%" height="100%" fill="url(#kawaii-grid)" />

  <!-- ==================== Panel 1: 震惊的手机用户 ==================== -->
  <g transform="translate(30, 20)">
    <g class="panel-1">
      <rect width="540" height="220" rx="25" fill="#ffffff" stroke="#fbcfe8" stroke-width="6" filter="url(#soft-shadow)" />
      
      <!-- Q版 手机用户 -->
      <g transform="translate(130, 160)">
        <g class="floatKawaii">
          <!-- 头发与脸 -->
          <path d="M -40 0 C -40 -60, 40 -60, 40 0 C 40 40, 20 60, 0 60 C -20 60, -40 40, -40 0 Z" fill="#fcd34d" />
          <circle cx="0" cy="10" r="35" fill="#fee2e2" />
          
          <!-- 红晕 -->
          <circle cx="-20" cy="15" r="6" fill="#fca5a5" /> 
          <circle cx="20" cy="15" r="6" fill="#fca5a5" />
          
          <!-- 惊讶的眼睛 (O O) -->
          <circle cx="-12" cy="5" r="5" fill="#1e293b" />
          <circle cx="12" cy="5" r="5" fill="#1e293b" />
          <circle cx="-12" cy="5" r="1.5" fill="#ffffff" />
          <circle cx="12" cy="5" r="1.5" fill="#ffffff" />
          
          <!-- 张大的嘴巴 -->
          <ellipse cx="0" cy="20" rx="6" ry="8" fill="#1e293b" />

          <!-- 手里拿着智能手机 -->
          <rect x="20" y="-5" width="22" height="35" rx="3" fill="#334155" transform="rotate(15)" />
          <rect x="22" y="-3" width="18" height="31" rx="2" fill="#38bdf8" transform="rotate(15)" />
          <!-- 手机屏幕上的图表元素 -->
          <rect x="25" y="10" width="4" height="10" fill="#ffffff" transform="rotate(15)" />
          <rect x="31" y="5" width="4" height="15" fill="#ffffff" transform="rotate(15)" />
          
          <!-- 大汗滴 -->
          <path d="M 35 -25 Q 45 -15 45 -5 A 10 10 0 0 1 25 -5 Q 25 -15 35 -25 Z" fill="#bae6fd" class="sweat" />
        </g>
      </g>

      <!-- 软萌对话气泡 -->
      <g transform="translate(385, 110)">
        <g class="bubble-pop-1">
          <path d="M -145 0 Q -145 -70 0 -70 Q 155 -70 155 0 Q 155 70 0 70 Q -85 70 -135 90 Q -125 50 -145 30 Z" fill="#f3f4f6" />
          <text x="5" y="-20" text-anchor="middle" font-size="16" fill="#0284c7" class="kawaii-text">天哪！一到年底...</text>
          <text x="5" y="10" text-anchor="middle" font-size="16" fill="#4b5563" class="kawaii-text">听歌、学外语、甚至连点外卖，</text>
          <text x="5" y="40" text-anchor="middle" font-size="16" fill="#4b5563" class="kawaii-text">所有的App都在给我发年度报告？！</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== Panel 2: 爆发的高光词汇 (集中线特效) ==================== -->
  <g transform="translate(30, 260)">
    <g class="panel-2">
      <!-- 科技蓝画框 -->
      <rect width="540" height="200" rx="25" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="6" filter="url(#soft-shadow)" />
      
      <!-- 集中线裁剪区域 -->
      <clipPath id="panel-2-clip">
        <rect x="5" y="5" width="530" height="190" rx="20" />
      </clipPath>
      <g clip-path="url(#panel-2-clip)">
        <use href="#speed-lines" fill="#0284c7" opacity="0.15" />
      </g>

      <!-- 爆发出核心词汇 -->
      <g transform="translate(270, 100)">
        <g class="huge-text">
          <text x="0" y="-40" text-anchor="middle" font-size="22" fill="#0369a1" class="desc-text">✨ 这种打包数据的图表玩法真的是 ✨</text>
          <!-- 双层文字制造立体描边感 -->
          <text x="0" y="20" text-anchor="middle" font-size="48" fill="#ffffff" stroke="#0284c7" stroke-width="12" stroke-linejoin="round" class="kawaii-text">UBIQUITOUS !</text>
          <text x="0" y="20" text-anchor="middle" font-size="48" fill="#fef08a" class="kawaii-text">UBIQUITOUS !</text>
          <text x="0" y="55" text-anchor="middle" font-size="18" fill="#0369a1" class="kawaii-text">( 无处不在的 )</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== Panel 3: 被包围的场景重现 ==================== -->
  <g transform="translate(30, 480)">
    <g class="panel-3">
      <!-- 温暖黄画框 -->
      <rect width="540" height="260" rx="25" fill="#fef3c7" stroke="#fcd34d" stroke-width="6" filter="url(#soft-shadow)" />
      
      <text x="270" y="35" text-anchor="middle" font-size="18" fill="#d97706" class="kawaii-text">(* 被各类年度报告全方位包围的用户 *)</text>

      <!-- 中央：晕头转向的用户 -->
      <g transform="translate(270, 160)">
        <g class="chibi-dizzy">
          <circle cx="0" cy="0" r="45" fill="#fee2e2" />
          <path d="M -45 -10 C -45 -60, 45 -60, 45 -10" fill="#fcd34d" />
          <!-- 晕圈眼 (@ @) -->
          <path d="M -25 -5 Q -15 -15 -5 -5 Q -15 5 -25 -5 Q -30 -15 -20 -20" fill="none" stroke="#1e293b" stroke-width="2" />
          <path d="M 5 -5 Q 15 -15 25 -5 Q 15 5 5 -5 Q 0 -15 10 -20" fill="none" stroke="#1e293b" stroke-width="2" />
          <path d="M -5 15 Q 0 10 5 15" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
          <!-- 抱头的手 -->
          <circle cx="-40" cy="10" r="10" fill="#fee2e2" stroke="#1e293b" stroke-width="2" />
          <circle cx="40" cy="10" r="10" fill="#fee2e2" stroke="#1e293b" stroke-width="2" />
        </g>
      </g>

      <!-- 周围漂浮的各大 App Q版图标 -->

      <!-- 左上：音乐 App (Spotify) -->
      <g transform="translate(100, 100)">
        <g class="chibi-float-1">
          <circle cx="0" cy="0" r="30" fill="#22c55e" stroke="#16a34a" stroke-width="3" />
          <path d="M -10 5 L -10 -15 L 10 -20 L 10 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="-12" cy="5" r="5" fill="#ffffff" />
          <circle cx="8" cy="0" r="5" fill="#ffffff" />
          <text x="0" y="50" text-anchor="middle" font-size="14" fill="#15803d" class="kawaii-text">音乐 Wrapped</text>
        </g>
      </g>

      <!-- 右上：语言 App (Duolingo) -->
      <g transform="translate(440, 100)">
        <g class="chibi-float-2">
          <rect x="-25" y="-25" width="50" height="50" rx="15" fill="#84cc16" stroke="#65a30d" stroke-width="3" />
          <circle cx="-10" cy="-5" r="8" fill="#ffffff" />
          <circle cx="10" cy="-5" r="8" fill="#ffffff" />
          <circle cx="-10" cy="-5" r="3" fill="#1e293b" />
          <circle cx="10" cy="-5" r="3" fill="#1e293b" />
          <polygon points="-5,5 5,5 0,12" fill="#f59e0b" /> <!-- 喙 -->
          <text x="0" y="50" text-anchor="middle" font-size="14" fill="#4d7c0f" class="kawaii-text">外语 打卡报告</text>
        </g>
      </g>

      <!-- 左下：外卖 App (McDonald's / Seamless) -->
      <g transform="translate(130, 210)">
        <g class="chibi-float-3">
          <path d="M -25 0 C -25 -20, 25 -20, 25 0 Z" fill="#f59e0b" stroke="#d97706" stroke-width="3" /> <!-- 汉堡顶 -->
          <rect x="-25" y="2" width="50" height="6" rx="3" fill="#4ade80" /> <!-- 生菜 -->
          <rect x="-23" y="10" width="46" height="8" rx="4" fill="#78350f" /> <!-- 肉饼 -->
          <path d="M -25 20 C -25 30, 25 30, 25 20 Z" fill="#f59e0b" stroke="#d97706" stroke-width="3" /> <!-- 汉堡底 -->
          <text x="0" y="50" text-anchor="middle" font-size="14" fill="#b45309" class="kawaii-text">外卖 账单</text>
        </g>
      </g>

      <!-- 右下：游戏 App (Steam) -->
      <g transform="translate(410, 210)">
        <g class="chibi-float-4">
          <rect x="-30" y="-15" width="60" height="30" rx="15" fill="#1e3a8a" stroke="#172554" stroke-width="3" />
          <!-- 十字键 -->
          <path d="M -22 -2 h 4 v -4 h 4 v 4 h 4 v 4 h -4 v 4 h -4 v -4 h -4 z" fill="#cbd5e1" />
          <!-- 按钮 -->
          <circle cx="15" cy="5" r="4" fill="#ef4444" />
          <circle cx="23" cy="-5" r="4" fill="#38bdf8" />
          <text x="0" y="40" text-anchor="middle" font-size="14" fill="#1d4ed8" class="kawaii-text">游戏 成就总结</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== Panel 4: 喵老师的终极黑板 (音标+词源+无提示符例句) ==================== -->
  <g transform="translate(30, 760)">
    <g class="panel-4">
      <!-- 浅绿色黑板画框 -->
      <rect width="540" height="420" rx="25" fill="#f0fdf4" stroke="#86efac" stroke-width="6" filter="url(#soft-shadow)" />
      
      <!-- 左侧：Q版 喵老师 (Mascot Teacher) -->
      <g transform="translate(100, 300)">
        <g class="chibi-teacher">
          <!-- 魔法教鞭，指向黑板边缘 -->
          <line x1="20" y1="0" x2="80" y2="-120" stroke="#fca5a5" stroke-width="6" stroke-linecap="round" />
          <!-- 喵星人脑袋 -->
          <circle cx="0" cy="0" r="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
          <!-- 猫耳朵 -->
          <path d="M -35 -25 L -45 -65 L -10 -40 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />
          <path d="M 35 -25 L 45 -65 L 10 -40 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />
          <!-- 粉色耳廓 -->
          <polygon points="-33,-30 -40,-55 -15,-40" fill="#fecdd3" />
          <polygon points="33,-30 40,-55 15,-40" fill="#fecdd3" />
          <!-- 学霸眼镜 -->
          <circle cx="-15" cy="-5" r="14" fill="none" stroke="#ef4444" stroke-width="3" />
          <circle cx="15" cy="-5" r="14" fill="none" stroke="#ef4444" stroke-width="3" />
          <line x1="-1" y1="-5" x2="1" y2="-5" stroke="#ef4444" stroke-width="3" />
          <!-- 豆豆眼和三瓣嘴 -->
          <circle cx="-15" cy="-5" r="4" fill="#1e293b" />
          <circle cx="15" cy="-5" r="4" fill="#1e293b" />
          <path d="M -5 10 Q 0 15 5 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
          <path d="M -5 10 Q -10 15 -15 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
          <!-- 红晕 -->
          <ellipse cx="-28" cy="8" rx="6" ry="3" fill="#fecaca" />
          <ellipse cx="28" cy="8" rx="6" ry="3" fill="#fecaca" />

          <text x="0" y="70" text-anchor="middle" font-size="18" fill="#10b981" class="kawaii-text">喵老师 (Sensei)</text>
        </g>
      </g>

      <!-- 右侧：全面升级版教学大黑板 -->
      <g transform="translate(190, 30)">
        <g class="board-pop">
          <!-- 墨绿色大黑板 -->
          <rect x="0" y="0" width="320" height="360" rx="10" fill="#14532d" stroke="#d97706" stroke-width="10" filter="url(#soft-shadow)" />
          
          <!-- 黑板擦 -->
          <rect x="260" y="340" width="40" height="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
          <rect x="260" y="346" width="40" height="4" fill="#ffffff" />

          <!-- 1. 单词与音标 -->
          <text x="160" y="55" text-anchor="middle" font-size="28" fill="#ffffff" class="kawaii-text" letter-spacing="1">UBIQUITOUS</text>
          <text x="160" y="90" text-anchor="middle" font-size="18" fill="#fde047" class="kawaii-text">[ juːˈbɪkwɪtəs ]</text>
          
          <!-- 分割线 1 -->
          <line x1="20" y1="120" x2="300" y2="120" stroke="#4ade80" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" />
          
          <!-- 2. 硬核词源科普 -->
          <text x="20" y="155" font-size="16" fill="#fde047" class="kawaii-text">💡 词源拆解 (Etymology):</text>
          <text x="20" y="185" font-size="16" fill="#ffffff" class="kawaii-text">UBI (在哪里) + QUE (任何)</text>
          <text x="20" y="215" font-size="16" fill="#86efac" class="kawaii-text">👉 任何地方都在 = 无处不在的</text>

          <!-- 分割线 2 -->
          <line x1="20" y1="245" x2="300" y2="245" stroke="#4ade80" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" />
          
          <!-- 3. 例句部分 (去除了提示符，多行排版) -->
          <text x="20" y="280" font-size="15" fill="#ffffff" class="kawaii-text">Packaging user data into graphics</text>
          <text x="20" y="305" font-size="15" fill="#ffffff" class="kawaii-text">has become ubiquitous.</text>
          <text x="20" y="335" font-size="13" fill="#86efac" class="desc-text">(将用户数据打包成图表的做法变得无处不在)</text>
        </g>
      </g>

    </g>
  </g>
</svg>
