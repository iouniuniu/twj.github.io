<svg viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 极简治愈系柔和阴影与发光 -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="gentle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#5c6b73" flood-opacity="0.08"/>
    </filter>

    <!-- 莫兰迪渐变色 -->
    <linearGradient id="warm-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2c2a4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f9f6f0" stop-opacity="0" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap');
      
      /* 字体设置 */
      .serif-en { font-family: 'Playfair Display', serif; }
      .serif-cn { font-family: 'Noto Serif SC', serif; }
      
      /* 动画定义 */
      @keyframes fadeInSoft { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes floatSlower { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 0.7; transform: scale(1.02); } }
      @keyframes steamRise { 0% { opacity: 0; transform: translateY(0) scale(0.8); } 50% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-20px) scale(1.2); } }

      /* 面板入场 */
      .panel-1 { animation: fadeInSoft 1.5s ease-out forwards; opacity: 0; }
      .panel-2 { animation: fadeInSoft 1.5s ease-out 0.8s forwards; opacity: 0; }
      .panel-3 { animation: fadeInSoft 1.5s ease-out 1.6s forwards; opacity: 0; }
      .panel-4 { animation: fadeInSoft 1.5s ease-out 2.4s forwards; opacity: 0; }

      /* 元素动画 */
      .anim-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .anim-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float-2 { animation: floatSlower 7s ease-in-out infinite; }
      .anim-steam { animation: steamRise 3s ease-in-out infinite; }
      
      /* 调色板 */
      .text-dark { fill: #5c6b73; }
      .text-muted { fill: #8ba09c; }
      .text-accent { fill: #b88a6d; }
      .text-poem { fill: #a3b1ab; } /* 诗句专属淡青灰色 */
    </style>
  </defs>

  <!-- 燕麦色背景 -->
  <rect width="100%" height="100%" fill="#f9f6f0" />

  <!-- ========================================== -->
  <!-- Panel 1: 引入 - 宁静与足迹 -->
  <!-- ========================================== -->
  <g transform="translate(30, 30)">
    <g class="panel-1">
      <rect width="690" height="270" rx="16" fill="#ffffff" filter="url(#gentle-shadow)" />
      
      <!-- 极简窗户与月光 (置于右侧) -->
      <g transform="translate(510, 30)">
        <rect x="0" y="0" width="140" height="170" rx="8" fill="#eef2f3" />
        <circle cx="100" cy="40" r="20" fill="#e2c2a4" filter="url(#soft-glow)" />
      </g>

      <!-- 光影投射 -->
      <polygon points="510,200 650,200 550,270 350,270" fill="url(#warm-light)" />

      <!-- 无脸极简人像 (置于右侧) -->
      <g transform="translate(430, 150)">
        <path d="M -50 120 C -40 20, 40 20, 50 120 Z" fill="#daddd8" />
        <circle cx="0" cy="20" r="35" fill="#f4ebd9" />
        <rect x="25" y="60" width="20" height="35" rx="3" fill="#ffffff" filter="url(#soft-glow)" />
        <line x1="10" y1="80" x2="25" y2="70" stroke="#c1c8b6" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- 冒热气的咖啡杯 (置于右侧) -->
      <g transform="translate(560, 240)">
        <path d="M -15 0 L 15 0 C 15 20, -15 20, -15 0 Z" fill="#c1c8b6" />
        <path d="M 15 5 C 22 5, 22 15, 15 15" fill="none" stroke="#c1c8b6" stroke-width="3" />
        <path d="M -5 -5 Q 0 -15 -5 -25" fill="none" stroke="#e2c2a4" stroke-width="2" class="anim-steam" />
        <path d="M 5 -5 Q 0 -15 5 -25" fill="none" stroke="#e2c2a4" stroke-width="2" class="anim-steam" style="animation-delay: 1.5s;" />
      </g>

      <!-- 诗意旁白 (左侧留白区，行距讲究) -->
      <g transform="translate(40, 70)">
        <text x="0" y="0" font-size="18" class="serif-cn text-poem">“世界上的一队小小的流浪者呀，</text>
        <text x="0" y="30" font-size="18" class="serif-cn text-poem">请留下你们的足印在我的文字里。”</text>
        <text x="0" y="60" font-size="14" class="serif-cn text-poem">—— 泰戈尔《飞鸟集》</text>
        
        <text x="0" y="120" font-size="18" class="serif-cn text-dark">岁末的深夜，屏幕微微亮起，</text>
        <text x="0" y="150" font-size="18" class="serif-cn text-dark">各大 App 已悄然留下了</text>
        <text x="0" y="180" font-size="18" class="serif-cn text-dark">我们这一年的数据足迹...</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 2: 呈现 - 影子与无处不在 -->
  <!-- ========================================== -->
  <g transform="translate(30, 320)">
    <g class="panel-2">
      <rect width="690" height="270" rx="16" fill="#f4f6f3" filter="url(#gentle-shadow)" />
      
      <!-- 飞鸟集引言 -->
      <text x="345" y="50" text-anchor="middle" font-size="16" class="serif-cn text-poem">“你看不见你自己，你所看见的只是你的影子。”</text>
      <text x="345" y="75" text-anchor="middle" font-size="12" class="serif-cn text-poem">——《飞鸟集》</text>

      <g transform="translate(345, 155)">
        <!-- 柔和的水波纹 -->
        <g class="anim-glow">
          <circle cx="0" cy="-10" r="90" fill="none" stroke="#e2c2a4" stroke-width="2" opacity="0.3" />
          <circle cx="0" cy="-10" r="65" fill="#e2c2a4" opacity="0.1" filter="url(#soft-glow)" />
          <circle cx="0" cy="-10" r="40" fill="#c1c8b6" opacity="0.15" filter="url(#soft-glow)" />
        </g>
        
        <!-- 核心单词 -->
        <text x="0" y="0" text-anchor="middle" font-size="48" class="serif-en text-dark" letter-spacing="4">UBIQUITOUS</text>
      </g>
      
      <!-- 剧情陈述 -->
      <text x="345" y="240" text-anchor="middle" font-size="18" class="serif-cn text-accent">关于个人的数据印记，正如影子般无处不在</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 3: 意境 - 包裹与缝隙 -->
  <!-- ========================================== -->
  <g transform="translate(30, 610)">
    <g class="panel-3">
      <rect width="690" height="270" rx="16" fill="#ffffff" filter="url(#gentle-shadow)" />
      
      <g transform="translate(345, 135)">
        <!-- 中间的发光小圆点代表“自我” -->
        <circle cx="0" cy="0" r="10" fill="#e2c2a4" filter="url(#soft-glow)" />
        
        <!-- 环绕的抽象元素 -->
        <g class="anim-float-1">
          <path d="M -130 -50 Q -110 -70 -90 -50" fill="none" stroke="#c1c8b6" stroke-width="3" stroke-linecap="round" />
          <circle cx="-130" cy="-50" r="4" fill="#c1c8b6" />
          <text x="-110" y="-20" text-anchor="middle" font-size="14" class="serif-cn text-muted">听过的歌</text>
        </g>
        
        <g class="anim-float-2">
          <path d="M 100 -40 C 120 -70, 150 -40, 130 -20 C 110 10, 80 -20, 100 -40 Z" fill="#eef2f3" stroke="#daddd8" stroke-width="2" />
          <text x="120" y="0" text-anchor="middle" font-size="14" class="serif-cn text-muted">学过的词</text>
        </g>

        <g class="anim-float-1" style="animation-delay: -2s;">
          <circle cx="-90" cy="60" r="15" fill="none" stroke="#e2c2a4" stroke-width="3" />
          <line x1="-90" y1="60" x2="-80" y2="50" stroke="#e2c2a4" stroke-width="3" stroke-linecap="round" />
          <text x="-90" y="95" text-anchor="middle" font-size="14" class="serif-cn text-muted">尝过的食物</text>
        </g>

        <g class="anim-float-2" style="animation-delay: -3s;">
          <path d="M 120 40 Q 120 60 100 60 Q 120 60 120 80 Q 120 60 140 60 Q 120 60 120 40 Z" fill="#daddd8" />
          <text x="120" y="105" text-anchor="middle" font-size="14" class="serif-cn text-muted">游戏的片刻</text>
        </g>
      </g>

      <!-- 飞鸟集引言与剧情 -->
      <g transform="translate(345, 45)">
        <text x="0" y="0" text-anchor="middle" font-size="16" class="serif-cn text-poem">“影子戴上面幕，秘密地，温顺地，跟在光的后边。”</text>
      </g>
      <text x="345" y="245" text-anchor="middle" font-size="18" class="serif-cn text-dark">它静静地渗透并包裹着，生活里的每一个缝隙。</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 4: 沉淀 - 手帐笔记 (完美留白) -->
  <!-- ========================================== -->
  <g transform="translate(30, 900)">
    <g class="panel-4">
      <rect width="690" height="400" rx="16" fill="#faf9f7" stroke="#eef2f3" stroke-width="2" filter="url(#gentle-shadow)" />
      
      <!-- 手帐的左侧装订线孔 -->
      <g fill="#daddd8">
        <circle cx="40" cy="40" r="4" /> <circle cx="40" cy="80" r="4" />
        <circle cx="40" cy="120" r="4" /> <circle cx="40" cy="160" r="4" />
        <circle cx="40" cy="200" r="4" /> <circle cx="40" cy="240" r="4" />
        <circle cx="40" cy="280" r="4" /> <circle cx="40" cy="320" r="4" />
        <circle cx="40" cy="360" r="4" />
      </g>
      <line x1="60" y1="0" x2="60" y2="400" stroke="#eef2f3" stroke-width="2" />

      <!-- 右下角安静趴着的极简猫咪 -->
      <g transform="translate(600, 360)">
        <ellipse cx="0" cy="0" rx="25" ry="18" fill="#daddd8" />
        <path d="M -20 0 C -35 0, -35 -20, -15 -10" fill="none" stroke="#daddd8" stroke-width="6" stroke-linecap="round" />
        <polygon points="10,-15 15,-25 20,-15" fill="#daddd8" /> 
        <polygon points="20,-10 28,-18 28,-5" fill="#daddd8" />
      </g>

      <!-- 优雅的笔记内容 -->
      <g transform="translate(100, 60)">
        <text x="0" y="10" font-size="34" class="serif-en text-dark" letter-spacing="2">Ubiquitous</text>
        <text x="210" y="10" font-size="18" class="serif-en text-muted">[ juːˈbɪkwɪtəs ]</text>
        
        <line x1="0" y1="45" x2="520" y2="45" stroke="#eef2f3" stroke-width="1.5" />
        
        <!-- 散文般的词源解析 -->
        <text x="0" y="85" font-size="18" class="serif-cn text-accent">Etymology · 词源微光</text>
        <text x="0" y="120" font-size="16" class="serif-cn text-dark">UBI (何处) + QUE (皆是)</text>
        <text x="0" y="150" font-size="16" class="serif-cn text-muted">如同倾洒的月光，所及之处，皆有它的身影 = 无处不在</text>

        <line x1="0" y1="195" x2="520" y2="195" stroke="#eef2f3" stroke-width="1.5" stroke-dasharray="4 4" />

        <!-- 极简例句 -->
        <text x="0" y="240" font-size="16" class="serif-en text-dark" letter-spacing="0.5">"Packaging user data into graphics has become ubiquitous."</text>
        <text x="0" y="270" font-size="15" class="serif-cn text-muted">（将用户数据打包成图表的做法已无处不在。）</text>
      </g>
    </g>
  </g>

</svg>
