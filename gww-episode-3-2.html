    let linesData = []; let currentLineId = -1; let isPlaying = false;
    const lyricsContainer = document.getElementById('lyrics-scroll-container');
    const audioEl = document.getElementById('main-audio');
    const waveformContainer = document.getElementById('waveform');

    // 1. 数据合并初始化 (含中文翻译)
    function initData() {
        if (!Array.isArray(RAW_JSON_DATA)) return;
        linesData = [];
        let currentGroup = { id: 0, speaker: null, words: [], start: 0, end: 0, translation: "" };

        RAW_JSON_DATA.forEach((sentence) => {
            let sentenceWords = sentence.words || (sentence.word ? [sentence] : []);
            if (sentenceWords.length === 0) return;
            
            const sStart = parseFloat(sentence.start || sentenceWords[0].start);
            const sEnd = parseFloat(sentence.end || sentenceWords[sentenceWords.length-1].end);
            const speaker = sentence.speaker_id || sentence.speaker || "unknown";
            const zhText = sentence.sentence_zh || ""; // 读取中文翻译

            const isSameSpeaker = (currentGroup.speaker === speaker) || (currentGroup.speaker === null);
            const newDuration = sEnd - currentGroup.start;
            const isShortEnough = newDuration < 10.0;

            if (isSameSpeaker && isShortEnough) {
                if (currentGroup.words.length === 0) { currentGroup.start = sStart; currentGroup.speaker = speaker; }
                currentGroup.words = currentGroup.words.concat(sentenceWords);
                currentGroup.end = sEnd;
                // 拼接合并后的中文翻译
                if (zhText) {
                    currentGroup.translation = currentGroup.translation ? currentGroup.translation + " " + zhText : zhText;
                }
            } else {
                if (currentGroup.words.length > 0) linesData.push({...currentGroup});
                currentGroup = { id: linesData.length, speaker: speaker, words: [...sentenceWords], start: sStart, end: sEnd, translation: zhText };
            }
        });
        if (currentGroup.words.length > 0) linesData.push({...currentGroup});
        renderLyrics();
    }

    // 2. 渲染 DOM
    function renderLyrics() {
        lyricsContainer.innerHTML = '';
        linesData.forEach(line => {
            const div = document.createElement('div'); 
            div.className = 'lyric-line'; 
            div.id = `line-${line.id}`;
            
            // 渲染英文单词
            line.words.forEach(w => {
                const span = document.createElement('span'); 
                span.className = 'word'; 
                span.innerText = w.word + " ";
                span.dataset.s = parseFloat(w.start); 
                span.dataset.e = parseFloat(w.end);
                div.appendChild(span);
            });
            
            // 渲染中文翻译块 (如果存在)
            if (line.translation) {
                const zhDiv = document.createElement('div');
                zhDiv.className = 'lyric-translation';
                zhDiv.innerText = line.translation;
                div.appendChild(zhDiv);
            }

            lyricsContainer.appendChild(div);
        });
        const spacer = document.createElement('div'); spacer.style.height = "50vh"; lyricsContainer.appendChild(spacer);
    }

    // 3. 核心 60帧 同步渲染
    function renderLoop() {
        if (!isPlaying) return;
        const now = audioEl.currentTime;
        syncLyrics(now);
        if (Math.random() > 0.7) updateWaveform(); 
        requestAnimationFrame(renderLoop);
    }

    function syncLyrics(time) {
        const activeLine = linesData.find(l => time >= l.start && time < l.end + 0.2);
        
        // 切换行状态
        if (activeLine && activeLine.id !== currentLineId) {
            if (currentLineId !== -1) {
                const old = document.getElementById(`line-${currentLineId}`);
                if (old) { 
                    old.classList.remove('active'); 
                    old.querySelectorAll('.word').forEach(w => w.classList.remove('highlight')); 
                }
            }
            currentLineId = activeLine.id;
            const el = document.getElementById(`line-${activeLine.id}`);
            if (el) { el.classList.add('active'); scrollToCenter(el); }
        }

        // 单词精确高亮
        if (currentLineId !== -1) {
            const lineEl = document.getElementById(`line-${currentLineId}`);
            if (lineEl) {
                // 使用 getElementsByClassName 避免选中中文翻译 div 中的元素
                const spans = lineEl.getElementsByClassName('word');
                for (let i = 0; i < spans.length; i++) {
                    const span = spans[i];
                    const s = parseFloat(span.dataset.s);
                    const e = parseFloat(span.dataset.e);
                    if (time >= s && time < e) span.classList.add('highlight');
                    else span.classList.remove('highlight');
                }
            }
        }
    }

    function scrollToCenter(el) {
        // 利用 scroll 偏移量将元素强制居中，由于我们有中文行撑高 el.offsetHeight，因此居中计算极其精确
        const target = el.offsetTop + el.offsetHeight / 2 - window.innerHeight / 2;
        lyricsContainer.scrollTo({ top: target, behavior: 'smooth' });
    }

    // 波形逻辑
    for(let i=0; i<40; i++) { let b = document.createElement('div'); b.className='wave-bar'; waveformContainer.appendChild(b); }
    function updateWaveform() {
        const bars = waveformContainer.children;
        for (let i = 0; i < bars.length; i++) {
            let h = 15 + Math.random() * 50; 
            bars[i].style.height = h + '%';
            if(h > 40) bars[i].classList.add('active'); else bars[i].classList.remove('active');
        }
    }

    // 事件监听
    audioEl.addEventListener('play', () => { isPlaying = true; renderLoop(); });
    audioEl.addEventListener('pause', () => { isPlaying = false; });
    audioEl.addEventListener('ended', () => { isPlaying = false; });

    document.getElementById('btn-immersive').onclick = () => {
        const el = document.documentElement;
        if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
        document.body.classList.add('immersive');
        
        // 5秒后自动播放
        setTimeout(() => {
            audioEl.currentTime = 0; 
            audioEl.play().catch(e => console.error(e));
        }, 5000);
    };

    initData();
</script>
