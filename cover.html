<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏洛的网 - 播客封面设计 (V8.0 终极对齐版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* 基础预览尺寸 -> 输出超清 1242x1660 */
            --ratio-w: 375px; 
            --ratio-h: 501.2px; 
            
            /* Karlotta - 治愈色板 */
            --km-bg: #F7F4EB;
            --km-blob1: #E4C5AF;
            --km-blob2: #BAC7BE;
            --km-text: #4A453F;
            
            /* Karlotta - 现代平面色板 */
            --kf-bg: #1D2D44;
            --kf-shape1: #D96C53;
            --kf-shape2: #E9B872;
            --kf-text: #FFF5E1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Roboto, sans-serif;
            background-color: #222; display: flex; flex-direction: row;
            justify-content: center; align-items: flex-start; padding: 40px; gap: 40px; min-height: 100vh;
        }

        /* === 噪点纹理滤镜 (通用) === */
        .grain-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: 0.35; mix-blend-mode: multiply;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJYdWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsdGVyPSJ1cmwoI24pIiBvcGFjaXR5PSIwLjI1Ii8+PC9zdmc+');
        }

        /* === 控制面板 === */
        .controls {
            background: white; padding: 25px; border-radius: 16px; width: 320px; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .controls h2 { margin-top: 0; color: #333; font-size: 18px; margin-bottom: 20px;}
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600;}
        .control-group input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px;}
        
        .style-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .btn-style { 
            padding: 12px; border: 2px solid #eee; background: #f9f9f9; width: 100%;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; transition: all 0.2s;
        }
        .btn-style:hover { border-color: #ccc; }
        .btn-style.active { background: #333; color: white; border-color: #333; }
        
        .btn-download { 
            background: #ff2442; color: white; width: 100%; margin-top: 15px; border: none; padding: 12px;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px; box-shadow: 0 4px 12px rgba(255, 36, 66, 0.3);
        }

        /* === 预览框 === */
        .preview-wrapper {
            position: relative; border: 1px solid #333; background: #000;
            width: var(--ratio-w); height: var(--ratio-h); overflow: hidden; user-select: none;
        }

        .poster { width: 100%; height: 100%; position: relative; overflow: hidden; display: none; }
        .poster.active { display: block; }

        /* ============================================================
           方案一：复古绘本风 (保留不变)
        ============================================================ */
        .style-retro {
            background-color: #FDF5E6;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjRkRGNUU2Ii8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNDQ0MiIG9wYWNpdHk9IjAuMiIvPjwvc3ZnPg==');
            color: #333;
        }
        .retro-tag {
            position: absolute; top: 20px; left: 0; background: #c0392b; color: white;
            padding: 6px 15px; font-weight: bold; font-size: 14px; border-radius: 0 4px 4px 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .retro-title-group { position: absolute; top: 50px; left: 30px; right: 30px; font-family: serif; }
        .retro-h1 { font-size: 34px; font-weight: 800; color: #2c3e50; line-height: 1.1; margin-bottom: 5px; }
        .retro-sub { font-size: 14px; color: #556B2F; font-weight: 600; letter-spacing: 1px; }
        
        /* 【核心修改 1】复古风居中对齐 */
        .retro-book-container {
            position: absolute; 
            top: 54%; /* 视觉居中 (略微偏下以平衡头部标题) */
            left: 50%; 
            transform: translate(-50%, -50%); /* 使用双向 translate 实现绝对居中 */
            width: 180px; max-height: 260px; display: flex; justify-content: center;
        }
        .retro-book-img { width: 100%; height: auto; box-shadow: 12px 12px 25px rgba(0,0,0,0.25); display: block; }
        .retro-ep-sticker {
            position: absolute; bottom: -20px; right: -25px;
            width: 65px; height: 65px; background: #e74c3c; border-radius: 50%; border: 3px solid #fff;
            display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 16px;
            transform: rotate(-10deg); box-shadow: 2px 2px 8px rgba(0,0,0,0.2); z-index: 10;
        }
        .retro-footer { position: absolute; bottom: 30px; left: 30px; display: flex; align-items: center; gap: 12px; }

        /* ============================================================
           方案二：简约治愈 (Karlotta - Minimalist Healing) - 修复版
        ============================================================ */
        .style-k-min { background-color: var(--km-bg); color: var(--km-text); font-family: serif; }
        
        .k-min-blob1 {
            position: absolute; top: -10%; left: -20%; width: 280px; height: 260px;
            background-color: var(--km-blob1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transform: rotate(15deg); z-index: 0; opacity: 0.9;
        }
        .k-min-blob2 {
            position: absolute; bottom: -5%; right: -15%; width: 250px; height: 280px;
            background-color: var(--km-blob2); border-radius: 60% 40% 30% 70% / 50% 60% 30% 60%;
            transform: rotate(-10deg); z-index: 0; opacity: 0.8;
        }

        .k-min-header { position: absolute; top: 35px; width: 100%; text-align: center; z-index: 5; }
        .k-min-tag {
            display: inline-block; background: var(--km-text); color: var(--km-bg);
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 10px; font-family: sans-serif;
        }
        .k-min-h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: 0.5px; }
        .k-min-sub-header { font-family: sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px; opacity: 0.7; font-weight: 500; }

        /* 【核心修改 2】简约风居中对齐 */
        .k-min-cover-wrapper {
            position: absolute; 
            top: 50%; /* 完美几何居中 */
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 190px; z-index: 5;
        }
        .k-min-cover-img { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 15px 35px rgba(74, 69, 63, 0.15); }
        
        .k-min-player { position: absolute; bottom: 45px; left: 30px; right: 30px; z-index: 5; }
        .k-min-controls { display: flex; align-items: center; justify-content: space-between; }
        .k-min-user { display: flex; align-items: center; gap: 8px; }
        .k-min-ep { font-family: sans-serif; font-size: 14px; font-weight: 700; background: var(--km-blob1); padding: 4px 10px; border-radius: 12px; color: #333;}
        
        /* ============================================================
           方案三：现代平面 (Karlotta - Modern Flat & Bold) - 修复版
        ============================================================ */
        .style-k-mod { background-color: var(--kf-bg); color: var(--kf-text); font-family: sans-serif; }
        
        .k-mod-shape1 {
            position: absolute; top: 0; right: 0; width: 65%; height: 55%;
            background-color: var(--kf-shape1); border-radius: 0 0 0 40px; z-index: 0;
        }
        .k-mod-shape2 {
            position: absolute; bottom: -40px; left: -30px; width: 200px; height: 200px;
            background-color: var(--kf-shape2); border-radius: 50%; z-index: 0;
        }

        .k-mod-header { position: absolute; top: 40px; left: 30px; z-index: 5; width: 85%; }
        .k-mod-tag {
            display: inline-block; background: var(--kf-text); color: var(--kf-bg);
            padding: 5px 12px; font-size: 12px; font-weight: 800; text-transform: uppercase;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2); margin-bottom: 12px;
        }
        .k-mod-h1 { 
            font-size: 38px; font-weight: 900; margin: 0; line-height: 1.05; letter-spacing: -1px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }
        .k-mod-sub-header {
            margin-top: 12px; font-size: 14px; font-weight: 500; opacity: 0.9; letter-spacing: 0.5px;
            display: inline-block; border-bottom: 2px solid var(--kf-shape2); padding-bottom: 2px;
        }

        /* 【核心修改 3】现代风居中对齐 */
        .k-mod-cover-wrapper {
            position: absolute; 
            top: 56%; /* 视觉居中 (略微偏下，平衡底部大文字) */
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 160px; z-index: 5;
        }
        .k-mod-cover-img {
            width: 100%; height: auto; display: block;
            max-height: 230px; object-fit: cover; 
            border: 3px solid var(--kf-text); box-shadow: 12px 12px 0px var(--kf-shape2); background: #fff;
        }

        .k-mod-footer {
            position: absolute; bottom: 30px; left: 30px; right: 30px; z-index: 5;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .k-mod-user-box { 
            display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); 
            padding: 6px 12px 6px 6px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 6px;
        }
        .k-mod-ep {
            font-size: 42px; font-weight: 900; line-height: 0.8; opacity: 0.9;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        /* 通用：头像和文字 */
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8);}
        .footer-text { text-align: left; }
        .footer-text h3 { margin: 0; font-size: 14px; font-weight: 700; }
        .footer-text p { margin: 0; font-size: 10px; opacity: 0.7; margin-top: 2px;}

    </style>
</head>
<body>

    <div class="controls">
        <h2>🎨 播客封面设计实验室 (V8.0)</h2>
        
        <div class="style-grid">
            <button class="btn-style active" onclick="switchStyle('retro')">📜 经典复古绘本 (方案一)</button>
            <button class="btn-style" onclick="switchStyle('k-min')">🌿 简约治愈 (Karlotta风格)</button>
            <button class="btn-style" onclick="switchStyle('k-mod')">🔶 现代平面 (Karlotta风格)</button>
        </div>

        <div class="control-group">
            <label>主标题 (Podcast Title)</label>
            <input type="text" id="inputTitle" value="Charlotte's Web" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>副标题 (Subtitle)</label>
            <input type="text" id="inputSub" value="英文原版广播剧" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>醒目标签 (Tag)</label>
            <input type="text" id="inputTag" value="全网首发 🔥" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>集数 (Episode)</label>
            <input type="text" id="inputEp" value="EP.01" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>创作者 (Creator)</label>
            <input type="text" id="inputOwner" value="周末英语剧场" oninput="updateText()">
        </div>
        
        <div style="height:1px; background:#eee; margin:15px 0;"></div>

        <div class="control-group">
            <label>🖼️ 封面插图 (视觉中心)</label>
            <input type="file" accept="image/*" onchange="loadImage(this, 'cover')">
        </div>
        <div class="control-group">
            <label>👤 创作者头像</label>
            <input type="file" accept="image/*" onchange="loadImage(this, 'avatar')">
        </div>

        <button class="btn-download" id="downloadBtn" onclick="downloadPoster()">⬇️ 下载 1242x1660 超清封面</button>
    </div>

    <div class="preview-wrapper">
        
        <div id="style-retro" class="poster style-retro active">
            <div class="retro-tag tag-text">全网首发 🔥</div>
            <div class="retro-title-group">
                <div class="retro-h1 title-text">Charlotte's Web</div>
                <div class="retro-sub sub-text">英文原版广播剧</div>
            </div>
            <div class="retro-book-container">
                <img src="" class="retro-book-img cover-target" alt="Cover">
                <div class="retro-ep-sticker ep-text">EP.01</div>
            </div>
            <div class="retro-footer">
                <img src="" class="avatar-img avatar-target" alt="Avatar" style="border-color:white;">
                <div class="footer-text">
                    <h3 class="owner-text" style="color:#333;">周末英语剧场</h3>
                    <p style="color:#888;">© 版权所有 · 侵权必究</p>
                </div>
            </div>
        </div>

        <div id="style-k-min" class="poster style-k-min">
            <div class="grain-overlay"></div>
            <div class="k-min-blob1"></div>
            <div class="k-min-blob2"></div>

            <div class="k-min-header">
                <div class="k-min-tag tag-text">全网首发 🔥</div>
                <h1 class="k-min-h1 title-text">Charlotte's Web</h1>
                <div class="k-min-sub-header sub-text">英文原版广播剧</div>
            </div>

            <div class="k-min-cover-wrapper">
                <img src="" class="k-min-cover-img cover-target" alt="Cover">
            </div>
            
            <div class="k-min-player">
                <div class="k-min-controls">
                    <div class="k-min-user">
                        <img src="" class="avatar-img avatar-target" style="width:32px; height:32px; border:none;">
                        <span class="owner-text" style="font-weight: 600; font-size: 14px; font-family: sans-serif;">周末英语剧场</span>
                    </div>
                    <div class="k-min-ep ep-text">EP.01</div>
                </div>
            </div>
        </div>

        <div id="style-k-mod" class="poster style-k-mod">
            <div class="grain-overlay" style="opacity: 0.5;"></div>
            <div class="k-mod-shape1"></div>
            <div class="k-mod-shape2"></div>

            <div class="k-mod-header">
                <div class="k-mod-tag tag-text">全网首发 🔥</div>
                <h1 class="k-mod-h1 title-text">Charlotte's Web</h1>
                <div class="k-mod-sub-header sub-text">英文原版广播剧</div>
            </div>

            <div class="k-mod-cover-wrapper">
                <img src="" class="k-mod-cover-img cover-target" alt="Cover">
            </div>

            <div class="k-mod-footer">
                <div class="k-mod-user-box">
                    <img src="" class="avatar-img avatar-target" style="width:28px; height:28px; border:none;">
                    <span class="owner-text" style="font-size: 13px; font-weight: 700;">周末英语剧场</span>
                </div>
                <div class="k-mod-ep ep-text">EP.01</div>
            </div>
        </div>

    </div>

    <script>
        const defaultCover = "https://via.placeholder.com/300x400?text=Cover+Art"; 
        const defaultAvatar = "https://via.placeholder.com/100?text=Avatar";

        document.querySelectorAll('.cover-target').forEach(img => img.src = defaultCover);
        document.querySelectorAll('.avatar-target').forEach(img => img.src = defaultAvatar);

        function switchStyle(styleName) {
            document.querySelectorAll('.btn-style').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.poster').forEach(p => p.classList.remove('active'));
            document.getElementById('style-' + styleName).classList.add('active');
        }

        function updateText() {
            const title = document.getElementById('inputTitle').value;
            const sub = document.getElementById('inputSub').value;
            const tag = document.getElementById('inputTag').value;
            const ep = document.getElementById('inputEp').value;
            const owner = document.getElementById('inputOwner').value;

            document.querySelectorAll('.title-text').forEach(el => el.innerText = title);
            document.querySelectorAll('.sub-text').forEach(el => el.innerText = sub);
            document.querySelectorAll('.tag-text').forEach(el => el.innerText = tag);
            document.querySelectorAll('.ep-text').forEach(el => el.innerText = ep); 
            document.querySelectorAll('.owner-text').forEach(el => el.innerText = owner);
        }

        function loadImage(input, type) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (type === 'cover') {
                        document.querySelectorAll('.cover-target').forEach(img => img.src = e.target.result);
                    } else if (type === 'avatar') {
                        document.querySelectorAll('.avatar-target').forEach(img => img.src = e.target.result);
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function downloadPoster() {
            const btn = document.getElementById('downloadBtn');
            const originalText = btn.innerText;
            btn.innerText = "⚡️ 高清渲染中...";
            btn.disabled = true;

            const activePoster = document.querySelector('.poster.active');
            const clone = activePoster.cloneNode(true);
            
            const container = document.createElement('div');
            container.style.position = 'fixed'; container.style.top = '-10000px'; container.style.left = '-10000px';
            container.style.width = activePoster.offsetWidth + 'px'; container.style.height = activePoster.offsetHeight + 'px';
            container.appendChild(clone); document.body.appendChild(container);

            html2canvas(clone, { scale: 3.312, useCORS: true, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'podcast-cover-HD.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                document.body.removeChild(container);
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
