<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏洛的网 - 超清海报生成器 (最终修复版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* 基础尺寸，用于屏幕预览 (375 x 501.2) */
            /* 最终输出通过 JS 缩放 3.312 倍达到 1242 x 1660 */
            --ratio-w: 375px; 
            --ratio-h: 501.2px; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #2c2c2c;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            gap: 40px;
            min-height: 100vh;
        }

        /* === 左侧控制面板 === */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            flex-shrink: 0;
            height: fit-content;
        }

        .controls h2 { margin-top: 0; color: #333; font-size: 20px; margin-bottom: 20px;}
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500;}
        .control-group input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        
        .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .btn-style { 
            padding: 10px; border: 1px solid #ddd; background: #f9f9f9; 
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; 
        }
        .btn-style:hover { background: #eee; }
        .btn-style.active { background: #333; color: white; border-color: #333; font-weight: bold; }
        
        .btn-download { 
            background: linear-gradient(45deg, #ff2e4d, #ff5e3a); 
            color: white; width: 100%; margin-top: 15px; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;
            box-shadow: 0 4px 10px rgba(255, 46, 77, 0.3);
            transition: transform 0.1s;
        }
        .btn-download:active { transform: scale(0.98); }

        /* === 右侧预览框 === */
        .preview-wrapper {
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            /* 这个边框之前可能是导致嵌套的原因之一 */
            border: 4px solid #444; 
            border-radius: 8px;
            background: #fff;
            /* 确保预览框大小固定 */
            width: var(--ratio-w);
            height: var(--ratio-h);
            /* 极其重要：确保内容不溢出 */
            overflow: hidden;
        }

        .poster {
            width: 100%;
            height: 100%;
            position: relative;
            /* 极其重要：确保海报内部元素不溢出 */
            overflow: hidden;
            background-color: white;
            display: none; 
        }
        .poster.active { display: block; }

        /* ============================================================
           方案一：复古绘本风 (Retro Book)
        ============================================================ */
        .style-retro {
            background-color: #FDF5E6;
            background-image: radial-gradient(#dcdcdc 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
        }
        .retro-tag {
            position: absolute; top: 25px; left: 0;
            background: #B22222; color: white;
            padding: 6px 15px; font-weight: bold; font-size: 14px;
            border-top-right-radius: 4px; border-bottom-right-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .retro-title-group {
            position: absolute; top: 70px; left: 30px; right: 30px;
            font-family: 'Times New Roman', serif;
        }
        .retro-h1 { font-size: 34px; font-weight: bold; color: #2c3e50; line-height: 1.1; margin-bottom: 5px; }
        .retro-sub { font-size: 14px; color: #556B2F; font-weight: 500; letter-spacing: 1px; }
        .retro-book-container {
            position: absolute; top: 160px; left: 50%; transform: translateX(-50%);
            width: 180px; height: 230px; 
            box-shadow: 10px 10px 20px rgba(0,0,0,0.2);
            border-left: 1px solid rgba(255,255,255,0.4);
        }
        .retro-book-img { width: 100%; height: 100%; object-fit: cover; }
        .retro-ep-sticker {
            position: absolute; bottom: -20px; right: -25px;
            width: 65px; height: 65px; background: #CD5C5C;
            border-radius: 50%; border: 3px solid #fff;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; font-size: 16px;
            transform: rotate(-10deg); box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }
        .retro-footer {
            position: absolute; bottom: 25px; left: 30px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(253, 245, 230, 0.9); padding: 8px; border-radius: 8px;
        }

        /* ============================================================
           方案二：播放器风 (Player)
        ============================================================ */
        .style-modern { background: #000; color: white; }
        .modern-bg {
            position: absolute; inset: -20px; background-size: cover; background-position: center;
            filter: blur(25px); opacity: 0.7;
        }
        .modern-overlay { position: absolute; inset: 0; background: rgba(0,0,0, 0.7); backdrop-filter: blur(10px); }
        .modern-content { 
            position: relative; z-index: 2; height: 100%; padding: 30px; 
            display: flex; flex-direction: column;
        }
        .modern-tag {
            align-self: flex-start; background: #FFD700; color: #000;
            padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .modern-cover {
            width: 220px; height: 220px; margin: 30px auto; 
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modern-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; margin-top: 10px; }
        .modern-sub { font-size: 14px; opacity: 0.7; }
        .progress-bar {
            margin-top: 25px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px;
        }
        .progress-fill { width: 30%; height: 100%; background: white; border-radius: 2px; position: relative; }
        .progress-dot { width: 10px; height: 10px; background: white; border-radius: 50%; position: absolute; right: -5px; top: -3px; }

        /* ============================================================
           方案三：苹果磨砂风 (Apple Glass)
        ============================================================ */
        .style-apple { background: #111; color: white; overflow: hidden; }
        .apple-bg {
            position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background-size: cover; background-position: center;
            filter: blur(50px) saturation(180%);
            opacity: 0.6; animation: breathe 10s infinite alternate;
        }
        @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .apple-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 315px; height: 440px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; padding: 25px; box-sizing: border-box;
            text-align: center;
        }
        
        .apple-tag {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 20px;
            font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .apple-cover-shadow {
            width: 180px; height: 180px; margin: 20px auto 30px auto;
            position: relative;
        }
        .apple-cover-img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            position: relative; z-index: 2;
        }
        .apple-reflection {
            position: absolute; bottom: -20px; left: 5%; width: 90%; height: 90%;
            background-size: cover; background-position: center;
            filter: blur(15px); opacity: 0.6; z-index: 1; border-radius: 12px;
        }

        .apple-h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .apple-sub { font-size: 14px; opacity: 0.6; margin-bottom: 25px; }
        
        .apple-controls {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); padding: 12px 20px; border-radius: 16px;
            margin-top: auto;
        }
        .apple-play-btn {
            width: 30px; height: 30px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .apple-play-icon {
            width: 0; height: 0; 
            border-top: 5px solid transparent; border-bottom: 5px solid transparent;
            border-left: 8px solid black; margin-left: 2px;
        }
        .apple-ep { font-size: 14px; font-weight: bold; }

        /* ============================================================
           方案四：手账拼贴风 (Scrapbook)
        ============================================================ */
        .style-scrap {
            background-color: #f4f4f4;
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
        }

        .scrap-tape {
            position: absolute; width: 100px; height: 30px;
            background: rgba(255, 255, 230, 0.8);
            border-left: 2px dotted rgba(0,0,0,0.1); border-right: 2px dotted rgba(0,0,0,0.1);
            transform: rotate(-5deg); top: 110px; left: 50%; margin-left: -50px; z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .scrap-polaroid {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%) rotate(3deg);
            width: 220px; background: white; padding: 10px 10px 40px 10px;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        .scrap-img { width: 100%; height: 220px; object-fit: cover; filter: contrast(1.1); }
        .scrap-handwriting {
            position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #555; font-size: 14px; transform: rotate(-2deg);
        }

        .scrap-title-area {
            position: absolute; top: 40px; left: 30px;
        }
        .scrap-h1 {
            background: #333; color: white; padding: 5px 15px; display: inline-block;
            font-size: 24px; font-weight: bold; transform: rotate(-2deg); margin-bottom: 5px;
        }
        .scrap-tag {
            background: #ff4757; color: white; padding: 3px 10px; display: inline-block;
            font-size: 12px; font-weight: bold; transform: rotate(1deg);
            border-radius: 20px; border: 2px solid white;
        }

        .scrap-sticker {
            position: absolute; bottom: 100px; right: 30px;
            width: 70px; height: 70px; background: #ffeaa7; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 12px; font-weight: bold; color: #d35400;
            transform: rotate(15deg); border: 2px dashed #d35400;
        }

        .scrap-footer {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .scrap-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #333; }
        .scrap-owner { font-weight: bold; font-size: 14px; background: white; padding: 2px 8px; border: 1px solid #333;}


        /* 通用底部头像文字 */
        .footer-text h3 { margin: 0; font-size: 16px; }
        .footer-text p { margin: 0; font-size: 10px; opacity: 0.7; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        @media (max-width: 800px) {
            body { flex-direction: column; align-items: center; padding: 20px; }
            .controls { width: 100%; max-width: 375px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>🎨 小红书海报工厂 (超清修复版)</h2>
        
        <div class="style-grid">
            <button class="btn-style active" onclick="switchStyle('retro')">📜 复古绘本</button>
            <button class="btn-style" onclick="switchStyle('modern')">🎵 播放器(黑)</button>
            <button class="btn-style" onclick="switchStyle('apple')">🍎 苹果磨砂</button>
            <button class="btn-style" onclick="switchStyle('scrap')">✂️ 手账拼贴</button>
        </div>

        <div class="control-group">
            <label>主标题</label>
            <input type="text" id="inputTitle" value="Charlotte's Web" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>副标题</label>
            <input type="text" id="inputSub" value="英文原版广播剧" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>标签/短语</label>
            <input type="text" id="inputTag" value="全网首发 🔥" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>集数</label>
            <input type="text" id="inputEp" value="EP.01" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>所有者</label>
            <input type="text" id="inputOwner" value="周末英语剧场" oninput="updateText()">
        </div>
        
        <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">

        <div class="control-group">
            <label>🖼️ 上传封面图</label>
            <input type="file" accept="image/*" onchange="loadImage(this, 'cover')">
        </div>
        <div class="control-group">
            <label>👤 上传头像</label>
            <input type="file" accept="image/*" onchange="loadImage(this, 'avatar')">
        </div>

        <button class="btn-download" id="downloadBtn" onclick="downloadPoster()">✨ 生成 1242x1660 超清海报</button>
    </div>

    <div class="preview-wrapper">
        
        <div id="style-retro" class="poster style-retro active">
            <div class="retro-tag tag-text">全网首发 🔥</div>
            <div class="retro-title-group">
                <div class="retro-h1 title-text">Charlotte's Web</div>
                <div class="retro-sub sub-text">英文原版广播剧</div>
            </div>
            <div class="retro-book-container">
                <img src="" class="retro-book-img cover-target" alt="Cover">
                <div class="retro-ep-sticker ep-text">EP.01</div>
            </div>
            <div class="retro-footer">
                <img src="" class="avatar-img avatar-target" alt="Avatar">
                <div class="footer-text">
                    <h3 class="owner-text">周末英语剧场</h3>
                    <p>© 版权所有 · 侵权必究</p>
                </div>
            </div>
        </div>

        <div id="style-modern" class="poster style-modern">
            <div class="modern-bg cover-bg-target" style="background-color: #333;"></div>
            <div class="modern-overlay"></div>
            <div class="modern-content">
                <div class="modern-tag tag-text">全网首发 🔥</div>
                <div class="modern-cover">
                    <img src="" class="cover-target" alt="Cover">
                </div>
                <div class="modern-info">
                    <div class="modern-title title-text">Charlotte's Web</div>
                    <div class="modern-sub"><span class="sub-text">英文原版广播剧</span> · <span class="ep-text">EP.01</span></div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"><div class="progress-dot"></div></div>
                </div>
                <div class="retro-footer" style="position:relative; bottom:0; left:0; margin-top:auto; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white;">
                    <img src="" class="avatar-img avatar-target" style="border:none;">
                    <div class="footer-text">
                        <h3 class="owner-text" style="color:white;">周末英语剧场</h3>
                        <p style="color:#ddd;">© Copyright Reserved</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="style-apple" class="poster style-apple">
            <div class="apple-bg cover-bg-target" style="background-color: #555;"></div>
            
            <div class="apple-card">
                <div class="apple-tag tag-text">全网首发 🔥</div>
                
                <div class="apple-cover-shadow">
                    <div class="apple-reflection cover-bg-target"></div>
                    <img src="" class="apple-cover-img cover-target" alt="Cover">
                </div>

                <div class="apple-h1 title-text">Charlotte's Web</div>
                <div class="apple-sub sub-text">英文原版广播剧</div>

                <div class="apple-controls">
                    <div class="apple-play-btn"><div class="apple-play-icon"></div></div>
                    <div class="apple-ep ep-text">EP.01</div>
                    <img src="" class="avatar-target" style="width:24px; height:24px; border-radius:50%;">
                </div>
                
                <div style="margin-top: 20px; font-size: 10px; opacity: 0.5;">
                    <span class="owner-text">周末英语剧场</span> <br> © All Rights Reserved
                </div>
            </div>
        </div>

        <div id="style-scrap" class="poster style-scrap">
            <div class="scrap-title-area">
                <div class="scrap-tag tag-text">全网首发 🔥</div><br>
                <div class="scrap-h1 title-text">Charlotte's Web</div>
                <div style="font-
