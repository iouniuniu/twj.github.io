<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏洛的网 - 最终完美版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ratio-w: 375px; 
            --ratio-h: 501.2px; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Roboto, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            gap: 40px;
            min-height: 100vh;
        }

        /* === 左侧控制面板 === */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 16px;
            width: 320px;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .controls h2 { margin-top: 0; color: #333; font-size: 18px; margin-bottom: 20px;}
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600;}
        .control-group input[type="text"] {
            width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        .btn-style { 
            padding: 10px; border: 1px solid #eee; background: #f5f5f5; width: 48%;
            border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 8px; font-weight: 500;
        }
        .btn-style.active { background: #333; color: white; border-color: #333; }
        .btn-download { 
            background: #ff2442; color: white; width: 100%; margin-top: 15px; border: none; padding: 12px;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px;
            box-shadow: 0 4px 12px rgba(255, 36, 66, 0.3);
        }

        /* === 右侧预览框 === */
        .preview-wrapper {
            position: relative;
            border: 1px solid #333; 
            border-radius: 0;
            background: #000;
            width: var(--ratio-w);
            height: var(--ratio-h);
            overflow: hidden;
        }

        .poster {
            width: 100%; height: 100%; position: relative; overflow: hidden; display: none; 
        }
        .poster.active { display: block; }

        /* ============================================================
           方案一：复古绘本风 (保持不变)
        ============================================================ */
        .style-retro {
            background-color: #FDF5E6;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjRkRGNUU2Ii8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNDQ0MiIG9wYWNpdHk9IjAuMiIvPjwvc3ZnPg==');
            color: #333;
        }
        .retro-tag {
            position: absolute; top: 25px; left: 0;
            background: #c0392b; color: white;
            padding: 6px 15px; font-weight: bold; font-size: 14px;
            border-top-right-radius: 4px; border-bottom-right-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .retro-title-group { position: absolute; top: 70px; left: 30px; right: 30px; font-family: serif; }
        .retro-h1 { font-size: 34px; font-weight: 800; color: #2c3e50; line-height: 1.1; margin-bottom: 5px; }
        .retro-sub { font-size: 14px; color: #556B2F; font-weight: 600; letter-spacing: 1px; }
        .retro-book-container {
            position: absolute; top: 160px; left: 50%; transform: translateX(-50%);
            width: 180px; height: 230px; 
            box-shadow: 12px 12px 25px rgba(0,0,0,0.25);
            border-left: 1px solid rgba(255,255,255,0.4);
        }
        .retro-book-img { width: 100%; height: 100%; object-fit: cover; }
        .retro-ep-sticker {
            position: absolute; bottom: -20px; right: -25px;
            width: 65px; height: 65px; background: #e74c3c;
            border-radius: 50%; border: 3px solid #fff;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; font-size: 16px;
            transform: rotate(-10deg); box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }
        .retro-footer {
            position: absolute; bottom: 25px; left: 30px; display: flex; align-items: center; gap: 12px;
        }

        /* ============================================================
           方案二：深邃播放器 (保持不变)
        ============================================================ */
        .style-modern { background: #050505; color: white; }
        .modern-bg {
            position: absolute; inset: -50px; background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.3) saturate(1.2); opacity: 0.6; z-index: 0;
        }
        .modern-overlay { 
            position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 1; pointer-events: none;
        }
        .modern-content { 
            position: relative; z-index: 2; height: 100%; padding: 30px; display: flex; flex-direction: column; 
        }
        .modern-tag {
            align-self: flex-start; background: rgba(255,255,255,0.15); 
            color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 600;
            backdrop-filter: blur(10px); display: flex; align-items: center; gap: 4px;
        }
        .modern-cover {
            width: 240px; height: 240px; margin: 30px auto 40px auto; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
        }
        .modern-cover img { width: 100%; height: 100%; object-fit: cover; }
        .modern-title { 
            font-size: 26px; font-weight: 700; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .modern-sub { font-size: 15px; opacity: 0.7; font-weight: 400; }
        .progress-bar {
            margin-top: 30px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px;
        }
        .progress-fill { 
            width: 30%; height: 100%; background: #fff; border-radius: 2px; position: relative; 
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .time-text {
            display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px;
        }
        .modern-footer { margin-top: auto; display: flex; align-items: center; gap: 10px; }

        /* ============================================================
           方案三：通透白玻风 (保持不变)
        ============================================================ */
        .style-apple { background: #f0f0f0; color: #333; overflow: hidden; }
        .apple-bg {
            position: absolute; width: 120%; height: 120%; top: -10%; left: -10%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(1.1) saturate(1.5); opacity: 0.8; z-index: 0;
        }
        .apple-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 325px; height: 450px; z-index: 2;
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px) saturate(1.8); -webkit-backdrop-filter: blur(25px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.2);
            display: flex; flex-direction: column; padding: 28px; box-sizing: border-box; text-align: center;
        }
        .apple-tag {
            position: absolute; top: 20px; right: 20px; background: #000; color: white;
            padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 700;
        }
        .apple-cover-shadow {
            width: 160px; height: 160px; margin: 30px auto 25px auto; position: relative; border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .apple-cover-img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .apple-h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; color: #000; letter-spacing: -0.5px; }
        .apple-sub { font-size: 13px; color: #666; margin-bottom: 30px; font-weight: 500; }
        .apple-controls {
            background: rgba(255,255,255,0.5); padding: 15px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            margin-top: auto; border: 1px solid rgba(255,255,255,0.6);
        }
        .btn-play-circle {
            width: 32px; height: 32px; background: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .icon-play {
            width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
            border-left: 8px solid white; margin-left: 3px;
        }
        .apple-footer-info { display: flex; align-items: center; gap: 8px; }
        .apple-owner-text { font-size: 12px; font-weight: 700; color: #333; }

        /* ============================================================
           方案四：手账拼贴风 (布局优化版)
        ============================================================ */
        .style-scrap {
            background-color: #f8f9fa; color: #333;
            /* 方格纸背景 */
            background-image: linear-gradient(#e9ecef 1px, transparent 1px), linear-gradient(90deg, #e9ecef 1px, transparent 1px);
            background-size: 25px 25px;
        }
        
        /* 1. 顶部元素下移 */
        .scrap-title-area { position: absolute; top: 50px; left: 30px; }
        .scrap-tag {
            background: #ff6b6b; color: white; padding: 4px 10px; display: inline-block;
            font-size: 12px; font-weight: 700; transform: rotate(-2deg);
            border-radius: 20px; border: 2px solid white; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .scrap-h1 {
            background: #2d3436; color: white; padding: 6px 15px; display: inline-block;
            font-size: 24px; font-weight: 800; transform: rotate(1deg); margin-top: 12px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        /* 副标题已移除，移至贴纸 */

        /* 2. 拍立得和胶带下移 */
        .scrap-tape {
            position: absolute; width: 110px; height: 32px; background: rgba(255, 248, 220, 0.9);
            border-left: 3px dotted rgba(0,0,0,0.15); border-right: 3px dotted rgba(0,0,0,0.15);
            transform: rotate(-4deg); top: 140px; left: 50%; margin-left: -55px; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .scrap-polaroid {
            position: absolute; top: 155px; left: 50%; transform: translateX(-50%) rotate(2.5deg);
            width: 230px; background: white; padding: 12px 12px 45px 12px;
            box-shadow: 5px 8px 20px rgba(0,0,0,0.15); transition: transform 0.3s;
        }
        .scrap-img { width: 100%; height: 230px; object-fit: cover; filter: contrast(1.05) sepia(0.1); }
        .scrap-handwriting {
            position: absolute; bottom: 12px; left: 0; width: 100%; text-align: center;
            font-family: 'Comic Sans MS', cursive; /* 手写字体 */
            color: #555; font-size: 15px; transform: rotate(-1deg); font-weight: 600;
        }

        /* 3. 新的手写贴纸 (右下角) */
        .scrap-sticker-new {
            position: absolute; bottom: 110px; right: 35px;
            width: 85px; height: 85px; background: #ffeaa7; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-family: 'Comic Sans MS', cursive; font-weight: 700; color: #d35400; font-size: 13px; line-height: 1.3;
            transform: rotate(12deg); border: 2px dashed #d35400; box-shadow: 3px 3px 8px rgba(0,0,0,0.1);
        }

        .scrap-footer {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .scrap-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #2d3436; }
        .scrap-owner-box { font-weight: 700; font-size: 13px; background: white; padding: 4px 10px; border: 2px solid #2d3436; color: #2d3436; }

        /* 通用：头像和底部文字 */
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8);}
        .footer-text { text-align: left; }
        .footer-text h3 { margin: 0; font-size: 14px; font-weight: 700; }
        .footer-text p { margin: 0; font-size: 10px; opacity: 0.7; margin-top: 2px;}

    </style>
</head>
<body>

    <div class="controls">
        <h2>🔥 小红书海报生成器 (完美版)</h2>
        
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between;">
            <button class="btn-style active" onclick="switchStyle('retro')">📜 复古绘本</button>
            <button class="btn-style" onclick="switchStyle('modern')">🎵 沉浸暗黑</button>
            <button class="btn-style" onclick="switchStyle('apple')">🍎 通透白玻</button>
            <button class="btn-style" onclick="switchStyle('scrap')">✂️ 手账拼贴</button>
        </div>

        <div class="control-group">
            <label>主标题</label>
            <input type="text" id="inputTitle" value="Charlotte's Web" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>副标题 (仅前三种风格有效)</label>
            <input type="text" id="inputSub" value="英文原版广播剧" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>标签内容</label>
            <input type="text" id="inputTag" value="全网首发 🔥" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>集数</label>
            <input type="text" id="inputEp" value="EP.01" oninput="updateText()">
        </div>
        <div class="control-group">
            <label>所有者名称</label>
            <input type="text" id="inputOwner" value="周末英语剧场" oninput="updateText()">
        </div>
        
        <div style="height:1px; background:#eee; margin:15px 0;"></div>

        <div class="control-group">
            <label>🖼️ 封面图 (支持任意背景)</label>
            <input type="file" accept="image/*" onchange="loadImage(this, 'cover')">
        </div>
        <div class="control-group">
            <label>👤 头像</label>
            <input type="file" accept="image/*" onchange="loadImage(this, 'avatar')">
        </div>

        <button class="btn-download" id="downloadBtn" onclick="downloadPoster()">⬇️ 下载 1242x1660 超清图</button>
    </div>

    <div class="preview-wrapper">
        
        <div id="style-retro" class="poster style-retro active">
            <div class="retro-tag tag-text">全网首发 🔥</div>
            <div class="retro-title-group">
                <div class="retro-h1 title-text">Charlotte's Web</div>
                <div class="retro-sub sub-text">英文原版广播剧</div>
            </div>
            <div class="retro-book-container">
                <img src="" class="retro-book-img cover-target" alt="Cover">
                <div class="retro-ep-sticker ep-text">EP.01</div>
            </div>
            <div class="retro-footer">
                <img src="" class="avatar-img avatar-target" alt="Avatar" style="border-color:white;">
                <div class="footer-text">
                    <h3 class="owner-text" style="color:#333;">周末英语剧场</h3>
                    <p style="color:#888;">© 版权所有 · 侵权必究</p>
                </div>
            </div>
        </div>

        <div id="style-modern" class="poster style-modern">
            <div class="modern-bg cover-bg-target" style="background-color: #222;"></div>
            <div class="modern-overlay"></div>
            
            <div class="modern-content">
                <div class="modern-tag">
                    <span class="tag-text">全网首发 🔥</span>
                </div>
                
                <div class="modern-cover">
                    <img src="" class="cover-target" alt="Cover">
                </div>
                
                <div class="modern-title title-text">Charlotte's Web</div>
                <div class="modern-sub"><span class="sub-text">英文原版广播剧</span> · <span class="ep-text">EP.01</span></div>
                
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="time-text">
                    <span>02:14</span>
                    <span>15:30</span>
                </div>

                <div class="modern-footer">
                    <img src="" class="avatar-img avatar-target" style="border-color:rgba(255,255,255,0.3);">
                    <div class="footer-text">
                        <h3 class="owner-text" style="color:white;">周末英语剧场</h3>
                        <p style="color:rgba(255,255,255,0.5);">© All Rights Reserved</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="style-apple" class="poster style-apple">
            <div class="apple-bg cover-bg-target" style="background-color: #ccc;"></div>
            
            <div class="apple-card">
                <div class="apple-tag tag-text">全网首发 🔥</div>
                
                <div class="apple-cover-shadow">
                    <img src="" class="apple-cover-img cover-target" alt="Cover">
                </div>

                <div class="apple-h1 title-text">Charlotte's Web</div>
                <div class="apple-sub sub-text">英文原版广播剧</div>

                <div class="apple-controls">
                    <div class="apple-footer-info">
                        <img src="" class="avatar-target" style="width:28px; height:28px; border-radius:50%;">
                        <span class="apple-owner-text owner-text">周末英语剧场</span>
                    </div>
                    
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="ep-text" style="font-size:12px; font-weight:700; color:#555;">EP.01</span>
                        <div class="btn-play-circle"><div class="icon-play"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="style-scrap" class="poster style-scrap">
            <div class="scrap-title-area">
                <div class="scrap-tag tag-text">全网首发 🔥</div><br>
                <div class="scrap-h1 title-text">Charlotte's Web</div>
                </div>

            <div class="scrap-tape"></div>
            
            <div class="scrap-polaroid">
                <img src="" class="scrap-img cover-target" alt="Cover">
                <div class="scrap-handwriting ep-text">EP.01 - Must Listen!</div>
            </div>

            <div class="scrap-sticker-new">
                <span class="sub-text" style="display: block; padding: 0 5px;">英文原版<br>广播剧</span>
            </div>

            <div class="scrap-footer">
                <img src="" class="scrap-avatar avatar-target">
                <span class="scrap-owner-box owner-text">周末英语剧场</span>
                <span style="font-size: 10px; color: #999;">© Copyright</span>
            </div>
        </div>

    </div>

    <script>
        const defaultCover = "https://via.placeholder.com/300x400?text=Cover"; 
        const defaultAvatar = "https://via.placeholder.com/100?text=Avatar";

        document.querySelectorAll('.cover-target').forEach(img => img.src = defaultCover);
        document.querySelectorAll('.avatar-target').forEach(img => img.src = defaultAvatar);
        document.querySelectorAll('.cover-bg-target').forEach(div => div.style.backgroundImage = `url(${defaultCover})`);

        function switchStyle(styleName) {
            document.querySelectorAll('.btn-style').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.poster').forEach(p => p.classList.remove('active'));
            document.getElementById('style-' + styleName).classList.add('active');
        }

        function updateText() {
            const title = document.getElementById('inputTitle').value;
            const sub = document.getElementById('inputSub').value;
            const tag = document.getElementById('inputTag').value;
            const ep = document.getElementById('inputEp').value;
            const owner = document.getElementById('inputOwner').value;

            document.querySelectorAll('.title-text').forEach(el => el.innerText = title);
            document.querySelectorAll('.sub-text').forEach(el => el.innerHTML = sub.replace(' ', '<br>')); // 支持换行
            document.querySelectorAll('.tag-text').forEach(el => el.innerText = tag);
            document.querySelectorAll('.ep-text').forEach(el => el.innerText = ep); 
            document.querySelectorAll('.owner-text').forEach(el => el.innerText = owner);
        }

        function loadImage(input, type) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (type === 'cover') {
                        document.querySelectorAll('.cover-target').forEach(img => img.src = e.target.result);
                        document.querySelectorAll('.cover-bg-target').forEach(div => div.style.backgroundImage = `url(${e.target.result})`);
                    } else if (type === 'avatar') {
                        document.querySelectorAll('.avatar-target').forEach(img => img.src = e.target.result);
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function downloadPoster() {
            const btn = document.getElementById('downloadBtn');
            const originalText = btn.innerText;
            btn.innerText = "⚡️ 渲染中...";
            btn.disabled = true;

            const activePoster = document.querySelector('.poster.active');
            const clone = activePoster.cloneNode(true);
            
            const container = document.createElement('div');
            container.style.position = 'fixed'; container.style.top = '-10000px'; container.style.left = '-10000px';
            container.style.width = activePoster.offsetWidth + 'px'; container.style.height = activePoster.offsetHeight + 'px';
            container.appendChild(clone); document.body.appendChild(container);

            html2canvas(clone, { scale: 3.312, useCORS: true, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'xiaohongshu-HD.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                document.body.removeChild(container);
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
