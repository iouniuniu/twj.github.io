<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>沈从文 · 边城</title>
    <style>
        :root {
            --accent: rgba(255, 255, 255, 0.9);
            --panel-bg: rgba(0, 0, 0, 0.6);
            /* 字体美化：首选思源宋体，其次是系统宋体，最后是通用衬线体 */
            --font-family: "Source Han Serif CN", "Noto Serif SC", "SimSun", "STSong", serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #000;
            font-family: var(--font-family);
        }

        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            /* 默认背景，可替换 */
            background-image: url('https://images.unsplash.com/photo-1495584029778-b68830398843?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1974&q=80');
            filter: brightness(1.1) contrast(0.9) blur(1px);
            z-index: 1; transition: 0.5s ease-in-out;
        }

        #vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.5) 100%);
            z-index: 2; pointer-events: none;
        }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        #content {
            position: relative; z-index: 4; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--accent); text-align: center; padding: 0 10%;
            pointer-events: none;
            /* 增加文字阴影，提升可读性 */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #content h1 { 
            font-weight: 300; 
            /* 增加字间距，营造空间感 */
            letter-spacing: 0.8em; 
            /* 调整字体大小 */
            font-size: 1.8rem;
            opacity: 0.95; 
            margin: 0; /* 移除默认边距 */
        }
        
        /* 精简后的标题，无需 p 标签 */

        #progress-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.1); z-index: 10;
        }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

        #control-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; background: var(--panel-bg); padding: 30px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 15px; backdrop-filter: blur(10px);
            transition: 0.3s; width: 80%; max-width: 400px;
        }
        .hidden { opacity: 0; pointer-events: none; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        label { color: #ccc; font-size: 0.8rem; margin-bottom: 5px; }
        input[type="file"] { color: #fff; font-size: 0.8rem; }
        
        button {
            padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.2);
            color: #fff; font-size: 0.9rem; cursor: pointer; font-family: var(--font-family);
        }
        button:active { background: rgba(255,255,255,0.4); }

        #time-info { color: #fff; font-size: 0.8rem; text-align: center; font-family: monospace; }
        
        /* 引入思源宋体 (可选，需要网络) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&display=swap');
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="vignette"></div>
    <canvas id="visualizer"></canvas>

    <div id="content">
        <h1 id="title-display">沈从文 · 边城</h1>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <div id="control-panel" class="hidden"> <div id="time-info">00:00 / 00:00</div>
        
        <div class="btn-group">
            <label>1. 选择背景图片 (建议雪景/山水)</label>
            <input type="file" id="img-input" accept="image/*">
        </div>
        
        <div class="btn-group">
            <label>2. 选择音频文件 (MiniMax 生成)</label>
            <input type="file" id="audio-input" accept="audio/*">
        </div>

        <div class="btn-group">
            <label>3. 视觉效果切换</label>
            <button onclick="toggleVisualMode()">切换：环形涟漪 / 悬浮微粒</button>
        </div>

        <button style="background: var(--accent); color: #000; font-weight: 400;" onclick="startExperience()">开始沉浸体验</button>
    </div>

    <script>
        let audioCtx, analyser, dataArray, source, audio;
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let visualMode = 'ripple';
        let isPlaying = false;
        
        document.getElementById('img-input').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                document.getElementById('bg-layer').style.backgroundImage = `url(${url})`;
            }
        };

        document.getElementById('audio-input').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                if (audio) audio.pause();
                const url = URL.createObjectURL(file);
                audio = new Audio(url);
                setupAudio();
                // 选择音频后自动弹出控制面板
                document.getElementById('control-panel').classList.remove('hidden');
            }
        };

        function setupAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                // 增加 FFT 大小以获得更精细的频率数据
                analyser.fftSize = 512;
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            
            audio.ontimeupdate = function() {
                const prog = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progress-bar').style.width = prog + '%';
                updateTimeDisplay();
            };
            audio.onended = function() { isPlaying = false; };
        }

        function updateTimeDisplay() {
            const format = (t) => new Date(t * 1000 || 0).toISOString().substr(14, 5);
            document.getElementById('time-info').innerText = `${format(audio.currentTime)} / ${format(audio.duration || 0)}`;
        }

        function toggleVisualMode() {
            visualMode = visualMode === 'ripple' ? 'particles' : 'ripple';
        }

        // 点击屏幕任意位置（非按钮/输入框）切换控制面板显示
        document.body.onclick = function(e) {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') {
                document.getElementById('control-panel').classList.toggle('hidden');
            }
        };

        function startExperience() {
            if (!audio) return alert('请先选择音频文件');
            
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();

            document.getElementById('control-panel').classList.add('hidden');
            audio.play();
            isPlaying = true;
            if (particles.length === 0) createParticles();
            draw();
        }

        function createParticles() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.2 + 0.05,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
        }

        function draw() {
            requestAnimationFrame(draw);
            if (!analyser || !isPlaying) return;
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 获取低频能量平均值，用于驱动视觉效果
            let bassEnergy = 0;
            for (let i = 0; i < 20; i++) {
                bassEnergy += dataArray[i];
            }
            bassEnergy /= 20;
            const normalizedBass = bassEnergy / 255;

            if (visualMode === 'ripple') {
                drawRipple(normalizedBass);
            } else {
                drawParticles(normalizedBass);
            }
        }

        // 修复后的环形涟漪绘制函数
        function drawRipple(bass) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            // 基础半径 + 低音动态半径
            const radius = 120 + bass * 50; 
            // 透明度随低音变化
            const opacity = 0.1 + bass * 0.4;
            
            ctx.beginPath();
            // 绘制完整的圆
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
            // 线条宽度也随低音微调
            ctx.lineWidth = 1 + bass * 2;
            ctx.stroke();
            
            // 可选：再画一个更细的内圈，增加层次感
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.5})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        function drawParticles(bass) {
            particles.forEach((p) => {
                // 速度和大小受低音影响
                p.y -= (p.speed + bass * 0.5);
                if (p.y < 0) p.y = canvas.height;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (1 + bass * 0.3), 0, Math.PI * 2);
                // 透明度受低音影响闪烁
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity + bass * 0.2})`;
                ctx.fill();
            });
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();
    </script>
</body>
</html>
