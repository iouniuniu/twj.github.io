<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Final Typography Polish</title>
<style>
    :root {
        --highlight-gold: #FFD700;
        --silver-wave: rgba(255, 255, 255, 0.7);
        --panel-bg: rgba(18, 18, 18, 0.75); /*稍微加深背景，增加文字对比度*/
        --border-light: rgba(255, 255, 255, 0.12);
        
        /* 字体栈策略 */
        /* UI 字体：使用苹果原生 SF Pro，保证界面现代感 */
        --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        
        /* 内容字体：使用高雅的衬线体，还原书籍阅读感 */
        /* 优先调用 Apple 的 New York 字体，其次是 Georgia */
        --font-content: "New York", "Times New Roman", "Songti SC", "SimSun", serif;
    }
    
    body {
        margin: 0;
        background-color: #000;
        /* 开启字体平滑抗锯齿 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility; 
        
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
    }

    /* iPhone 17 Pro 模拟器尺寸 */
    .phone-mockup {
        width: 393px; /* iPhone 15/16 Pro 宽度标准 */
        height: 852px;
        background: #000;
        position: relative;
        overflow: hidden;
        border-radius: 55px; /* 更圆润的R角 */
        box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #333; /* 模拟边框 */
    }

    /* 顶部灵动岛占位 (Dynamic Island Area) */
    .dynamic-island-area {
        position: absolute; top: 0; left: 0; right: 0; height: 54px;
        z-index: 100;
        pointer-events: none;
    }

    /* 底部 Home Indicator 占位 */
    .safe-area-bottom {
        position: absolute; bottom: 0; left: 0; right: 0; height: 34px;
        z-index: 100;
    }

    /* 背景层 */
    .bg-layer {
        position: absolute; inset: 0;
        background-image: url('https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?auto=format&fit=crop&w=800&q=80');
        background-size: cover;
        background-position: center;
        filter: blur(50px) brightness(0.45); /* 降低亮度，让文字跳出来 */
        transform: scale(1.1);
    }

    .layout-container {
        position: relative; z-index: 10;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* 避让灵动岛和底部横条 */
        padding: 70px 24px 40px; 
        box-sizing: border-box;
        font-family: var(--font-ui); /* 默认UI字体 */
    }

    /* --- 头部区域 --- */
    .header-group {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
        align-items: flex-start;
    }

    .book-cover {
        width: 100px; height: 150px; /* 2:3 */
        border-radius: 6px;
        background-image: url('https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?auto=format&fit=crop&w=400&q=80');
        background-size: cover;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5); /* 更柔和的投影 */
        flex-shrink: 0;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .meta-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding-top: 4px;
    }

    /* Creator Pill - UI 字体 */
    .creator-pill {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 4px 12px 4px 4px;
        border-radius: 100px;
        border: 1px solid rgba(255,255,255,0.15);
        margin-bottom: 12px;
    }
    .creator-avatar {
        width: 24px; height: 24px; border-radius: 50%;
        background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=60');
        background-size: cover; margin-right: 8px;
    }
    .creator-name {
        font-size: 13px;
        font-weight: 600; /* Semibold */
        letter-spacing: 0.3px; /* 微调间距 */
        color: rgba(255,255,255,0.95);
        text-transform: uppercase; /* 大写更具杂志感 */
        font-size: 11px;
    }

    /* 书名 - UI 字体 Display */
    .main-title {
        font-family: var(--font-ui);
        font-size: 26px; 
        font-weight: 700; /* Bold */
        line-height: 1.1;
        margin-bottom: 6px; 
        color: #fff;
        letter-spacing: -0.5px; /* 紧缩间距，更现代 */
    }

    .sub-title {
        font-family: var(--font-ui);
        font-size: 15px; 
        color: rgba(255,255,255,0.6);
        font-weight: 400; /* Regular */
    }

    /* --- 玻璃面板 --- */
    .glass-panel {
        flex: 1;
        background: var(--panel-bg);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-radius: 32px;
        border: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        /* 内部阴影增加层次 */
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); 
    }

    /* 内容滚动区 */
    .lyrics-scroll-area {
        flex: 1;
        padding: 0 28px; /* 加宽左右边距，呼吸感更好 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        text-align: left;
        /* 遮罩 */
        mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
    }

    /* 字体排版核心：衬线体 */
    .lyric-line {
        font-family: var(--font-content); /* 切换到衬线体 */
        font-size: 19px; /* 未激活状态字号 */
        color: rgba(255,255,255,0.4);
        margin: 14px 0;
        line-height: 1.5; /* 黄金行高 */
        transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-origin: left center;
        letter-spacing: -0.2px; /* 衬线体通常稍微紧一点更好读 */
    }

    /* 激活行：视觉绝对重心 */
    .lyric-line.active {
        font-size: 30px; /* 放大到 30px */
        font-weight: 600; /* Semibold for Serif */
        color: #fff;
        margin: 28px 0; /* 上下留白，强调地位 */
        line-height: 1.3; /* 大字行高稍微收紧 */
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* 单词级高亮 */
    .word-highlight {
        color: var(--highlight-gold);
        font-style: italic; /* 衬线体的斜体非常优美，这里可以用 */
        position: relative;
    }
    
    /* 底部功能区 */
    .panel-footer {
        height: 72px;
        border-top: 1px solid rgba(255,255,255,0.06);
        background: rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        padding: 0 24px;
    }

    .waveform-wrapper {
        flex: 1; height: 24px; display: flex; align-items: center; gap: 4px; position: relative;
    }
    
    .wave-bar {
        width: 3px; border-radius: 2px;
        background: rgba(255,255,255,0.1);
        transition: height 0.3s ease;
    }

    .wave-fill-overlay {
        position: absolute; top: 0; left: 0; bottom: 0; width: 55%; overflow: hidden;
        display: flex; align-items: center; gap: 4px;
        border-right: 1.5px solid rgba(255,255,255,0.9); /* 指示线变细 */
    }
    
    /* 银色波形 */
    .wave-bar-lit {
        width: 3px; border-radius: 2px;
        background: var(--silver-wave);
    }

    .btn-fullscreen {
        width: 44px; height: 44px;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        display: flex; justify-content: center; align-items: center;
        margin-left: 20px;
        border: 1px solid rgba(255,255,255,0.1);
    }
    
</style>
</head>
<body>

<div class="phone-mockup">
    <div class="dynamic-island-area"></div>
    
    <div class="bg-layer"></div>

    <div class="layout-container">
        
        <div class="header-group">
            <div class="book-cover"></div>
            <div class="meta-info">
                <div class="creator-pill">
                    <div class="creator-avatar"></div>
                    <span class="creator-name">Morning Reader</span>
                </div>
                <div class="main-title">Learning to Live with Complexity</div>
                <div class="sub-title">Chapter 1: The Systems View</div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="lyrics-scroll-area">
                <div class="lyric-line">Simple systems are easy to define.</div>
                
                <div class="lyric-line active">
                    But <span class="word-highlight">complex</span> systems are characterized by...
                </div>
                
                <div class="lyric-line">unpredictability and emergence.</div>
                <div class="lyric-line" style="opacity:0.25">Everything is connected.</div>
            </div>

            <div class="panel-footer">
                <div class="waveform-wrapper">
                    <div id="wave-base" style="display:flex; gap:4px; align-items:center; width:100%;"></div>
                    <div class="wave-fill-overlay">
                        <div id="wave-lit" style="display:flex; gap:4px; align-items:center; width:260px;"></div>
                    </div>
                </div>

                <div class="btn-fullscreen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                    </svg>
                </div>
            </div>
        </div>

    </div>
    
    <div class="safe-area-bottom"></div>
</div>

<script>
    const baseContainer = document.getElementById('wave-base');
    const litContainer = document.getElementById('wave-lit');
    
    // 生成更细腻的波形 (更多条数，更细)
    for(let i=0; i<50; i++) { 
        let randomFactor = Math.random() * 6;
        let sineFactor = Math.sin(i / 6) * 5 + 8; 
        let h = Math.max(4, sineFactor + randomFactor);
        
        let b = document.createElement('div');
        b.className = 'wave-bar';
        b.style.height = h + 'px';
        baseContainer.appendChild(b);

        let l = document.createElement('div');
        l.className = 'wave-bar-lit';
        l.style.height = h + 'px';
        litContainer.appendChild(l);
    }
</script>

</body>
</html>
