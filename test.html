<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>沈从文 · 边城 V12</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;500;900&display=swap');

        :root {
            --accent: rgba(255, 255, 255, 0.95);
            --panel-bg: rgba(0, 0, 0, 0.75);
            --font-main: 'Noto Serif SC', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #000;
            font-family: var(--font-main);
        }

        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: brightness(1.25) contrast(0.9); /* 提亮背景增强明度 */
            z-index: 1; transition: 1.5s ease-in-out;
        }

        #vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.35) 100%);
            z-index: 2; pointer-events: none;
        }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        /* 艺术标识容器 */
        #branding-container {
            position: relative; z-index: 4; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        .art-logo {
            display: flex;
            flex-direction: row-reverse; /* 竖排由右至左 */
            align-items: flex-start;
            color: var(--accent);
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        /* 边城标题组 */
        .main-title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 25px;
            position: relative;
        }

        .main-title {
            writing-mode: vertical-rl;
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 0.25em;
            transform: translateY(-20px); /* 边城位置更高 */
        }

        .seal {
            position: absolute;
            left: -15px; /* 位于左侧 */
            bottom: 25px; /* 位于下方 */
            width: 38px; height: 38px;
            background-color: rgba(180, 40, 40, 0.95);
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; font-weight: 900;
            border-radius: 1px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
        }

        /* 英文作者名 */
        .sub-title {
            writing-mode: vertical-rl;
            font-size: 1rem;
            font-weight: 200;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            padding-top: 60px; /* 英文与中文Y轴错开 */
            opacity: 0.7;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 10px;
        }

        /* 进度条 */
        #progress-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.05); z-index: 10;
        }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

        /* 控制面板 */
        #control-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; background: var(--panel-bg); padding: 35px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(20px);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); width: 85%; max-width: 380px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hidden { opacity: 0; pointer-events: none; transform: translate(-50%, -40%); }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        label { color: #999; font-size: 0.75rem; letter-spacing: 1px; }
        input[type="file"] { color: #eee; font-size: 0.8rem; }
        
        button {
            padding: 14px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1);
            color: #fff; font-size: 0.9rem; cursor: pointer; font-family: var(--font-main);
        }
        
        #time-info { color: #666; font-size: 0.8rem; text-align: center; font-family: monospace; }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="vignette"></div>
    <canvas id="visualizer"></canvas>

    <div id="branding-container">
        <div class="art-logo">
            <div class="main-title-wrapper">
                <div class="main-title">边城</div>
                <div class="seal">沈</div>
            </div>
            <div class="sub-title">SHEN CONGWEN</div>
        </div>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <div id="control-panel">
        <div id="time-info">待命</div>
        <div class="btn-group">
            <label>上传背景图片</label>
            <input type="file" id="img-input" accept="image/*">
        </div>
        <div class="btn-group">
            <label>上传音频文件</label>
            <input type="file" id="audio-input" accept="audio/*">
        </div>
        <div class="btn-group">
            <button onclick="toggleVisual()">切换视觉：环形 / 微粒</button>
        </div>
        <button id="start-btn" style="background: #fff; color: #000; font-weight: 600; margin-top: 10px;">开启沉浸体验</button>
    </div>

    <script>
        let audioCtx, analyser, dataArray, source, audio;
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        let isPlaying = false;
        let visualMode = 'ripple'; // 'ripple' 或 'particles'
        let particles = [];
        
        // 文件上传处理
        document.getElementById('img-input').onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            document.getElementById('bg-layer').style.backgroundImage = `url(${url})`;
        };

        document.getElementById('audio-input').onchange = (e) => {
            if (audio) audio.pause();
            audio = new Audio(URL.createObjectURL(e.target.files[0]));
            setupAudio();
        };

        function setupAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            audio.ontimeupdate = () => {
                const prog = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progress-bar').style.width = prog + '%';
                const format = (t) => new Date(t * 1000 || 0).toISOString().substr(14, 5);
                document.getElementById('time-info').innerText = `${format(audio.currentTime)} / ${format(audio.duration || 0)}`;
            };
        }

        function toggleVisual() {
            visualMode = visualMode === 'ripple' ? 'particles' : 'ripple';
        }

        // 核心：点击开启体验，静默 6s
        document.getElementById('start-btn').onclick = () => {
            if (!audio) return alert('请先上传音频文件');
            
            // 请求 Android 沉浸全屏
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            
            document.getElementById('control-panel').classList.add('hidden');

            // 静默 6s 后正式开始
            setTimeout(() => {
                audio.play();
                isPlaying = true;
                if (particles.length === 0) createParticles();
                draw();
            }, 6000);
        };

        function createParticles() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.3 + 0.1
                });
            }
        }

        function draw() {
            if (!isPlaying) return;
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (visualMode === 'ripple') {
                // 环形涟漪逻辑：镜像对称
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const baseRadius = 160;
                ctx.beginPath();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.5)`;

                for (let i = 0; i < 120; i++) {
                    const amplitude = dataArray[i] / 255;
                    const r = baseRadius + amplitude * 50;
                    const angle = (i / 120) * Math.PI - Math.PI / 2;
                    const x1 = centerX + Math.cos(angle) * r;
                    const y1 = centerY + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
                }
                for (let i = 120; i >= 0; i--) {
                    const amplitude = dataArray[i] / 255;
                    const r = baseRadius + amplitude * 50;
                    const angle = (i / 120) * Math.PI - Math.PI / 2;
                    const x2 = centerX - Math.cos(angle) * r;
                    const y2 = centerY + Math.sin(angle) * r;
                    ctx.lineTo(x2, y2);
                }
                ctx.closePath();
                ctx.stroke();
            } else {
                // 悬浮微粒逻辑
                particles.forEach((p, i) => {
                    const influence = dataArray[i % 30] / 50;
                    p.y -= (p.speed + influence);
                    if (p.y < 0) p.y = canvas.height;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + influence})`;
                    ctx.fill();
                });
            }
        }

        document.body.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                document.getElementById('control-panel').classList.toggle('hidden');
            }
        };

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.onresize();
    </script>
</body>
</html>
