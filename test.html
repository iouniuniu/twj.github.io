<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Responsive Center Edition</title>
<style>
    :root {
        --highlight-gold: #FFD700;
        --silver-wave: rgba(255, 255, 255, 0.85);
        --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, sans-serif;
        --font-content: "New York", "Times New Roman", "Songti SC", serif;
        
        /* 响应式间距变量 */
        --spacing-safe-top: env(safe-area-inset-top, 20px);
        --spacing-safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #000; overflow: hidden; /* 禁止页面滚动 */
        font-family: var(--font-ui); color: white;
        -webkit-font-smoothing: antialiased;
    }

    /* 全屏容器：直接作为视口 */
    .app-viewport {
        position: relative;
        width: 100%; 
        height: 100dvh; /* 这里的 dvh 适配了移动端动态地址栏 */
        display: flex;
        flex-direction: column;
        z-index: 10;
    }

    /* --- 0. 背景与遮罩系统 (Super Mask) --- */
    .bg-layer {
        position: absolute; inset: 0;
        background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80');
        background-size: cover; background-position: center;
        filter: blur(30px); transform: scale(1.1); z-index: 0;
    }
    .mask-dimmer { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 1; mix-blend-mode: multiply; }
    .mask-vignette {
        position: absolute; inset: 0; z-index: 2;
        background: radial-gradient(circle at 50% 40%, transparent 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.9) 100%);
    }
    .mask-anchor {
        position: absolute; bottom: 0; left: 0; right: 0; height: 60%; z-index: 3;
        background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
        pointer-events: none;
    }

    /* --- 1. 头部区域 (Header) --- */
    /* 高度自适应，占比约 25-30% */
    .header-section {
        flex: 0 0 auto; /* 不伸缩 */
        padding-top: calc(var(--spacing-safe-top) + 2vh);
        padding-left: 6vw; padding-right: 6vw;
        display: flex; gap: 4vw; align-items: flex-start;
        z-index: 10;
        margin-bottom: 2vh;
    }

    .book-cover {
        /* 核心改动：高度跟随视口高度 (vh)，保持 2:3 比例 */
        height: 18vh; 
        aspect-ratio: 2/3;
        border-radius: 8px;
        background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=400&q=80');
        background-size: cover;
        box-shadow: 0 1vh 3vh rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.15);
        flex-shrink: 0;
    }

    .meta-info {
        flex: 1; display: flex; flex-direction: column; padding-top: 0.5vh;
    }

    .creator-pill {
        align-self: flex-start; display: inline-flex; align-items: center;
        background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(10px);
        padding: 0.5vh 1.2vh 0.5vh 0.5vh; border-radius: 100px;
        border: 1px solid rgba(255,255,255,0.2); margin-bottom: 1.5vh;
    }
    .creator-avatar {
        width: 3vh; height: 3vh; border-radius: 50%; margin-right: 0.8vh;
        background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=60');
        background-size: cover;
    }
    .creator-name { font-size: 1.2vh; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    /* 标题使用 clamp 响应式字体 */
    .main-title {
        font-size: clamp(20px, 3vh, 28px); 
        font-weight: 700; line-height: 1.1; margin-bottom: 0.8vh;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .sub-title { font-size: clamp(12px, 1.8vh, 16px); color: rgba(255,255,255,0.7); }

    /* --- 2. 歌词视口 (Lyrics Viewport) --- */
    /* 这里的 flex: 1 确保它占据所有剩余高度 */
    .lyrics-viewport {
        flex: 1; 
        display: flex;
        flex-direction: column;
        justify-content: center; /* 垂直居中核心 */
        align-items: flex-start; /* 左对齐 */
        padding: 0 6vw; /* 左右边距用 vw */
        z-index: 10;
        position: relative;
        /* 为了让高亮行绝对居中，这里使用了 mask 来淡化上下边缘，不是为了遮挡 */
        mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
    }

    .lyric-line {
        font-family: var(--font-content);
        /* 字体大小随视口宽度(vw)微调，保证换行位置一致 */
        font-size: clamp(18px, 5vw, 22px); 
        color: rgba(255,255,255,0.5);
        margin: 1.5vh 0; /* 间距随高度变化 */
        line-height: 1.5;
        transform-origin: left center;
        transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    /* 激活行：绝对的视觉中心 */
    .lyric-line.active {
        /* 更大的字体，但有上限 */
        font-size: clamp(26px, 7vw, 34px); 
        font-weight: 600;
        color: #fff;
        margin: 3vh 0; /* 上下留出更多呼吸空间 */
        line-height: 1.3;
        text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }

    .word-highlight { 
        color: var(--highlight-gold); font-style: italic; 
        text-shadow: 0 0 2vh rgba(255, 215, 0, 0.4); /* 光晕也用 vh */
    }

    /* --- 3. 底部功能区 (Footer) --- */
    .footer-section {
        flex: 0 0 auto;
        height: 8vh; /* 高度相对固定 */
        display: flex; align-items: center;
        padding: 0 6vw;
        padding-bottom: var(--spacing-safe-bottom);
        z-index: 10;
    }

    .waveform-wrapper { flex: 1; height: 3vh; display: flex; align-items: center; gap: 0.5vw; position: relative; }
    .wave-bar { width: 0.8vw; border-radius: 1vw; background: rgba(255,255,255,0.15); transition: height 0.3s ease; }
    .wave-fill-overlay {
        position: absolute; top: 0; left: 0; bottom: 0; width: 55%; overflow: hidden;
        display: flex; align-items: center; gap: 0.5vw; border-right: 2px solid #fff;
    }
    .wave-bar-lit { width: 0.8vw; border-radius: 1vw; background: var(--silver-wave); box-shadow: 0 0 8px rgba(255,255,255,0.3); }

    .btn-fullscreen {
        width: 6vh; height: 6vh; /* 按钮大小随高度变化 */
        border-radius: 50%;
        background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
        display: flex; justify-content: center; align-items: center;
        margin-left: 4vw; border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-fullscreen svg { width: 2.5vh; height: 2.5vh; }

</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="mask-dimmer"></div>
<div class="mask-vignette"></div>
<div class="mask-anchor"></div>

<div class="app-viewport">
    
    <div class="header-section">
        <div class="book-cover"></div>
        <div class="meta-info">
            <div class="creator-pill">
                <div class="creator-avatar"></div>
                <span class="creator-name">Morning Reader</span>
            </div>
            <div class="main-title">Learning to Live with Complexity</div>
            <div class="sub-title">Chapter 1: The Systems View</div>
        </div>
    </div>

    <div class="lyrics-viewport">
        <div class="lyric-line">Simple systems are easy to define.</div>
        
        <div class="lyric-line active">
            But <span class="word-highlight">complex</span> systems are characterized by...
        </div>
        
        <div class="lyric-line">unpredictability and emergence.</div>
    </div>

    <div class="footer-section">
        <div class="waveform-wrapper">
            <div id="wave-base" style="display:flex; gap:0.5vw; align-items:center; width:100%;"></div>
            <div class="wave-fill-overlay">
                <div id="wave-lit" style="display:flex; gap:0.5vw; align-items:center; width:100%;"></div>
            </div>
        </div>

        <div class="btn-fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
            </svg>
        </div>
    </div>

</div>

<script>
    const baseContainer = document.getElementById('wave-base');
    const litContainer = document.getElementById('wave-lit');
    
    // 动态生成波形，数量根据屏幕宽度适配
    // 这里简单生成40根，实际开发可以检测 window.innerWidth
    for(let i=0; i<40; i++) { 
        let randomFactor = Math.random() * 0.8; // vh factor
        let sineFactor = Math.sin(i / 5) * 1 + 1.5; 
        let h = Math.max(0.5, sineFactor + randomFactor);
        
        // 使用 vh 单位让波形高度也响应式
        let heightStr = h + 'vh';

        let b = document.createElement('div');
        b.className = 'wave-bar';
        b.style.height = heightStr;
        baseContainer.appendChild(b);

        let l = document.createElement('div');
        l.className = 'wave-bar-lit';
        l.style.height = heightStr;
        litContainer.appendChild(l);
    }
</script>

</body>
</html>
