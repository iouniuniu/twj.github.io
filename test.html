    <style>
        :root {
            /* 动态主题色 (由 JS 注入) */
            --theme-color: #2c3e50; 

            /* 词性颜色 */
            --t-subj: #C0392B; --t-verb: #2980B9; --t-obj: #27AE60; --t-mod: #D35400; --t-prep: #8E44AD; --t-conn: #7F8C8D;
            
            /* 词性背景 */
            --bg-noun: #D6EAF8; --bg-verb: #D5F5E3; --bg-adj: #E8DAEF;
            
            /* 长难句背景 */
            --bg-trunk: #EBF5FB; --bg-clause-1: #FEF5E7; --bg-clause-2: #E9F7EF;
            /* 边框色 */
            --bd-trunk: #3498DB; --bd-clause-1: #F39C12; --bd-clause-2: #2ECC71; --bd-struct: #2C3E50;
            
            /* 通用 */

            --p-w: 1080px; --p-h: 1440px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; }
        body { background: #444; display: flex; flex-direction: column; align-items: center; padding: 40px 0; gap: 40px; font-family: 'Noto Sans SC', sans-serif; }
        
        /* 错误提示条 */

        /* Loading 遮罩 */
        #loading-mask { position: fixed; inset: 0; background: #f9f9f9; z-index: 9998; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Lato'; color: #555; }
        .spinner { width: 50px; height: 50px; border: 5px solid #ccc; border-top-color: var(--theme-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 容器 */

        .card.cover-page { padding: 0; } .card.normal-page { padding: 50px 60px; }
        .content-body { flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 0; overflow: hidden; width: 100%; }
        .cover-page .content-body { padding: 0 60px; } .normal-page .content-body { padding: 0; }

        /* 首页 (960px Height) */
        .hero-section { width: 100%; height: 960px; background: #e0e0e0; cursor: pointer; border-bottom: 8px solid var(--theme-color); position: relative; flex-shrink: 0; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .hero-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #777; font-size: 20pt; font-family: 'Lato'; text-align: center; border: 3px dashed #bbb; padding: 15px 30px; border-radius: 10px; }
        
        .cover-header { padding: 30px 60px 10px 60px; display: flex; flex-direction: column; align-items: center; text-align: center; flex-shrink: 0; }
        .meta-tag { background: var(--theme-color); color: white; padding: 6px 20px; border-radius: 50px; font-family: 'Lato'; font-weight: 900; font-size: 12pt; margin-bottom: 15px; letter-spacing: 1px; }
        
        /* 标题增强 */
        .poster-title { font-family: 'Lora'; font-size: 60pt; font-weight: 700; color: var(--text-main); line-height: 1.0; margin-bottom: 10px; }
        .poster-subtitle { font-family: 'Noto Sans SC'; font-size: 40pt; color: #5d6d7e; font-weight: 400; margin-bottom: 20px; position: relative; display: inline-block; }
        .poster-subtitle::after { content: ""; display: block; width: 60px; height: 3px; background: var(--theme-color); margin: 10px auto 0 auto; }

        /* 续页头 */
        .mini-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #ccc; padding-bottom: 15px; margin-bottom: 20px; height: 60px; flex-shrink: 0; width: 100%; }
        .mini-title { font-family: 'Lora'; font-weight: 700; font-size: 16pt; color: var(--text-main); }
        .continued-tag { font-family: 'Lato'; font-weight: 700; font-style: italic; background: transparent; padding: 5px 0; border-radius: 0; font-size: 11pt; color: #666; }

        /* 正文 */
        .row { display: flex; gap: 40px; width: 100%; padding: 20px 0; border-bottom: 1px solid #f9f9f9; align-items: flex-start; flex-shrink: 0; }
        .col-eng { flex: 6; font-family: 'Lora'; font-size: 18pt; line-height: 1.8; text-align: justify; padding-right: 25px; border-right: 2px solid #f0f0f0; }
        .col-chi { flex: 4; font-family: 'Noto Sans SC'; font-size: 16pt; line-height: 1.8; color: #5d6d7e; text-align: justify; font-weight: 400; padding-top: 2px; }

        /* 边栏 (一致布局) */
        .row.supp-style { background: var(--supp-bg); padding: 25px; border-radius: 12px; margin: 15px 0; border: none; }

        .row.supp-style .col-chi { font-size: 14pt !important; line-height: 1.6; color: #555; }

        .row.supp-style h3 { font-size: 16pt !important; border-left-width: 5px; }

        .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px 40px; width: 100%; margin-bottom: 30px; flex-shrink: 0; }
        .vocab-item { background: #fff; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 5px; display: flex; flex-direction: column; gap: 6px; }
        .v-line-1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .v-word { font-family: 'Lora'; font-weight: 700; font-size: 19pt; color: #2c3e50; padding: 0 5px; border-radius: 4px; }

        .v-line-3 { font-size: 14pt; color: #7f8c8d; font-style: italic; font-family: 'Lora'; line-height: 1.4; margin-top: 2px; }

        .sa-sentence-wrapper { display: flex; flex-wrap: wrap; column-gap: 0; row-gap: 35px; line-height: 1.5; margin-bottom: 25px; padding-top: 10px; align-items: flex-end; width: 100%; }

        .chunk-text { font-family: 'Lora'; font-size: 20pt; color: #2c3e50; padding: 4px 5px; font-weight: 500; border-radius: 0; }
        .chunk-group { border-bottom: 3px solid #ccc; padding-bottom: 2px; margin: 0 3px; }
        .chunk-group .chunk-text { padding-bottom: 0; } 
        .chunk-lbl { font-size: 10pt; font-family: 'Noto Sans SC'; font-weight: 800; margin-top: 4px; white-space: nowrap; width: 100%; text-align: center; height: 15px; }
        .chunk-lbl:empty { height: 0; margin-top: 0; }
        .bracket { font-size: 20pt; color: #d35400; font-family: 'Lato'; font-weight: 300; padding: 4px 6px; display: inline-block; }
        
        .bg-trunk .chunk-text { background-color: var(--bg-trunk); }
        .bg-clause-1 .chunk-text { background-color: var(--bg-clause-1); }
        .bg-clause-1.bracket { background-color: var(--bg-clause-1); }
        .bg-clause-2 .chunk-text { background-color: var(--bg-clause-2); }
        .bg-clause-2.bracket { background-color: var(--bg-clause-2); }
        
        .l-subj { color: var(--t-subj); border-color: var(--t-subj); } 
        .l-verb { color: var(--t-verb); border-color: var(--t-verb); } 
        .l-obj { color: var(--t-obj); border-color: var(--t-obj); } 
        .l-conn { color: var(--t-conn); border-color: var(--t-conn); }

        .sa-step-box, .q-card { background: #fdfefe; padding: 20px 25px; border-radius: 8px; border: 1px solid #eee; box-shadow: 2px 2px 8px rgba(0,0,0,0.02); margin-bottom: 12px; width: 100%; }
        .bd-struct { border-left: 5px solid var(--bd-struct); }
        .bd-trunk { border-left: 5px solid var(--bd-trunk); background-color: #FDFEFE; }
        .bd-clause-1 { border-left: 5px solid var(--bd-clause-1); background-color: #FEF9E7; }
        .bd-clause-2 { border-left: 5px solid var(--bd-clause-2); background-color: #E9F7EF; }
        .q-card { border-left: 5px solid var(--theme-color); }
        
        .sa-trans { font-size: 16pt; color: #444; font-weight: 600; font-style: italic; margin-bottom: 20px; padding: 15px; border: 1px dashed #ccc; border-radius: 8px; width: 100%; background: #fff; }
        .sa-step { margin-bottom: 12px; font-size: 15pt; color: #555; line-height: 1.6; }
        .sa-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11pt; margin-right: 10px; font-weight: 800; color: #fff; background: #555; font-family: 'Lato'; text-transform: uppercase; }

        .q-header { display: flex; align-items: baseline; margin-bottom: 5px; }
        .q-num { color: var(--theme-color); font-size: 18pt; font-weight: 900; margin-right: 10px; font-family: 'Lato'; }
        .q-text { font-size: 18pt; color: #2c3e50; font-weight: 600; font-family: 'Lora'; }

        .q-opt { font-size: 15pt; color: #555; font-family: 'Lato'; }
        .q-blank { border-bottom: 2px solid #333; width: 100px; display: inline-block; }

        .footer { margin-top: auto; display: flex; justify-content: space-between; border-top: 1px solid #eee; padding: 0 60px; font-size: 11pt; color: #95a5a6; flex-shrink: 0; height: 70px; align-items: center; width: 100%; box-sizing: border-box; font-family: 'Lato'; }

        #btn-download:hover { transform: scale(1.05); background: #34495e; }
        #btn-download:active { transform: scale(0.95); }

        { t: "bracket bg-clause-1", w: "(", l: "", txt: "" },
        { t: "chunk bg-clause-1", w: "when brains rewire themselves", l: "l-mod", txt: "定语从句" },
        { t: "bracket bg-clause-1", w: ")", l: "", txt: "" },
        { t: "chunk", w: ": at the ages of 9, 32, 66, and 83.", l: "", txt: "" }
    ];
    const SA_TRANS = "研究人员确定了大脑自我重塑的四个主要“转折点”：分别在9岁、32岁、66岁和83岁。";
    const SA_STEPS = [
        { label: "Step 1", text: "句子主干是 The researchers identified four major “turning points”（研究人员确定了四个主要转折点）。", type: "bd-trunk" },
        { label: "Step 2", text: "when 引导定语从句 (when brains rewire themselves) 修饰 turning points，说明是什么样的转折点（即大脑重新连接的时刻）。", type: "bd-clause-1" }
    ];
    const QUIZ_ITEMS = [
        { q: "How many \"eras\" of brain development did the researchers identify?", a: "<span class='q-opt'>A. 3</span><span class='q-opt'>B. 4</span><span class='q-opt'>C. 5</span><span class='q-opt'>D. 6</span>" },
        { q: "At what age does the brain enter \"adulthood\" according to the study?", a: "<span class='q-opt'>A. 18</span><span class='q-opt'>B. 21</span><span class='q-opt'>C. 32</span><span class='q-opt'>D. 66</span>" },
        { q: "Which type of brain matter helps with learning and paying attention?", a: "<span class='q-opt'>A. Gray matter</span><span class='q-opt'>B. White matter</span><span class='q-opt'>C. Black matter</span><span class='q-opt'>D. Blue matter</span>" }
    ];

    // --- Core Logic ---
    function render() {
        // [Safety Scope]
        let cardIdx = 1;
        let currentCard;
        let container;
        const SAFE_BOTTOM = 1350; 

        // Helper functions
        function createNewPage() {
            cardIdx++; 
            currentCard = createNormalPage(cardIdx);
            document.getElementById('card-container').appendChild(currentCard);
            container = currentCard.querySelector('.content-body');
        }

        function checkAndMove(el, limit) {
            const rect = el.getBoundingClientRect();
            const cardTop = currentCard.getBoundingClientRect().top;
            if ((rect.bottom - cardTop) > limit) {
                container.removeChild(el); 
                createNewPage(); 
                container.appendChild(el);
            }
        }

        function appendWithCheck(el) {
            container.appendChild(el);
            checkAndMove(el, SAFE_BOTTOM);
        }

        try {
            // [Phase 6: Data Integrity Check]
            if (!MAIN_CONTENT || MAIN_CONTENT.length === 0) {
                throw new Error("MAIN_CONTENT is empty. Please check data injection.");
            }

            document.documentElement.style.setProperty('--theme-color', META.themeColor);
            const root = document.getElementById('card-container');
            
            // Initial Page Setup
            currentCard = createCoverPage();
            root.appendChild(currentCard);
            container = currentCard.querySelector('.content-body');

            // 1. Content
            MAIN_CONTENT.forEach(item => {
                const row = createContentRow(item);
                container.appendChild(row);
                checkAndMove(row, SAFE_BOTTOM);
            });

            // Start new page for Appendix
            createNewPage();

            // 2. Vocab
            appendWithCheck(createTitle('中考高频词汇 (Vocab)'));
            let grid = document.createElement('div'); grid.className = 'vocab-grid';
            container.appendChild(grid);
            if (VOCAB_LIST) {
                VOCAB_LIST.forEach((v, i) => {
                    const item = createVocabItem(v, i+1); grid.appendChild(item);
                    if ((grid.getBoundingClientRect().bottom - currentCard.getBoundingClientRect().top) > SAFE_BOTTOM) {
                        grid.removeChild(item); 
                        createNewPage();
                        grid = document.createElement('div'); grid.className = 'vocab-grid';
                        container.appendChild(grid); grid.appendChild(item);
                    }
                });
            }

            // 3. Sentence Analysis
            appendWithCheck(createTitle('长难句分析 (Sentence Analysis)'));
            let saWrapper = document.createElement('div'); saWrapper.className = 'sa-sentence-wrapper';
            container.appendChild(saWrapper);
            if (SA_CHUNKS) {
                SA_CHUNKS.forEach(chunk => {
                    let el = createSaChunk(chunk);
                    if (el) { 
                        saWrapper.appendChild(el);
                        if ((saWrapper.getBoundingClientRect().bottom - currentCard.getBoundingClientRect().top) > SAFE_BOTTOM) {
                            saWrapper.removeChild(el); 
                            createNewPage();
                            saWrapper = document.createElement('div'); saWrapper.className = 'sa-sentence-wrapper';
                            container.appendChild(saWrapper); saWrapper.appendChild(el);
                        }
                    }
                });
            }

            const transEl = document.createElement('div'); transEl.className = 'sa-trans'; transEl.innerHTML = SA_TRANS || "";
            appendWithCheck(transEl);

            if (SA_STEPS) {
                SA_STEPS.forEach(step => { const el = createSaStep(step); appendWithCheck(el); });
            }

            // 4. Quiz
            appendWithCheck(createTitle('趣闻挑战 (Little Quiz)'));
            if (QUIZ_ITEMS) {
                QUIZ_ITEMS.forEach((q, i) => {
                    const qCard = document.createElement('div'); qCard.className = 'q-card';
                    qCard.innerHTML = `<div class="q-header"><div class="q-num">${i+1}</div><div class="q-text">${q.q}</div></div><div class="q-opts">${q.a}</div>`;
                    appendWithCheck(qCard);
                });
            }

            updateFooters(cardIdx);
            
            // Success: Remove loading
            document.getElementById('loading-mask').style.display = 'none';

        } catch(e) {
            console.error(e);
            document.getElementById('loading-mask').style.display = 'none';
            document.getElementById('status-bar').style.display = 'block';
            document.getElementById('status-bar').innerText = "Render Error: " + e.message;
        }
    }

    // --- Generators ---
    function createCoverPage() {
        const d = document.createElement('div'); d.className = 'card cover-page';
        d.innerHTML = `<div class="hero-section" onclick="document.getElementById('upload-trigger').click()"><img id="hero-img" class="hero-img"><div class="hero-placeholder" id="hero-txt">Tap to Upload Cover</div></div><div class="cover-header"><div class="meta-tag">${META.issue}</div><div class="poster-title">${META.title}</div><div class="poster-subtitle">${META.subtitle}</div></div><div class="content-body" style="padding:0 60px;"></div><div class="footer"><span class="footer-left">Designed for Educational Purpose</span><span class="footer-right page-num"></span></div>`;
        return d;
    }
    function createNormalPage(idx) {
        const d = document.createElement('div'); d.className = 'card normal-page';
        d.innerHTML = `<header class="mini-header"><div class="mini-title">${META.title}</div><div class="continued-tag">Continued...</div></header><div class="content-body"></div><div class="footer"><span class="footer-left">Designed for Educational Purpose</span><span class="footer-right page-num"></span></div>`;
        return d;
    }
    function createContentRow(item) {
        const d = document.createElement('div'); d.className = 'row';
        if (item.type === 'supp') d.classList.add('supp-style');
        d.innerHTML = `<div class="col-eng">${item.eng}</div><div class="col-chi">${item.chi}</div>`;
        return d;
    }
    function createTitle(text) { const d = document.createElement('div'); d.className = 'app-h'; d.innerText = text; return d; }
    
    function createVocabItem(v, idx) {
        let bgClass = '';
        if (v.p.includes('n.')) bgClass = 'hl-n';
        else if (v.p.includes('v.')) bgClass = 'hl-v';
        else if (v.p.includes('adj') || v.p.includes('adv')) bgClass = 'hl-adj';
        else bgClass = 'hl-n'; 
        const d = document.createElement('div'); d.className = 'vocab-item';
        d.innerHTML = `<div class="v-line-1"><span class="v-word ${bgClass}">${v.w}</span><span class="v-idx">${idx}</span><span class="v-ipa">[${v.ipa}]</span><span class="v-pos">${v.p}</span><span class="v-mean">${v.m}</span></div><div class="v-line-2">${v.c}</div><div class="v-line-3">"${v.e}"</div>`;
        return d;
    }
    
    function createSaChunk(c) {
        if (!c || !c.t) return null;
        const d = document.createElement('div'); d.className = `chunk ${c.t}`;
        if (c.t.includes('chunk-group')) {
            const color = c.l ? `var(--${c.l.replace('l-', 't-')})` : '#ccc';
            d.style.borderBottomColor = color;
        }
        const label = c.l ? c.l : '';
        const txt = c.txt ? c.txt : '';
        d.innerHTML = `<span class="chunk-lbl ${label}">${txt}</span><span class="chunk-text">${c.w}</span>`;
        return d;
    }
    function createSaStep(s) {
        const d = document.createElement('div'); d.className = `sa-step-box ${s.type}`;
        d.innerHTML = `<div class="sa-step"><span class="sa-tag">${s.label}</span>${s.text}</div>`;
        return d;
    }
    function updateFooters(total) { document.querySelectorAll('.page-num').forEach((el, i) => el.innerText = `Page ${i+1}/${total}`); }
    
    async function downloadAllPages() {
        const btn = document.getElementById('btn-download');
        const originalText = btn.innerText;
        btn.innerText = "Processing... (Please Wait)";
        btn.style.opacity = "0.7";
        btn.disabled = true;

        try {
            const cards = document.querySelectorAll('.card');
            for (let i = 0; i < cards.length; i++) {
                const canvas = await html2canvas(cards[i], { scale: 2, useCORS: true, allowTaint: false, backgroundColor: '#ffffff', logging: false });
                canvas.toBlob(function(blob) {
                    if (!blob) { alert("Security Error: Use Local Server."); return; }
                    const link = document.createElement('a');
                    link.download = `TheWeekJunior_Page_${i + 1}.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                }, 'image/png');
                await new Promise(r => setTimeout(r, 500));
            }
        } catch (e) {
            console.error(e);
            alert("Error: " + e.message);
        } finally {
            btn.innerText = originalText;
            btn.style.opacity = "1";
            btn.disabled = false;
        }
    }

    window.loadFile = function(e) { document.getElementById('hero-img').src = URL.createObjectURL(e.target.files[0]); document.getElementById('hero-img').style.display='block'; document.getElementById('hero-txt').style.display='none'; };
    window.onload = render;</script></body></html>
