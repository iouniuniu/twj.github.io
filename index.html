<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Week Junior Podcast - Precise Sync</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #a855f7;
            --female-color: #ec4899;
            --male-color: #2dd4bf;
            --text-active: #ffffff;
            --word-highlight: #ff9f0a; /* 苹果风格的亮橘色 */
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }

        /* 动态背景 */
        .ambient-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, #4c1d95, #0f172a 70%, #000);
            z-index: -1;
            filter: blur(80px);
            opacity: 0.8;
            animation: breathe 10s infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* 顶部区域 */
        .player-header {
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: all 0.5s ease;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }

        .artwork-container {
            width: 140px;
            height: 185px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            overflow: hidden;
            background-color: #333;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .artwork-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info {
            text-align: center;
            transition: opacity 0.3s;
        }

        .track-title { font-size: 20px; font-weight: 800; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .track-artist { font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .track-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; font-weight: 400; letter-spacing: 0.5px; }

        /* UI控件 */
        .ui-controls {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            transition: opacity 0.5s, transform 0.5s;
        }

        .hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
            height: 0; 
            margin: 0;
        }

        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 20px; cursor: pointer; }
        .progress-fill { height: 100%; background: white; border-radius: 2px; width: 0%; transition: width 0.1s linear; }

        /* 歌词区域 */
        .transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px 150px 30px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            scroll-behavior: smooth;
        }
        
        .transcript-container::-webkit-scrollbar { display: none; }

        /* 句子样式 */
        .transcript-item {
            margin-bottom: 25px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0.3;
            filter: blur(1.5px);
            transform: scale(0.98);
            transform-origin: left center;
            cursor: pointer;
        }

        /* 句子激活状态 */
        .transcript-item.active {
            opacity: 1;
            filter: blur(0);
            transform: scale(1.05) translateX(10px);
        }

        .speaker-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0.8;
        }

        .speaker-female { background-color: var(--female-color); color: #fff; }
        .speaker-male { background-color: var(--male-color); color: #000; }

        .text-content {
            font-size: 22px;
            line-height: 1.5;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 单词样式 */
        .word-span {
            transition: color 0.1s ease, text-shadow 0.1s ease;
            display: inline-block; /* 允许 transform */
        }

        /* 单词激活状态：橘色高亮 */
        .word-active {
            color: var(--word-highlight);
            text-shadow: 0 0 15px rgba(255, 159, 10, 0.6);
            transform: scale(1.05);
        }

        /* 录制按钮 */
        .overlay-btn {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: black;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 100;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .overlay-btn:active { transform: translateX(-50%) scale(0.95); }

        /* 调试时间显示 */
        #debugTime {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            z-index: 2000;
            pointer-events: none;
        }

        /* 录制模式调整 */
        body.recording-mode .artwork-container { 
            width: 200px;
            height: 265px;
            margin-top: 30px; 
        }
        body.recording-mode .transcript-item.active .text-content { 
            /* 录制模式下，非高亮单词稍微暗一点，为了突出橘色 */
            color: rgba(255,255,255,0.9);
        }
        body.recording-mode #debugTime { display: none; }

    </style>
</head>
<body>

<div class="ambient-bg"></div>
<div id="debugTime">0.000</div>

<div class="player-header">
    <div class="artwork-container">
        <img src="cover.jpg" alt="Magazine Cover" class="artwork-img" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex';">
        <div id="placeholder" class="artwork-placeholder" style="display:none;">📖</div>
    </div>
    <div class="track-info">
        <h1 class="track-title">Secrets of the San José</h1>
        <div class="track-artist">The Week Junior Podcast</div>
        <div class="track-subtitle">523 期刊 - 20251217</div>
    </div>

    <div class="ui-controls" id="uiControls">
        <div class="progress-bar" id="progressBarContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 12px;">
            点击下方按钮进入“纯净录屏模式”
        </div>
    </div>
</div>

<div class="transcript-container" id="transcriptContainer">
    </div>

<button class="overlay-btn" id="recordBtn">
    🎥 开始录制模式
</button>

<audio id="audioPlayer">
    <source src="Secrets_of_the_San_José_Treasure_Wreck.m4a" type="audio/mp4">
    <source src="Secrets_of_the_San_José_Treasure_Wreck.mp3" type="audio/mpeg">
</audio>

<script>
    // ==========================================
    // ⬇️ 请在此处替换您的 JSON 数据 ⬇️
    // 数据结构说明：
    // 每个对象代表一个句子 (segment)
    // "start": 句子开始时间
    // "end": 句子结束时间
    // "speaker": "Female" 或 "Male"
    // "words": 单词数组，每个单词包含 word, start, end
    // ==========================================
    
    const transcriptData = [
        {
            "start": 0.00,
            "end": 6.00,
            "speaker": "Female",
            "words": [
                {"word": "Hello", "start": 0.00, "end": 0.50},
                {"word": "curious", "start": 0.50, "end": 1.00},
                {"word": "minds,", "start": 1.00, "end": 1.50},
                {"word": "welcome", "start": 1.50, "end": 2.00},
                {"word": "to", "start": 2.00, "end": 2.20},
                {"word": "the", "start": 2.20, "end": 2.40},
                {"word": "Week", "start": 2.40, "end": 2.80},
                {"word": "Junior,", "start": 2.80, "end": 3.30},
                {"word": "the", "start": 3.30, "end": 3.50},
                {"word": "podcast", "start": 3.50, "end": 4.00},
                {"word": "where", "start": 4.00, "end": 4.20},
                {"word": "we", "start": 4.20, "end": 4.40},
                {"word": "explore", "start": 4.40, "end": 4.90},
                {"word": "the", "start": 4.90, "end": 5.10},
                {"word": "news", "start": 5.10, "end": 5.50},
                {"word": "and", "start": 5.50, "end": 5.70},
                {"word": "practice", "start": 5.70, "end": 6.20},
                {"word": "English.", "start": 6.20, "end": 6.80}
            ]
        },
        {
            "start": 6.80,
            "end": 10.50,
            "speaker": "Female",
            "words": [
                {"word": "Today", "start": 6.80, "end": 7.20},
                {"word": "we", "start": 7.20, "end": 7.40},
                {"word": "are", "start": 7.40, "end": 7.60},
                {"word": "diving", "start": 7.60, "end": 8.00},
                {"word": "deep", "start": 8.00, "end": 8.40},
                {"word": "into", "start": 8.40, "end": 8.70},
                {"word": "a", "start": 8.70, "end": 8.90},
                {"word": "story", "start": 8.90, "end": 9.40},
                {"word": "that", "start": 9.40, "end": 9.60},
                {"word": "feels", "start": 9.60, "end": 9.90},
                {"word": "like", "start": 9.90, "end": 10.10},
                {"word": "it's", "start": 10.10, "end": 10.30},
                {"word": "straight", "start": 10.30, "end": 10.70},
                {"word": "out", "start": 10.70, "end": 10.90},
                {"word": "of", "start": 10.90, "end": 11.00},
                {"word": "a", "start": 11.00, "end": 11.10},
                {"word": "movie.", "start": 11.10, "end": 11.50}
            ]
        },
        // ⚠️ 重要：这里只是演示数据！请复制您的完整 JSON 替换上面的数组内容。
        // 为了确保代码运行，我只放了前两句。您需要放入完整的 WhisperX JSON。
    ];

    // ==========================================
    // ⬆️ 替换结束 ⬆️
    // ==========================================

    const audio = document.getElementById('audioPlayer');
    const container = document.getElementById('transcriptContainer');
    const recordBtn = document.getElementById('recordBtn');
    const uiControls = document.getElementById('uiControls');
    const progressFill = document.getElementById('progressFill');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const debugTime = document.getElementById('debugTime');

    let isRecordingMode = false;
    let currentActiveSentenceIndex = -1;
    let currentActiveWordElement = null;

    // 1. 初始化 DOM：根据 JSON 生成 HTML
    function initTranscript() {
        container.innerHTML = '';
        transcriptData.forEach((segment, index) => {
            const div = document.createElement('div');
            div.className = 'transcript-item';
            div.dataset.start = segment.start;
            div.dataset.end = segment.end;
            div.dataset.index = index;

            // 角色标签
            const speakerSpan = document.createElement('span');
            speakerSpan.className = `speaker-tag speaker-${segment.speaker.toLowerCase()}`;
            speakerSpan.textContent = segment.speaker;
            div.appendChild(speakerSpan);

            // 文本容器
            const p = document.createElement('p');
            p.className = 'text-content';

            // 生成单词 Span
            segment.words.forEach(wordObj => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word-span';
                wordSpan.textContent = wordObj.word + " "; // 补空格
                wordSpan.dataset.start = wordObj.start;
                wordSpan.dataset.end = wordObj.end;
                p.appendChild(wordSpan);
            });

            div.appendChild(p);
            container.appendChild(div);

            // 点击句子跳转
            div.addEventListener('click', (e) => {
                // 如果点击的是具体单词，跳转到单词时间
                if (e.target.classList.contains('word-span')) {
                    audio.currentTime = parseFloat(e.target.dataset.start);
                } else {
                    // 否则跳转到句子开始
                    audio.currentTime = segment.start;
                }
                if (audio.paused) audio.play();
            });
        });
    }

    // 2. 核心更新逻辑 (帧级调用)
    function updateTranscript() {
        const t = audio.currentTime;
        
        // --- 句子级高亮 ---
        let activeIndex = -1;
        // 查找当前句子 (假设数据有序，简单遍历即可，由于数据量不大，性能可接受)
        // 优化：只在当前索引附近查找
        for (let i = 0; i < transcriptData.length; i++) {
            if (t >= transcriptData[i].start && t < transcriptData[i].end) {
                activeIndex = i;
                break;
            }
        }

        // 状态切换：句子
        if (activeIndex !== -1 && activeIndex !== currentActiveSentenceIndex) {
            const prev = document.querySelector('.transcript-item.active');
            if (prev) prev.classList.remove('active');

            const current = container.children[activeIndex];
            if (current) {
                current.classList.add('active');
                current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            currentActiveSentenceIndex = activeIndex;
        }

        // --- 单词级高亮 ---
        // 只有当有激活句子时，才在其内部查找单词
        if (currentActiveSentenceIndex !== -1) {
            const activeSentenceDiv = container.children[currentActiveSentenceIndex];
            const wordSpans = activeSentenceDiv.querySelectorAll('.word-span');
            let foundWord = false;

            for (let span of wordSpans) {
                const start = parseFloat(span.dataset.start);
                const end = parseFloat(span.dataset.end);

                if (t >= start && t < end) {
                    if (currentActiveWordElement !== span) {
                        if (currentActiveWordElement) currentActiveWordElement.classList.remove('word-active');
                        span.classList.add('word-active');
                        currentActiveWordElement = span;
                    }
                    foundWord = true;
                    break; 
                }
            }
            
            // 如果当前时间不在任何单词范围内（比如句子中间的停顿），清除高亮
            if (!foundWord && currentActiveWordElement) {
                currentActiveWordElement.classList.remove('word-active');
                currentActiveWordElement = null;
            }
        }
    }

    // 事件监听
    audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + '%';
        if(!isRecordingMode) debugTime.textContent = audio.currentTime.toFixed(3);
        
        updateTranscript();
    });

    // 录制模式切换
    recordBtn.addEventListener('click', () => {
        isRecordingMode = !isRecordingMode;
        if (isRecordingMode) {
            document.body.classList.add('recording-mode');
            uiControls.classList.add('hidden-ui');
            recordBtn.style.opacity = '0';
            setTimeout(() => recordBtn.style.display = 'none', 300);
            audio.play();
        }
    });

    // 进度条点击
    progressBarContainer.addEventListener('click', (e) => {
        const rect = progressBarContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    });

    // 初始化
    initTranscript();

</script>

</body>
</html>
