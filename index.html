<svg viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 撞色风的高饱和发光 -->
    <filter id="bold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- 更加锐利的现代阴影 -->
    <filter id="crisp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1d4ed8" flood-opacity="0.15"/>
    </filter>

    <!-- 醒目的橘色渐变光束 -->
    <linearGradient id="bold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&amp;family=Playfair+Display:ital,wght@0,600;0,800;1,600&amp;display=swap');
      
      /* 字体：加粗提升现代感 */
      .serif-en { font-family: 'Playfair Display', serif; font-weight: 800; }
      .serif-cn { font-family: 'Noto Serif SC', serif; font-weight: 700; }
      
      /* 动画：安静的呼吸与渐隐渐现 */
      @keyframes fadeInSoft { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes floatSlower { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 0.9; transform: scale(1.02); } }
      @keyframes steamRise { 0% { opacity: 0; transform: translateY(0) scale(0.8); } 50% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-20px) scale(1.2); } }

      /* 面板入场 */
      .panel-1 { animation: fadeInSoft 1.5s ease-out forwards; opacity: 0; }
      .panel-2 { animation: fadeInSoft 1.5s ease-out 0.8s forwards; opacity: 0; }
      .panel-3 { animation: fadeInSoft 1.5s ease-out 1.6s forwards; opacity: 0; }
      .panel-4 { animation: fadeInSoft 1.5s ease-out 2.4s forwards; opacity: 0; }

      /* 元素动画 */
      .anim-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .anim-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float-2 { animation: floatSlower 7s ease-in-out infinite; }
      .anim-steam { animation: steamRise 3s ease-in-out infinite; }
      
      /* 撞色调色板定义 */
      .text-dark { fill: #111827; } /* 极黑 */
      .text-blue { fill: #1d4ed8; } /* 克莱因蓝 */
      .text-orange { fill: #ff5722; } /* 亮橘色 */
      .text-muted { fill: #64748b; }
    </style>
  </defs>

  <!-- 奶白暖色背景，衬托高饱和度色彩 -->
  <rect width="100%" height="100%" fill="#f3efe7" />

  <!-- ========================================== -->
  <!-- Panel 1: 引入 - 宁静 (窗边夜读) -->
  <!-- ========================================== -->
  <g transform="translate(30, 30)">
    <g class="panel-1">
      <rect width="690" height="270" rx="16" fill="#ffffff" filter="url(#crisp-shadow)" />
      
      <!-- 窗户与月光 (克莱因蓝 + 亮黄撞色) -->
      <g transform="translate(510, 30)">
        <rect x="0" y="0" width="140" height="170" rx="8" fill="#1d4ed8" />
        <circle cx="100" cy="40" r="20" fill="#ffc107" filter="url(#bold-glow)" />
      </g>

      <!-- 橘色光影投射 -->
      <polygon points="510,200 650,200 550,270 350,270" fill="url(#bold-light)" />

      <!-- 无脸极简人像 (水墨黑) -->
      <g transform="translate(430, 150)">
        <path d="M -50 120 C -40 20, 40 20, 50 120 Z" fill="#111827" />
        <circle cx="0" cy="20" r="35" fill="#ffedd5" /> <!-- 暖肤色 -->
        <!-- 手机微光 (青色高反差亮光) -->
        <rect x="25" y="60" width="20" height="35" rx="3" fill="#22d3ee" filter="url(#bold-glow)" />
        <line x1="10" y1="80" x2="25" y2="70" stroke="#111827" stroke-width="6" stroke-linecap="round" />
      </g>

      <!-- 冒热气的咖啡杯 (橘色) -->
      <g transform="translate(560, 240)">
        <path d="M -15 0 L 15 0 C 15 20, -15 20, -15 0 Z" fill="#ff5722" />
        <path d="M 15 5 C 22 5, 22 15, 15 15" fill="none" stroke="#ff5722" stroke-width="3" />
        <path d="M -5 -5 Q 0 -15 -5 -25" fill="none" stroke="#ffc107" stroke-width="2" class="anim-steam" />
        <path d="M 5 -5 Q 0 -15 5 -25" fill="none" stroke="#ffc107" stroke-width="2" class="anim-steam" style="animation-delay: 1.5s;" />
      </g>

      <!-- 旁白保持坐标，但颜色改为极黑，字重增加 -->
      <text x="40" y="110" font-size="20" class="serif-cn text-dark">岁末的深夜，屏幕微微亮起，</text>
      <text x="40" y="150" font-size="20" class="serif-cn text-dark">各大 App 悄然推送了</text>
      <text x="40" y="190" font-size="20" class="serif-cn text-dark">这一年的数据报告...</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 2: 呈现 - 绽放 (撞色波纹) -->
  <!-- ========================================== -->
  <g transform="translate(30, 320)">
    <g class="panel-2">
      <rect width="690" height="270" rx="16" fill="#ffffff" filter="url(#crisp-shadow)" />
      
      <g transform="translate(345, 135)">
        <!-- 高对比色波纹 -->
        <g class="anim-glow">
          <circle cx="0" cy="0" r="120" fill="none" stroke="#ffc107" stroke-width="3" opacity="0.6" />
          <circle cx="0" cy="0" r="90" fill="none" stroke="#ff5722" stroke-width="4" filter="url(#bold-glow)" />
          <circle cx="0" cy="0" r="60" fill="none" stroke="#1d4ed8" stroke-width="5" filter="url(#bold-glow)" />
        </g>
        
        <!-- 单词换为极为醒目的蓝色 -->
        <text x="0" y="15" text-anchor="middle" font-size="52" class="serif-en text-blue" letter-spacing="4">UBIQUITOUS</text>
        <text x="0" y="60" text-anchor="middle" font-size="18" class="serif-cn text-orange" letter-spacing="2">无 处 不 在 的</text>
      </g>
      
      <text x="345" y="235" text-anchor="middle" font-size="18" class="serif-cn text-dark">关于个人的数据印记，如涟漪般静静散开</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 3: 意境 - 隐喻 (高饱和度抽象图标) -->
  <!-- ========================================== -->
  <g transform="translate(30, 610)">
    <g class="panel-3">
      <rect width="690" height="270" rx="16" fill="#ffffff" filter="url(#crisp-shadow)" />
      
      <g transform="translate(345, 110)">
        <!-- 核心亮橘色 -->
        <circle cx="0" cy="0" r="12" fill="#ff5722" filter="url(#bold-glow)" />
        
        <!-- 环绕的高对比色隐喻 -->
        <g class="anim-float-1">
          <!-- 音乐 (蓝) -->
          <path d="M -120 -60 Q -100 -80 -80 -60" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" />
          <circle cx="-120" cy="-60" r="5" fill="#1d4ed8" />
          <text x="-100" y="-30" text-anchor="middle" font-size="15" class="serif-cn text-dark">听过的歌</text>
        </g>
        
        <g class="anim-float-2">
          <!-- 学习 (翡翠绿) -->
          <path d="M 100 -50 C 120 -80, 150 -50, 130 -30 C 110 0, 80 -30, 100 -50 Z" fill="#059669" />
          <text x="120" y="-10" text-anchor="middle" font-size="15" class="serif-cn text-dark">学过的词</text>
        </g>

        <g class="anim-float-1" style="animation-delay: -2s;">
          <!-- 饮食 (亮黄) -->
          <circle cx="-90" cy="50" r="16" fill="#ffc107" />
          <line x1="-90" y1="50" x2="-80" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <text x="-90" y="85" text-anchor="middle" font-size="15" class="serif-cn text-dark">尝过的食物</text>
        </g>

        <g class="anim-float-2" style="animation-delay: -3s;">
          <!-- 游戏 (紫色) -->
          <path d="M 120 30 Q 120 50 100 50 Q 120 50 120 70 Q 120 50 140 50 Q 120 50 120 30 Z" fill="#8b5cf6" />
          <text x="120" y="95" text-anchor="middle" font-size="15" class="serif-cn text-dark">游戏的片刻</text>
        </g>
      </g>

      <text x="345" y="250" text-anchor="middle" font-size="18" class="serif-cn text-dark">它静静地渗透并包裹着，生活里的每一个缝隙。</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Panel 4: 沉淀 - 手帐笔记 (黑框与撞色字体) -->
  <!-- ========================================== -->
  <g transform="translate(30, 900)">
    <g class="panel-4">
      <rect width="690" height="400" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="4" filter="url(#crisp-shadow)" />
      
      <!-- 醒目的打孔器 -->
      <g fill="#111827">
        <circle cx="40" cy="40" r="5" /> <circle cx="40" cy="80" r="5" />
        <circle cx="40" cy="120" r="5" /> <circle cx="40" cy="160" r="5" />
        <circle cx="40" cy="200" r="5" /> <circle cx="40" cy="240" r="5" />
        <circle cx="40" cy="280" r="5" /> <circle cx="40" cy="320" r="5" />
        <circle cx="40" cy="360" r="5" />
      </g>
      <line x1="65" y1="0" x2="65" y2="400" stroke="#ff5722" stroke-width="2" />

      <!-- 右下角亮橘色猫咪 -->
      <g transform="translate(600, 360)">
        <ellipse cx="0" cy="0" rx="25" ry="18" fill="#ff5722" />
        <path d="M -20 0 C -35 0, -35 -20, -15 -10" fill="none" stroke="#ff5722" stroke-width="6" stroke-linecap="round" />
        <polygon points="10,-15 15,-25 20,-15" fill="#ff5722" /> 
        <polygon points="20,-10 28,-18 28,-5" fill="#ff5722" />
      </g>

      <!-- 笔记内容撞色 -->
      <g transform="translate(100, 60)">
        <text x="0" y="10" font-size="34" class="serif-en text-blue" letter-spacing="2">Ubiquitous</text>
        <text x="210" y="10" font-size="18" class="serif-en text-muted">[ juːˈbɪkwɪtəs ]</text>
        
        <line x1="0" y1="45" x2="520" y2="45" stroke="#111827" stroke-width="2" />
        
        <text x="0" y="85" font-size="18" class="serif-cn text-orange">Etymology · 词源解析</text>
        <text x="0" y="120" font-size="16" class="serif-cn text-dark">UBI (何处) + QUE (皆是)</text>
        <text x="0" y="150" font-size="16" class="serif-cn text-muted">如同倾洒的月光，所及之处，皆有它的身影 = 无处不在</text>

        <line x1="0" y1="195" x2="520" y2="195" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 4" />

        <text x="0" y="240" font-size="16" class="serif-en text-dark" letter-spacing="0.5">"Packaging user data into graphics has become ubiquitous."</text>
        <text x="0" y="270" font-size="15" class="serif-cn text-muted">（将用户数据打包成图表的做法已无处不在。）</text>
      </g>
    </g>
  </g>
</svg>
