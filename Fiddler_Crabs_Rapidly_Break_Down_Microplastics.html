<html lang="zh-CN">
<head>

    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #a855f7;
            
            /* 定义颜色变量 */
            --female-color: #ec4899; /* 粉色 */
            --male-color: #2dd4bf;   /* 青色 */
            --unknown-color: #9ca3af;

            --text-normal: rgba(255, 255, 255, 0.4);
            --text-active: #ffffff;
            --word-highlight: #ff9f0a;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }

        .ambient-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, #4c1d95, #0f172a 70%, #000);
            z-index: -1;
            filter: blur(80px);
            opacity: 0.8;
            animation: breathe 10s infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .player-header {
            padding: 40px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: all 0.5s ease;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            flex-shrink: 0;
        }

        .artwork-container {
            width: 140px;
            height: 185px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            overflow: hidden;
            background-color: #333;
            position: relative;
            transition: all 0.5s ease;
        }

        .artwork-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info { 
            text-align: center; 
            transition: all 0.5s ease;
        }
        .track-title { font-size: 20px; font-weight: 800; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .track-artist { font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .track-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; font-weight: 400; letter-spacing: 0.5px; }

        .ui-controls {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            transition: opacity 0.5s, transform 0.5s;
        }

        .hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
            height: 0; 
            margin: 0;
            overflow: hidden;
        }

        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 20px; cursor: pointer; }
        .progress-fill { height: 100%; background: white; border-radius: 2px; width: 0%; transition: width 0.1s linear; }

        .transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px 150px 30px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            scroll-behavior: smooth;
            transition: all 0.5s ease;
        }
        .transcript-container::-webkit-scrollbar { display: none; }

        .transcript-item {
            margin-bottom: 30px;
            transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
            opacity: 0.3; 
            filter: blur(1.5px);
            transform: scale(0.98);
            transform-origin: left center;
            cursor: pointer;
            scroll-margin-top: 150px; 
        }

        .transcript-item.active {
            opacity: 1;
            filter: blur(0);
            transform: scale(1.0);
        }

        .speaker-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            opacity: 0.9;
            color: #fff;
        }

        /* 直接根据 JSON 中的 speaker 名字匹配
           如果 JSON 里是 "Female"，会匹配 .speaker-female
           如果 JSON 里是 "Male"，会匹配 .speaker-male
        */
        .speaker-female { background-color: var(--female-color); }
        .speaker-male   { background-color: var(--male-color); color: #000 !important; }
        .speaker-unknown { background-color: var(--unknown-color); }

        .text-content {
            font-size: 24px;
            line-height: 1.6;
            font-weight: 600;
            margin: 0;
            color: var(--text-active);
            word-wrap: break-word;
        }

        .word-span {
            transition: color 0.1s ease, text-shadow 0.1s ease;
            display: inline;
            border-radius: 4px;
            margin: 0; 
            padding: 0;
        }

        .word-active {
            color: var(--word-highlight);
            text-shadow: 0 0 15px rgba(255, 159, 10, 0.7);
        }

        /* 底部按钮栏 */
        .btn-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            transition: all 0.3s;
            width: 90%;
            justify-content: center;
        }

        .overlay-btn {
            background: white;
            color: black;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
            white-space: nowrap;
        }
        .overlay-btn:active { transform: scale(0.95); }
        
        /* 录制进度条 (PC) */
        .recording-controls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px; 
            z-index: 2000;
            display: none; 
        }

        .rec-progress-bar {
            height: 100%;
            background-color: #ff4444;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
        }

        /* 电脑端停止按钮 (悬停) */
        .stop-rec-hitbox {
            position: fixed;
            top: 0;
            right: 0;
            width: 150px; 
            height: 100px;
            z-index: 2001;
            display: none; 
        }

        .stop-rec-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 68, 68, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none; 
        }

        .stop-rec-hitbox:hover .stop-rec-btn {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #debugTime {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            z-index: 2000;
            pointer-events: none;
        }

        /* =========================================
           沉浸/录制模式通用样式
           ========================================= */
        body.recording-mode {
            position: fixed; 
            width: 100%;
            height: 100%;
            background: #000;
        }

        body.recording-mode .player-header { 
            padding-top: 40px; 
            padding-bottom: 0px; 
        }
        
        body.recording-mode .artwork-container { 
            width: 120px; 
            height: 160px; 
            margin-top: 0; 
            margin-bottom: 5px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        body.recording-mode .track-info { 
            transform: scale(0.9); 
            margin-bottom: 0;
        }
        
        body.recording-mode .transcript-container { 
            padding-top: 0px; 
            mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 90%, transparent 100%);
        }
        
        body.recording-mode .transcript-item.active .text-content { 
            color: rgba(255,255,255,0.95);
        }
        
        /* 隐藏 UI */
        body.recording-mode #debugTime { display: none; }
        body.recording-mode .btn-container { opacity: 0; pointer-events: none; }
        body.recording-mode .ui-controls { opacity: 0; pointer-events: none; height: 0; margin: 0;}

        /* PC特有：仅PC模式显示录制控制条 */
        body.recording-mode.pc-mode .recording-controls { display: block; }
        body.recording-mode.pc-mode .stop-rec-hitbox { display: block; }

    </style>
</head>

    const audio = document.getElementById('audioPlayer');
    const container = document.getElementById('transcriptContainer');
    const playModeBtn = document.getElementById('playModeBtn');
    const recordVideoBtn = document.getElementById('recordVideoBtn');
    const mobileRecordBtn = document.getElementById('mobileRecordBtn');
    const stopRecBtn = document.getElementById('stopRecBtn');
    const btnContainer = document.getElementById('btnContainer');
    const uiControls = document.getElementById('uiControls');
    const progressFill = document.getElementById('progressFill');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const debugTime = document.getElementById('debugTime');
    const recProgressBar = document.getElementById('recProgressBar');
    const tips = document.getElementById('tips');

    let isRecordingMode = false;
    let processedData = []; 
    let currentActiveBlockIndex = -1;
    let currentActiveWordElement = null;
    let animationFrameId;
    let mediaRecorder;
    let recordedChunks = [];
    let recStream = null;

    // --- 设备检测 ---
    function checkDevice() {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            // PC
            recordVideoBtn.style.display = 'flex';
            tips.textContent = '提示: 电脑录制请勾选 "分享音频"';
        } else {
            // Mobile
            mobileRecordBtn.style.display = 'flex';
            tips.textContent = '提示: 点击下方按钮进入全屏沉浸模式';
        }
    }
    checkDevice();

    function mergeTranscriptSegments(rawData) {
        if (!rawData || rawData.length === 0) return [];
        const merged = [];
        let currentBlock = {
            speaker: rawData[0].speaker, // 直接用 speaker 名称
            start: rawData[0].start,
            end: rawData[0].end,
            words: [...(rawData[0].words || [])]
        };
        for (let i = 1; i < rawData.length; i++) {
            const nextSegment = rawData[i];
            const projectedDuration = nextSegment.end - currentBlock.start;
            
            // 依据 Speaker 名称合并
            if (nextSegment.speaker === currentBlock.speaker && projectedDuration <= 10.0) {
                currentBlock.end = nextSegment.end;
                if (nextSegment.words) {
                    currentBlock.words = currentBlock.words.concat(nextSegment.words);
                }
            } else {
                merged.push(currentBlock);
                currentBlock = {
                    speaker: nextSegment.speaker, // 直接用 speaker 名称
                    start: nextSegment.start,
                    end: nextSegment.end,
                    words: [...(nextSegment.words || [])]
                };
            }
        }
        merged.push(currentBlock);
        return merged;
    }

    function initTranscript() {
        if (!rawTranscriptData || rawTranscriptData.length === 0) {
            container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">暂无数据</div>';
            return;
        }

        processedData = mergeTranscriptSegments(rawTranscriptData);
        container.innerHTML = '';
        
        processedData.forEach((block, index) => {
            const div = document.createElement('div');
            div.className = 'transcript-item';
            div.dataset.start = block.start;
            div.dataset.end = block.end;
            div.dataset.index = index;

            // --- Speaker 逻辑 (直接读取名称) ---
            const speakerSpan = document.createElement('span');
            // 获取 JSON 中的名字，例如 "Female", "Male", "John"
            const speakerName = block.speaker || 'Unknown';
            
            // 转换为 CSS 安全类名 (小写，去除空格)
            // Example: "Female" -> "speaker-female", "Mr. John" -> "speaker-mr-john"
            const cssClassSuffix = speakerName.toLowerCase().replace(/[^a-z0-9]/g, '-');
            
            speakerSpan.className = `speaker-tag speaker-${cssClassSuffix}`;
            speakerSpan.textContent = speakerName;
            
            div.appendChild(speakerSpan);
            // ----------------------------------

            const p = document.createElement('p');
            p.className = 'text-content';

            if (block.words) {
                block.words.forEach((wordObj, wIndex) => {
                    const wordSpan = document.createElement('span');
                    wordSpan.className = 'word-span';
                    wordSpan.textContent = wordObj.word; 
                    wordSpan.dataset.start = wordObj.start;
                    wordSpan.dataset.end = wordObj.end;
                    p.appendChild(wordSpan);
                    if (wIndex < block.words.length - 1) {
                        p.appendChild(document.createTextNode(" "));
                    }
                });
            } else {
                p.textContent = block.sentence;
            }

            div.appendChild(p);
            container.appendChild(div);

            div.addEventListener('click', (e) => {
                if (e.target.classList.contains('word-span')) {
                    audio.currentTime = parseFloat(e.target.dataset.start);
                } else {
                    audio.currentTime = block.start;
                }
                if (audio.paused) audio.play();
            });
        });
    }

    function renderLoop() {
        if (!audio.paused) {
            updateTranscript();
            if (isRecordingMode && audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                recProgressBar.style.width = pct + '%';
            }
        }
        animationFrameId = requestAnimationFrame(renderLoop);
    }

    function updateTranscript() {
        const t = audio.currentTime;
        let activeBlockIndex = -1;
        for (let i = 0; i < processedData.length; i++) {
            if (t >= processedData[i].start && t < processedData[i].end) {
                activeBlockIndex = i;
                break;
            }
        }

        if (activeBlockIndex !== -1 && activeBlockIndex !== currentActiveBlockIndex) {
            const prev = document.querySelector('.transcript-item.active');
            if (prev) prev.classList.remove('active');

            const current = container.children[activeBlockIndex];
            if (current) {
                current.classList.add('active');
                current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            currentActiveBlockIndex = activeBlockIndex;
        }

        if (currentActiveBlockIndex !== -1) {
            const activeBlockElement = container.children[currentActiveBlockIndex];
            const wordSpans = activeBlockElement.querySelectorAll('.word-span');
            let foundWord = false;

            for (let span of wordSpans) {
                const start = parseFloat(span.dataset.start);
                const end = parseFloat(span.dataset.end);
                if (t >= start && t < end + 0.05) { 
                    if (currentActiveWordElement !== span) {
                        if (currentActiveWordElement) currentActiveWordElement.classList.remove('word-active');
                        span.classList.add('word-active');
                        currentActiveWordElement = span;
                    }
                    foundWord = true;
                    break; 
                }
            }
            if (!foundWord && currentActiveWordElement) {
                currentActiveWordElement.classList.remove('word-active');
                currentActiveWordElement = null;
            }
        }
    }

    // --- PC 内录 ---
    async function startVideoRecording() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: {
                    width: { ideal: 1080 },  
                    height: { ideal: 1920 }, 
                    frameRate: { ideal: 60 } 
                },
                audio: {
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false,  
                    sampleRate: 48000        
                },
                preferCurrentTab: true, 
                selfBrowserSurface: "include", 
                systemAudio: "include" 
            });

            recStream = stream;

            const audioTrack = stream.getAudioTracks()[0];
            if (!audioTrack) {
                alert("❌ 错误：您未勾选【分享音频】。");
                stopEverything();
                return;
            }

            enterRecordingMode('pc');

            const mimeType = MediaRecorder.isTypeSupported("video/webm; codecs=vp9,opus") 
                           ? "video/webm; codecs=vp9,opus" 
                           : "video/webm";
            
            mediaRecorder = new MediaRecorder(stream, { 
                mimeType, 
                videoBitsPerSecond: 15000000 
            }); 
            
            recordedChunks = [];
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = saveRecording;

            mediaRecorder.start();
            console.log("🎥 PC内录开始");
            
            setTimeout(() => {
                audio.currentTime = 0;
                audio.play();
            }, 1000);

            audio.onended = () => stopEverything();
            stream.getVideoTracks()[0].onended = () => stopEverything();

        } catch (err) {
            console.error("Error:", err);
            if (err.name !== 'NotAllowedError') alert("启动失败：" + err.message);
        }
    }

    // --- 手机全屏沉浸 (无弹窗) ---
    function startMobileRecordingPrep() {
        // 尝试全屏
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(e => {});
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        }

        enterRecordingMode('mobile');
        
        console.log("📱 手机沉浸模式，静默倒计时5秒");
        setTimeout(() => {
            audio.currentTime = 0;
            audio.play();
        }, 5000);
    }

    function stopEverything() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        audio.pause();
        if (recStream) {
            recStream.getTracks().forEach(track => track.stop());
        }
        exitRecordingMode();
    }

    function saveRecording() {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        document.body.appendChild(a);
        a.style.display = "none";
        a.href = url;
        const filename = document.title.replace(/\s+/g, '_') + "_1080P.webm";
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(url);
    }

    function enterRecordingMode(type) {
        isRecordingMode = true;
        document.body.classList.add('recording-mode');
        
        if (type === 'pc') {
            document.body.classList.add('pc-mode');
        } else if (type === 'mobile') {
            document.body.classList.add('mobile-mode');
        }

        uiControls.classList.add('hidden-ui');
        btnContainer.style.opacity = '0'; 
        btnContainer.style.pointerEvents = 'none';
        recProgressBar.style.width = '0%';
    }

    function exitRecordingMode() {
        isRecordingMode = false;
        document.body.classList.remove('recording-mode', 'pc-mode', 'mobile-mode');
        uiControls.classList.remove('hidden-ui');
        btnContainer.style.opacity = '1';
        btnContainer.style.pointerEvents = 'auto';
        
        if (document.exitFullscreen) {
            document.exitFullscreen().catch(e => {});
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    }

    // Listeners
    audio.addEventListener('play', () => {
        cancelAnimationFrame(animationFrameId);
        renderLoop();
    });
    audio.addEventListener('pause', () => cancelAnimationFrame(animationFrameId));
    audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + '%';
        if(!isRecordingMode) debugTime.textContent = audio.currentTime.toFixed(3);
    });

    playModeBtn.addEventListener('click', () => {
        if (!isRecordingMode) {
            // 复用手机模式，不显示 PC 控件
            enterRecordingMode('mobile');
            console.log("5秒后播放...");
            setTimeout(() => { audio.play(); }, 5000);
        }
    });

    recordVideoBtn.addEventListener('click', startVideoRecording);
    mobileRecordBtn.addEventListener('click', startMobileRecordingPrep);
    
    stopRecBtn.addEventListener('click', stopEverything);

    progressBarContainer.addEventListener('click', (e) => {
        const rect = progressBarContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
        updateTranscript();
    });

    initTranscript();

</script>
